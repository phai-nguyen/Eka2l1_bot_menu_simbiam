name: Build EKA2L1 SYMBIAN SYSTEMAPPS1 MENUUI29 PENINPUTTRACE1 NOJAVA MANIC3 IPA

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-app:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
    - name: Checkout project
      uses: actions/checkout@v4

    - name: Restore MENUUI29 cache
      id: menuui29_cache
      uses: actions/cache/restore@v4
      with:
        path: upstream
        key: eka2l1-menuui29-peninputtrace1-nojava-manic3-macos15-v1

    - name: Restore MENUUI28 baseline
      id: menuui28_cache
      if: steps.menuui29_cache.outputs.cache-hit != 'true'
      uses: actions/cache/restore@v4
      with:
        path: upstream
        key: eka2l1-menuui28-peninputanim1-nojava-manic3-macos15-v1

    - name: Apply MENUUI29 PenInput IPC trace and rebuild
      if: steps.menuui29_cache.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail
        LOG="$GITHUB_WORKSPACE/eka2l1-menuui29-peninputtrace1.log"
        : > "$LOG"
        exec > >(tee -a "$LOG") 2>&1

        test "${{ steps.menuui28_cache.outputs.cache-hit }}" = "true"

        UPSTREAM="$GITHUB_WORKSPACE/upstream"
        PATCHER="$GITHUB_WORKSPACE/apply_menuui29_peninputtrace1.py"
        CMAKE_BIN="$UPSTREAM/.tools/cmake-3.31.6-macos-universal/CMake.app/Contents/bin/cmake"
        SVC="$UPSTREAM/src/emu/kernel/src/svc.cpp"
        ANIM="$UPSTREAM/src/emu/services/src/window/classes/plugins/animdll.cpp"

        python3 -m py_compile "$PATCHER"
        python3 "$PATCHER" "$UPSTREAM"

        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI29 PENINPUT_IPC: stage=send' "$SVC"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI29 PENINPUT_IPC: stage=return' "$SVC"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI28 PENINPUT_ANIM:' "$ANIM"
        test ! -e "$UPSTREAM/src/emu/j2me"

        git -C "$UPSTREAM" diff --check
        "$CMAKE_BIN" --build "$UPSTREAM/build-ios-device" --target eka2l1 --parallel 4

        APP="$UPSTREAM/build-ios-device/src/emu/ios/eka2l1.app"
        BIN="$APP/eka2l1"
        test -x "$BIN"
        STRINGS_OUT="$RUNNER_TEMP/menuui29.strings"
        strings "$BIN" > "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI29 PENINPUT_IPC:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI28 PENINPUT_ANIM:' "$STRINGS_OUT"
        ! grep -Eiq 'phoneME|JAVA-STABLE1|MMAPI-DIAG2|GM-SYNTH1 renderer=gm-sf2' "$STRINGS_OUT"

        {
          echo 'MENUUI29 PENINPUTTRACE1 NOJAVA MANIC3 BUILD AUDIT'
          echo 'base_cache=MENUUI28_PENINPUTANIM1_NOJAVA_MANIC3'
          echo 'behavior_change=NONE'
          echo 'peninputserver_guest_ipc=SEND_RETURN_TRACED'
          echo 'target_opcodes=0x0D,0x0E,0x0F,0x12,0x13,0x1D'
          echo 'MENUUI28=PRESERVED'
          echo 'java_j2me=REMOVED'
        } > "$GITHUB_WORKSPACE/MENUUI29-PENINPUTTRACE1-BUILD-AUDIT.txt"
        git -C "$UPSTREAM" diff > "$GITHUB_WORKSPACE/MENUUI29-PENINPUTTRACE1-source.diff"

    - name: Verify restored MENUUI29 cache
      if: steps.menuui29_cache.outputs.cache-hit == 'true'
      run: |
        set -euo pipefail
        UPSTREAM="$GITHUB_WORKSPACE/upstream"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI29 PENINPUT_IPC:' "$UPSTREAM/src/emu/kernel/src/svc.cpp"
        test -x "$UPSTREAM/build-ios-device/src/emu/ios/eka2l1.app/eka2l1"
        test ! -e "$UPSTREAM/src/emu/j2me"
        : > "$GITHUB_WORKSPACE/MENUUI29-PENINPUTTRACE1-source.diff"
        echo 'MENUUI29 PENINPUTTRACE1 cache_hit=true' > "$GITHUB_WORKSPACE/MENUUI29-PENINPUTTRACE1-BUILD-AUDIT.txt"

    - name: Save MENUUI29 cache
      if: steps.menuui29_cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: upstream
        key: eka2l1-menuui29-peninputtrace1-nojava-manic3-macos15-v1

    - name: Package MENUUI29 unsigned IPA
      run: |
        set -euo pipefail
        APP="$GITHUB_WORKSPACE/upstream/build-ios-device/src/emu/ios/eka2l1.app"
        IPA="$GITHUB_WORKSPACE/upstream/EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI29-PENINPUTTRACE1-NOJAVA-MANIC3-unsigned.ipa"
        STAGE="$RUNNER_TEMP/ipa-stage-menuui29"
        rm -rf "$STAGE" "$IPA"
        mkdir -p "$STAGE/Payload"
        cp -R "$APP" "$STAGE/Payload/EKA2L1.app"
        rm -rf "$STAGE/Payload/EKA2L1.app/_CodeSignature"
        rm -f "$STAGE/Payload/EKA2L1.app/embedded.mobileprovision"
        (cd "$STAGE" && /usr/bin/zip -qry "$IPA" Payload)
        /usr/bin/unzip -t "$IPA" >/dev/null
        shasum -a 256 "$IPA" | tee "$GITHUB_WORKSPACE/MENUUI29-PENINPUTTRACE1-IPA-SHA256.txt"

    - name: Upload MENUUI29 IPA
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI29-PENINPUTTRACE1-NOJAVA-MANIC3-IPA
        path: upstream/EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI29-PENINPUTTRACE1-NOJAVA-MANIC3-unsigned.ipa
        retention-days: 14

    - name: Upload MENUUI29 audit
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI29-PENINPUTTRACE1-NOJAVA-MANIC3-AUDIT
        path: |
          MENUUI29-PENINPUTTRACE1-BUILD-AUDIT.txt
          MENUUI29-PENINPUTTRACE1-source.diff
          MENUUI29-PENINPUTTRACE1-IPA-SHA256.txt
        retention-days: 14

    - name: Upload diagnostic log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI29-PENINPUTTRACE1-diagnostic-log
        path: eka2l1-menuui29-peninputtrace1.log
        if-no-files-found: warn
        retention-days: 14
