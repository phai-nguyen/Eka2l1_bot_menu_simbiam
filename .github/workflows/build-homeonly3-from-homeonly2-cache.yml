name: Build HOMEONLY3 Keep Menu3 on Home Exit

"on":
  push:
    branches:
      - codex/m3home-homeonly2-build
    paths:
      - ".github/workflows/build-homeonly3-homeexitkeep.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
    - name: Checkout build host
      uses: actions/checkout@v4

    - name: Restore clean HOMEONLY2 cache
      id: home2
      uses: actions/cache/restore@v4
      with:
        path: upstream
        key: eka2l1-homeonly2-clean-menuui36-nojava-manic3-macos15-v1

    - name: Require HOMEONLY2 baseline
      run: |
        set -euo pipefail
        test "${{ steps.home2.outputs.cache-hit }}" = "true"
        UPSTREAM="$GITHUB_WORKSPACE/upstream"
        BIN="$UPSTREAM/build-ios-device/src/emu/ios/eka2l1.app/eka2l1"
        test -x "$BIN"
        test ! -e "$UPSTREAM/src/emu/j2me"
        strings "$BIN" > "$RUNNER_TEMP/home2.strings"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI36 WG_FOCUS:' "$RUNNER_TEMP/home2.strings"
        grep -Fq '[M3HOME1][APPARC_REQUEST]' "$RUNNER_TEMP/home2.strings"
        grep -Fq '[HOMEONLY1][CEN_GET_STRING] phase=pre_write' "$RUNNER_TEMP/home2.strings"
        ! grep -Fq '[NBOOT2]' "$RUNNER_TEMP/home2.strings"
        ! grep -Fq '[COMPATBOOT]' "$RUNNER_TEMP/home2.strings"

    - name: Fetch HOMEONLY3 source
      run: |
        set -euo pipefail
        git clone --depth 1 --branch codex/menu3-homeonly3           https://github.com/phai-nguyen/Eka2l1-nhanh-menuu3.git "$GITHUB_WORKSPACE/home3-src"
        git -C "$GITHUB_WORKSPACE/home3-src" rev-parse HEAD | tee HOMEONLY3-SOURCE-HEAD.txt

    - name: Apply HOMEONLY3 lifecycle patch
      run: |
        set -euo pipefail
        SRC="$GITHUB_WORKSPACE/home3-src"
        UPSTREAM="$GITHUB_WORKSPACE/upstream"
        python3 -m py_compile "$SRC/apply_homeonly3_homeexitkeep1.py" "$SRC/test_homeonly3_homeexitkeep1.py"
        python3 "$SRC/apply_homeonly3_homeexitkeep1.py" "$UPSTREAM"
        python3 "$SRC/test_homeonly3_homeexitkeep1.py" "$UPSTREAM"
        git -C "$UPSTREAM" diff --check
        git -C "$UPSTREAM" diff > HOMEONLY3-source.diff

    - name: Incremental build HOMEONLY3
      run: |
        set -euo pipefail
        UPSTREAM="$GITHUB_WORKSPACE/upstream"
        CMAKE_BIN="$UPSTREAM/.tools/cmake-3.31.6-macos-universal/CMake.app/Contents/bin/cmake"
        "$CMAKE_BIN" --build "$UPSTREAM/build-ios-device" --target eka2l1 --parallel 4

        BIN="$UPSTREAM/build-ios-device/src/emu/ios/eka2l1.app/eka2l1"
        test -x "$BIN"
        strings "$BIN" > "$RUNNER_TEMP/home3.strings"
        grep -Fq '[HOMEONLY3][HOME_EXIT_KEEP_MENU3]' "$RUNNER_TEMP/home3.strings"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI36 WG_FOCUS:' "$RUNNER_TEMP/home3.strings"
        grep -Fq '[M3HOME1][APPARC_REQUEST]' "$RUNNER_TEMP/home3.strings"
        grep -Fq '[HOMEONLY1][CEN_GET_STRING] phase=pre_write' "$RUNNER_TEMP/home3.strings"
        ! grep -Fq '[NBOOT2]' "$RUNNER_TEMP/home3.strings"
        ! grep -Fq '[COMPATBOOT]' "$RUNNER_TEMP/home3.strings"
        test ! -e "$UPSTREAM/src/emu/j2me"

        {
          echo 'HOMEONLY3 BUILD AUDIT'
          echo 'baseline=HOMEONLY2_CLEAN_MENUUI36_NOJAVA'
          echo 'home_exit_policy=KEEP_EMULATOR_RESTORE_MENU3'
          echo 'ordinary_game_exit_policy=PRESERVED'
          echo 'guest_home_panic=NOT_BYPASSED'
          echo 'nativeboot=ABSENT'
          echo 'compatboot=ABSENT'
          echo 'java_j2me=REMOVED'
        } > HOMEONLY3-BUILD-AUDIT.txt

    - name: Save HOMEONLY3 cache
      uses: actions/cache/save@v4
      with:
        path: upstream
        key: eka2l1-homeonly3-keepmenu3-macos15-v1

    - name: Package HOMEONLY3 IPA
      run: |
        set -euo pipefail
        APP="$GITHUB_WORKSPACE/upstream/build-ios-device/src/emu/ios/eka2l1.app"
        IPA="$GITHUB_WORKSPACE/upstream/EKA2L1-HOMEONLY3-KEEP-MENU3-unsigned.ipa"
        STAGE="$RUNNER_TEMP/ipa-stage-home3"
        rm -rf "$STAGE" "$IPA"
        mkdir -p "$STAGE/Payload"
        cp -R "$APP" "$STAGE/Payload/EKA2L1.app"
        rm -rf "$STAGE/Payload/EKA2L1.app/_CodeSignature"
        rm -f "$STAGE/Payload/EKA2L1.app/embedded.mobileprovision"
        (cd "$STAGE" && /usr/bin/zip -qry "$IPA" Payload)
        /usr/bin/unzip -t "$IPA" >/dev/null
        ! /usr/bin/unzip -l "$IPA" | grep -Eiq '\.jar([[:space:]]|$)'
        shasum -a 256 "$IPA" | tee HOMEONLY3-IPA-SHA256.txt

    - name: Upload HOMEONLY3 IPA
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-HOMEONLY3-KEEP-MENU3-IPA
        path: upstream/EKA2L1-HOMEONLY3-KEEP-MENU3-unsigned.ipa
        retention-days: 14

    - name: Upload HOMEONLY3 audit
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-HOMEONLY3-KEEP-MENU3-AUDIT
        path: |
          HOMEONLY3-SOURCE-HEAD.txt
          HOMEONLY3-source.diff
          HOMEONLY3-BUILD-AUDIT.txt
          HOMEONLY3-IPA-SHA256.txt
        if-no-files-found: warn
        retention-days: 14
