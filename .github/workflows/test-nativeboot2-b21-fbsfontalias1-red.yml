name: RED B21 FBSFONTALIAS1 Contract

"on":
  push:
    branches:
      - nativeboot2-b21-fbsfontalias1
    paths:
      - test_nativeboot2_b21_fbsfontalias1.py
      - .github/workflows/test-nativeboot2-b21-fbsfontalias1-red.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  red:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Restore B19 baseline from default branch
        id: b19
        uses: actions/cache/restore@v4
        with:
          path: upstream
          key: eka2l1-nativeboot2-b19-salangabi1-nojava-manic3-macos15-v1
      - name: Recreate B20 and verify B21 contract is RED
        run: |
          set -euo pipefail
          test "${{ steps.b19.outputs.cache-hit }}" = "true"
          python3 apply_nativeboot2_b20_cenresetall1.py upstream
          python3 test_nativeboot2_b20_cenresetall1.py upstream
          python3 test_nativeboot2_b21_fbsfontalias1.py upstream
