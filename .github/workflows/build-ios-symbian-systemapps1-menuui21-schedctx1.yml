name: Build EKA2L1 SYMBIAN SYSTEMAPPS1 MENUUI21 SCHEDCTX1 IPA

"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/run-menuui21-schedctx1

permissions:
  contents: read

jobs:
  build-app:
    runs-on: macos-15
    timeout-minutes: 120

    steps:
    - name: Checkout project history
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Replay frozen MENUUI20 authority build chain
      run: |
        set -euo pipefail
        LOG="$GITHUB_WORKSPACE/eka2l1-java-build.log"
        : > "$LOG"
        exec > >(tee -a "$LOG") 2>&1

        SOURCE_COMMIT="af251eddc28113c1807dcdc41fcafa5f2904b464"
        SOURCE_WORKFLOW=".github/workflows/build-ios-symbian-systemapps1-menuui20-activeqdir1.yml"
        SOURCE_YML="$RUNNER_TEMP/menuui21-menuui20-authority.yml"
        EXTRACT_DIR="$RUNNER_TEMP/menuui21-menuui20-steps"
        FROZEN_MENUUI20_PATCHER="$GITHUB_WORKSPACE/.menuui21-frozen-apply-menuui20-activeqdir1-fix1.py"
        FROZEN_MENUUI20_ORIGINAL="$GITHUB_WORKSPACE/.menuui21-frozen-apply-menuui20-activeqdir1.py"

        git cat-file -e "$SOURCE_COMMIT^{commit}"
        git show "$SOURCE_COMMIT:$SOURCE_WORKFLOW" > "$SOURCE_YML"
        git show "$SOURCE_COMMIT:apply_menuui20_activeqdir1_fix1.py" > "$FROZEN_MENUUI20_PATCHER"
        git show "$SOURCE_COMMIT:apply_menuui20_activeqdir1.py" > "$FROZEN_MENUUI20_ORIGINAL"
        test -s "$SOURCE_YML"
        test -s "$FROZEN_MENUUI20_PATCHER"
        test -s "$FROZEN_MENUUI20_ORIGINAL"

        rm -rf "$EXTRACT_DIR"
        mkdir -p "$EXTRACT_DIR"

        python3 - "$SOURCE_YML" "$EXTRACT_DIR" "$FROZEN_MENUUI20_PATCHER" "$FROZEN_MENUUI20_ORIGINAL" <<'PY_EXTRACT'
        import sys
        from pathlib import Path

        source = Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()
        out = Path(sys.argv[2])
        frozen_menuui20 = sys.argv[3]
        frozen_menuui20_original = sys.argv[4]
        wanted = [
            "Replay frozen MENUUI19 authority build chain",
            "Apply MENUUI20 ACTIVEQDIR1 FIX1 diagnostic traces and rebuild",
        ]

        found = {}
        i = 0
        while i < len(source):
            if not source[i].startswith("    - name:"):
                i += 1
                continue
            name = source[i].split("    - name:", 1)[1].strip()
            j = i + 1
            run_index = None
            while j < len(source) and not source[j].startswith("    - name:"):
                if source[j].startswith("      run: |"):
                    run_index = j
                    break
                j += 1
            if name in wanted:
                if run_index is None:
                    raise SystemExit(f"MENUUI21: missing run block: {name}")
                k = run_index + 1
                body = []
                while k < len(source) and not source[k].startswith("    - name:"):
                    row = source[k]
                    if row.startswith("        "):
                        body.append(row[8:])
                    elif row.strip() == "":
                        body.append("")
                    else:
                        break
                    k += 1
                found[name] = "\n".join(body) + "\n"
            i = max(j, i + 1)

        missing = [name for name in wanted if name not in found]
        if missing:
            raise SystemExit("MENUUI21: missing frozen MENUUI20 steps: " + ", ".join(missing))

        patcher_anchor = 'PATCHER="$GITHUB_WORKSPACE/apply_menuui20_activeqdir1_fix1.py"'
        original_anchor = 'ORIGINAL_PATCHER="$GITHUB_WORKSPACE/apply_menuui20_activeqdir1.py"'
        if found[wanted[1]].count(patcher_anchor) != 1:
            raise SystemExit("MENUUI21: frozen MENUUI20 patcher anchor changed")
        if found[wanted[1]].count(original_anchor) != 1:
            raise SystemExit("MENUUI21: frozen MENUUI20 original anchor changed")
        found[wanted[1]] = found[wanted[1]].replace(
            patcher_anchor, f'PATCHER="{frozen_menuui20}"', 1
        ).replace(
            original_anchor, f'ORIGINAL_PATCHER="{frozen_menuui20_original}"', 1
        )

        for idx, name in enumerate(wanted, 1):
            script = out / f"step{idx}.sh"
            script.write_text("#!/usr/bin/env bash\n" + found[name], encoding="utf-8")
            print(f"MENUUI21: extracted authority step {idx}: {name}")
        PY_EXTRACT

        for n in 1 2; do
          SCRIPT="$EXTRACT_DIR/step${n}.sh"
          chmod +x "$SCRIPT"
          (cd "$GITHUB_WORKSPACE" && bash "$SCRIPT")
        done

        UPSTREAM="$GITHUB_WORKSPACE/upstream"
        BIN="$UPSTREAM/build-ios-device/src/emu/ios/eka2l1.app/eka2l1"
        SVC="$UPSTREAM/src/emu/kernel/src/svc.cpp"
        WINDOW="$UPSTREAM/src/emu/services/src/window/window.cpp"

        test -x "$BIN"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI16 ADVFLAG1:' "$WINDOW"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI17 ALF_PTR_ARM:' "$SVC"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI18 CLIENT_STATUS:' "$SVC"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI19 AO_TRACK:' "$SVC"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI20 ACTIVEQ_HEAD:' "$SVC"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI20 ACTIVEQ_DIR:' "$SVC"

        echo 'MENUUI21: frozen MENUUI20 authority replay PASS'

    - name: Apply MENUUI21 SCHEDCTX1 diagnostic traces and rebuild
      run: |
        set -euo pipefail
        LOG="$GITHUB_WORKSPACE/eka2l1-java-build.log"
        touch "$LOG"
        exec > >(tee -a "$LOG") 2>&1

        UPSTREAM="$GITHUB_WORKSPACE/upstream"
        PATCHER="$GITHUB_WORKSPACE/apply_menuui21_schedctx1.py"
        BIN="$UPSTREAM/build-ios-device/src/emu/ios/eka2l1.app/eka2l1"
        SVC="$UPSTREAM/src/emu/kernel/src/svc.cpp"
        WINDOW="$UPSTREAM/src/emu/services/src/window/window.cpp"

        test -f "$PATCHER"
        python3 -m py_compile "$PATCHER"

        cp "$SVC" "$RUNNER_TEMP/menuui21-svc-before.cpp"
        python3 "$PATCHER" "$UPSTREAM"

        python3 - "$SVC" "$WINDOW" <<'PY_GATE'
        from pathlib import Path
        import sys

        svc = Path(sys.argv[1]).read_text(encoding="utf-8")
        window = Path(sys.argv[2]).read_text(encoding="utf-8")

        expected = {
            "SYMBIAN-SYSTEMAPPS1 MENUUI21 SCHED_REG_A:": 1,
            "SYMBIAN-SYSTEMAPPS1 MENUUI21 SCHED_REG_B:": 1,
            "SYMBIAN-SYSTEMAPPS1 MENUUI21 SCHED_BIND:": 1,
            "SYMBIAN-SYSTEMAPPS1 MENUUI21 AO_RAW:": 1,
            "SYMBIAN-SYSTEMAPPS1 MENUUI21 SCHED_SCAN:": 1,
            "SYMBIAN-SYSTEMAPPS1 MENUUI21 VTABLE:": 1,
            "SYMBIAN-SYSTEMAPPS1 MENUUI21 STACK_WORD:": 1,
            "SYMBIAN-SYSTEMAPPS1 MENUUI21 FRAME:": 1,
        }
        for marker, count in expected.items():
            actual = svc.count(marker)
            assert actual == count, (marker, actual, count)

        for marker in [
            "SYMBIAN-SYSTEMAPPS1 MENUUI17 ALF_PTR_ARM:",
            "SYMBIAN-SYSTEMAPPS1 MENUUI17 ALF_PTR_COMPLETE:",
            "SYMBIAN-SYSTEMAPPS1 MENUUI18 CLIENT_STATUS:",
            "SYMBIAN-SYSTEMAPPS1 MENUUI18 CLIENT_SIGNAL:",
            "SYMBIAN-SYSTEMAPPS1 MENUUI18 CLIENT_WAIT:",
            "SYMBIAN-SYSTEMAPPS1 MENUUI19 AO_TRACK:",
            "SYMBIAN-SYSTEMAPPS1 MENUUI19 AO_STATE:",
            "SYMBIAN-SYSTEMAPPS1 MENUUI19 AO_QUEUE:",
            "SYMBIAN-SYSTEMAPPS1 MENUUI20 ACTIVEQ_HEAD:",
            "SYMBIAN-SYSTEMAPPS1 MENUUI20 ACTIVEQ_TARGET:",
            "SYMBIAN-SYSTEMAPPS1 MENUUI20 ACTIVEQ_BREAK:",
            "SYMBIAN-SYSTEMAPPS1 MENUUI20 ACTIVEQ_DIR:",
        ]:
            assert marker in svc, marker

        for marker in [
            "SYMBIAN-SYSTEMAPPS1 MENUUI14 INPUT_GET:",
            "SYMBIAN-SYSTEMAPPS1 MENUUI15 EVENT_GET_FULL:",
            "SYMBIAN-SYSTEMAPPS1 MENUUI16 ADVFLAG1:",
        ]:
            assert marker in window, marker

        assert svc.count("menuui21_log_scheduler_context(") == 2
        assert svc.count("menuui21_log_frame(") == 10
        assert "cpu->get_reg(static_cast<std::size_t>(i))" in svc
        assert "r[4] == head_addr ? 1 : 0" in svc
        assert "mode=arm_ldmda_exact" in svc
        assert "status->set(val, kern->is_eka1());" in svc
        assert "msg->own_thr->signal_request();" in svc
        assert "kern->crr_thread()->wait_for_any_request();" in svc
        assert "guest_evt_.adv_pointer_evt_.modifier = 0;" in window

        print("MENUUI21 SCHEDCTX1 source gates: PASS")
        PY_GATE

        git -C "$UPSTREAM" diff --check
        git -C "$UPSTREAM" diff > "$GITHUB_WORKSPACE/MENUUI21-SCHEDCTX1-source.diff"
        diff -u "$RUNNER_TEMP/menuui21-svc-before.cpp" "$SVC" > "$GITHUB_WORKSPACE/MENUUI21-SCHEDCTX1-only.diff" || test $? -eq 1

        {
          echo "MENUUI21 SCHEDCTX1 BUILD AUDIT"
          echo "menuui20_authority_commit=af251eddc28113c1807dcdc41fcafa5f2904b464"
          echo "menuui19_authority_commit=8a58a6b50165af7233cddf9d1afa1ce732013163"
          echo "menuui18_authority_commit=b874f223187da5618dddbf4f726275f645c1a4c4"
          echo "menuui17_authority_commit=f4e0c4420885ed81432acb2f9a31038f66e84ac0"
          echo "upstream_head=$(git -C "$UPSTREAM" rev-parse HEAD)"
          echo "menuui13_fs_diruid1=PRESERVED"
          echo "menuui14_inputdispatch1=PRESERVED"
          echo "menuui15_eventsem1=PRESERVED"
          echo "menuui16_advflag1=PRESERVED"
          echo "menuui17_alfroute1=PRESERVED"
          echo "menuui18_clientwake1=PRESERVED"
          echo "menuui19_activeobj1=PRESERVED"
          echo "menuui20_activeqdir1=PRESERVED"
          echo "scope=diagnostic_only_guest_scheduler_context_and_exact_arm_scan"
          echo "registers=r0_to_r15_cpsr_thumb"
          echo "scheduler_binding=r4_head_r5_loop_r6_wait_r7_current"
          echo "raw_scan=arm_ldmda_status_flags_prev"
          echo "abi=eabi_and_gcc_vtable_candidates"
          echo "stack=32_words_plus_module_resolution"
          echo "behavior_change=NONE"
        } > "$GITHUB_WORKSPACE/MENUUI21-SCHEDCTX1-BUILD-AUDIT.txt"

        cmake --build "$UPSTREAM/build-ios-device" --parallel 4

        test -x "$BIN"
        STRINGS_OUT="$RUNNER_TEMP/menuui21.binary.strings"
        strings "$BIN" > "$STRINGS_OUT"

        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI13 FS_DIRUID1:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI14 INPUT_GET:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI15 EVENT_GET_FULL:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI16 ADVFLAG1:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI17 ALF_PTR_ARM:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI17 ALF_PTR_COMPLETE:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI18 CLIENT_STATUS:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI18 CLIENT_SIGNAL:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI18 CLIENT_WAIT:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI19 AO_TRACK:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI19 AO_STATE:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI19 AO_QUEUE:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI20 ACTIVEQ_HEAD:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI20 ACTIVEQ_TARGET:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI20 ACTIVEQ_BREAK:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI20 ACTIVEQ_DIR:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI21 SCHED_REG_A:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI21 SCHED_REG_B:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI21 SCHED_BIND:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI21 AO_RAW:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI21 SCHED_SCAN:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI21 VTABLE:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI21 STACK_WORD:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI21 FRAME:' "$STRINGS_OUT"

        echo 'MENUUI21 SCHEDCTX1 binary + preserved authority gates: PASS'

    - name: Package MENUUI21 SCHEDCTX1 unsigned IPA
      run: |
        set -euo pipefail
        LOG="$GITHUB_WORKSPACE/eka2l1-java-build.log"
        touch "$LOG"
        exec > >(tee -a "$LOG") 2>&1

        APP="$GITHUB_WORKSPACE/upstream/build-ios-device/src/emu/ios/eka2l1.app"
        BIN="$APP/eka2l1"
        IPA="$GITHUB_WORKSPACE/upstream/EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI21-SCHEDCTX1-unsigned.ipa"
        STAGE="$RUNNER_TEMP/ipa-stage-menuui21-schedctx1"
        IPA_LIST="$RUNNER_TEMP/menuui21-schedctx1.ipa-list.txt"

        test -d "$APP"
        test -x "$BIN"
        rm -rf "$STAGE" "$IPA"
        mkdir -p "$STAGE/Payload"
        cp -R "$APP" "$STAGE/Payload/EKA2L1.app"
        rm -rf "$STAGE/Payload/EKA2L1.app/_CodeSignature"
        rm -f "$STAGE/Payload/EKA2L1.app/embedded.mobileprovision"
        (cd "$STAGE" && /usr/bin/zip -qry "$IPA" Payload)
        /usr/bin/unzip -t "$IPA" >/dev/null
        /usr/bin/unzip -l "$IPA" > "$IPA_LIST"
        grep -Fq 'Payload/EKA2L1.app/eka2l1' "$IPA_LIST"
        test -s "$IPA"
        shasum -a 256 "$IPA" | tee "$GITHUB_WORKSPACE/MENUUI21-SCHEDCTX1-IPA-SHA256.txt"

        echo 'MENUUI21 SCHEDCTX1 unsigned IPA package: PASS'

    - name: Upload MENUUI21 SCHEDCTX1 IPA
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI21-SCHEDCTX1-IPA
        path: upstream/EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI21-SCHEDCTX1-unsigned.ipa
        if-no-files-found: error
        retention-days: 14

    - name: Upload MENUUI21 SCHEDCTX1 audit
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI21-SCHEDCTX1-AUDIT
        path: |
          MENUUI21-SCHEDCTX1-source.diff
          MENUUI21-SCHEDCTX1-only.diff
          MENUUI21-SCHEDCTX1-BUILD-AUDIT.txt
          MENUUI21-SCHEDCTX1-IPA-SHA256.txt
        if-no-files-found: warn
        retention-days: 14

    - name: Upload diagnostic log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI21-SCHEDCTX1-diagnostic-log
        path: eka2l1-java-build.log
        if-no-files-found: warn
        retention-days: 14
