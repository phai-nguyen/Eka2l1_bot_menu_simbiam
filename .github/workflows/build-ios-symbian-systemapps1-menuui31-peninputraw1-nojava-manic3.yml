name: Build EKA2L1 SYMBIAN SYSTEMAPPS1 MENUUI31 PENINPUTRAW1 NOJAVA MANIC3 IPA

"on":
  workflow_dispatch:
  push:
    paths:
      - ".github/menuui31-peninputraw1-trigger.txt"

permissions:
  contents: read

jobs:
  build-app:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
    - name: Checkout project
      uses: actions/checkout@v4

    - name: Restore MENUUI31 cache
      id: menuui31_cache
      uses: actions/cache/restore@v4
      with:
        path: upstream
        key: eka2l1-menuui31-peninputraw1-nojava-manic3-macos15-v1

    - name: Restore MENUUI30 baseline
      id: menuui30_cache
      if: steps.menuui31_cache.outputs.cache-hit != 'true'
      uses: actions/cache/restore@v4
      with:
        path: upstream
        key: eka2l1-menuui30-stockfep1-nojava-manic3-macos15-v1

    - name: Apply MENUUI31 PenInput raw routing and rebuild
      if: steps.menuui31_cache.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail
        LOG="$GITHUB_WORKSPACE/eka2l1-menuui31-peninputraw1.log"
        : > "$LOG"
        exec > >(tee -a "$LOG") 2>&1

        test "${{ steps.menuui30_cache.outputs.cache-hit }}" = "true"

        UPSTREAM="$GITHUB_WORKSPACE/upstream"
        PATCHER="$GITHUB_WORKSPACE/apply_menuui31_peninputraw1.py"
        CMAKE_BIN="$UPSTREAM/.tools/cmake-3.31.6-macos-universal/CMake.app/Contents/bin/cmake"
        ANIM="$UPSTREAM/src/emu/services/src/window/classes/plugins/animdll.cpp"
        WIN="$UPSTREAM/src/emu/services/src/window/window.cpp"
        WINH="$UPSTREAM/src/emu/services/include/services/window/window.h"
        SVC="$UPSTREAM/src/emu/kernel/src/svc.cpp"

        python3 -m py_compile "$PATCHER"
        python3 "$PATCHER" "$UPSTREAM"

        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI31 PENINPUT_STATE:' "$ANIM"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI31 PENINPUT_RAW:' "$WIN"
        grep -Fq 'PENINPUT_OP_LAYOUT_SIZE_WITH_SIZE = 507' "$ANIM"
        grep -Fq 'PENINPUT_OP_ENABLE_SPRITE = 516' "$ANIM"
        grep -Fq 'if (!peninput_consumed)' "$WIN"
        grep -Fq 'peninput_anim_pen_down_' "$WINH"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI29 PENINPUT_IPC:' "$SVC"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI28 PENINPUT_ANIM:' "$ANIM"
        grep -R -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI30 STOCK_FEP:' "$UPSTREAM/src/emu/ios"
        ! grep -R -Fq '"avkonfep_general.dll", epocver::epoc93fp1' "$UPSTREAM/src/emu/ios"
        test ! -e "$UPSTREAM/src/emu/j2me"

        git -C "$UPSTREAM" diff --check
        "$CMAKE_BIN" --build "$UPSTREAM/build-ios-device" --target eka2l1 --parallel 4

        APP="$UPSTREAM/build-ios-device/src/emu/ios/eka2l1.app"
        BIN="$APP/eka2l1"
        test -x "$BIN"
        STRINGS_OUT="$RUNNER_TEMP/menuui31.strings"
        strings "$BIN" > "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI31 PENINPUT_STATE:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI31 PENINPUT_RAW:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI30 STOCK_FEP:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI29 PENINPUT_IPC:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI28 PENINPUT_ANIM:' "$STRINGS_OUT"
        ! grep -Eiq 'phoneME|JAVA-STABLE1|MMAPI-DIAG2|GM-SYNTH1 renderer=gm-sf2' "$STRINGS_OUT"

        {
          echo 'MENUUI31 PENINPUTRAW1 NOJAVA MANIC3 BUILD AUDIT'
          echo 'base_cache=MENUUI30_STOCKFEP1_NOJAVA_MANIC3'
          echo 'peninput_506_position=IMPLEMENTED'
          echo 'peninput_507_size=IMPLEMENTED'
          echo 'peninput_509_capture=IMPLEMENTED'
          echo 'peninput_516_enable_sprite=IMPLEMENTED'
          echo 'raw_touch_inside=CONSUMED_AFTER_SUCCESSFUL_QUEUE_MIRROR'
          echo 'outside_touch=NORMAL_WS_DELIVERY_PRESERVED'
          echo 'MENUUI30_STOCKFEP=PRESERVED'
          echo 'MENUUI29_TRACE=PRESERVED'
          echo 'MENUUI28_ANIM=PRESERVED'
          echo 'java_j2me=REMOVED'
        } > "$GITHUB_WORKSPACE/MENUUI31-PENINPUTRAW1-BUILD-AUDIT.txt"
        git -C "$UPSTREAM" diff > "$GITHUB_WORKSPACE/MENUUI31-PENINPUTRAW1-source.diff"

    - name: Verify restored MENUUI31 cache
      if: steps.menuui31_cache.outputs.cache-hit == 'true'
      run: |
        set -euo pipefail
        UPSTREAM="$GITHUB_WORKSPACE/upstream"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI31 PENINPUT_STATE:' "$UPSTREAM/src/emu/services/src/window/classes/plugins/animdll.cpp"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI31 PENINPUT_RAW:' "$UPSTREAM/src/emu/services/src/window/window.cpp"
        grep -R -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI30 STOCK_FEP:' "$UPSTREAM/src/emu/ios"
        test -x "$UPSTREAM/build-ios-device/src/emu/ios/eka2l1.app/eka2l1"
        test ! -e "$UPSTREAM/src/emu/j2me"
        echo 'MENUUI31 PENINPUTRAW1 cache_hit=true' > "$GITHUB_WORKSPACE/MENUUI31-PENINPUTRAW1-BUILD-AUDIT.txt"
        : > "$GITHUB_WORKSPACE/MENUUI31-PENINPUTRAW1-source.diff"

    - name: Save MENUUI31 cache
      if: steps.menuui31_cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: upstream
        key: eka2l1-menuui31-peninputraw1-nojava-manic3-macos15-v1

    - name: Package MENUUI31 unsigned IPA
      run: |
        set -euo pipefail
        APP="$GITHUB_WORKSPACE/upstream/build-ios-device/src/emu/ios/eka2l1.app"
        IPA="$GITHUB_WORKSPACE/upstream/EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI31-PENINPUTRAW1-NOJAVA-MANIC3-unsigned.ipa"
        STAGE="$RUNNER_TEMP/ipa-stage-menuui31"
        rm -rf "$STAGE" "$IPA"
        mkdir -p "$STAGE/Payload"
        cp -R "$APP" "$STAGE/Payload/EKA2L1.app"
        rm -rf "$STAGE/Payload/EKA2L1.app/_CodeSignature"
        rm -f "$STAGE/Payload/EKA2L1.app/embedded.mobileprovision"
        (cd "$STAGE" && /usr/bin/zip -qry "$IPA" Payload)
        /usr/bin/unzip -t "$IPA" >/dev/null
        /usr/bin/unzip -l "$IPA" > "$RUNNER_TEMP/menuui31-ipa-list.txt"
        grep -Fq 'Payload/EKA2L1.app/eka2l1' "$RUNNER_TEMP/menuui31-ipa-list.txt"
        ! grep -Ei '\.jar([[:space:]]|$)' "$RUNNER_TEMP/menuui31-ipa-list.txt"
        shasum -a 256 "$IPA" | tee "$GITHUB_WORKSPACE/MENUUI31-PENINPUTRAW1-IPA-SHA256.txt"

    - name: Upload MENUUI31 IPA
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI31-PENINPUTRAW1-NOJAVA-MANIC3-IPA
        path: upstream/EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI31-PENINPUTRAW1-NOJAVA-MANIC3-unsigned.ipa
        retention-days: 14

    - name: Upload MENUUI31 audit
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI31-PENINPUTRAW1-NOJAVA-MANIC3-AUDIT
        path: |
          MENUUI31-PENINPUTRAW1-BUILD-AUDIT.txt
          MENUUI31-PENINPUTRAW1-source.diff
          MENUUI31-PENINPUTRAW1-IPA-SHA256.txt
        retention-days: 14

    - name: Upload diagnostic log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI31-PENINPUTRAW1-diagnostic-log
        path: eka2l1-menuui31-peninputraw1.log
        if-no-files-found: warn
        retention-days: 14
