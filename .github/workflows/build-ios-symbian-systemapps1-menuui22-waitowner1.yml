name: Build EKA2L1 SYMBIAN SYSTEMAPPS1 MENUUI22 WAITOWNER1 IPA

"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/run-menuui22-waitowner1

permissions:
  contents: read

jobs:
  build-app:
    runs-on: macos-15
    timeout-minutes: 120

    steps:
    - name: Checkout project history
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Replay frozen MENUUI21 authority build chain
      run: |
        set -euo pipefail
        LOG="$GITHUB_WORKSPACE/eka2l1-java-build.log"
        : > "$LOG"
        exec > >(tee -a "$LOG") 2>&1

        SOURCE_COMMIT="afeaf13f8768bb44905ca0cc212c4ef7d99095d7"
        SOURCE_WORKFLOW=".github/workflows/build-ios-symbian-systemapps1-menuui21-schedctx1.yml"
        SOURCE_YML="$RUNNER_TEMP/menuui22-menuui21-authority.yml"
        EXTRACT_DIR="$RUNNER_TEMP/menuui22-menuui21-steps"
        FROZEN_MENUUI21_PATCHER="$GITHUB_WORKSPACE/.menuui22-frozen-apply-menuui21-schedctx1.py"

        git cat-file -e "$SOURCE_COMMIT^{commit}"
        git show "$SOURCE_COMMIT:$SOURCE_WORKFLOW" > "$SOURCE_YML"
        git show "$SOURCE_COMMIT:apply_menuui21_schedctx1.py" > "$FROZEN_MENUUI21_PATCHER"
        test -s "$SOURCE_YML"
        test -s "$FROZEN_MENUUI21_PATCHER"

        rm -rf "$EXTRACT_DIR"
        mkdir -p "$EXTRACT_DIR"

        python3 - "$SOURCE_YML" "$EXTRACT_DIR" "$FROZEN_MENUUI21_PATCHER" <<'PY_EXTRACT'
        import sys
        from pathlib import Path

        source = Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()
        out = Path(sys.argv[2])
        frozen_menuui21 = sys.argv[3]
        wanted = [
            "Replay frozen MENUUI20 authority build chain",
            "Apply MENUUI21 SCHEDCTX1 diagnostic traces and rebuild",
        ]

        found = {}
        i = 0
        while i < len(source):
            if not source[i].startswith("    - name:"):
                i += 1
                continue
            name = source[i].split("    - name:", 1)[1].strip()
            j = i + 1
            run_index = None
            while j < len(source) and not source[j].startswith("    - name:"):
                if source[j].startswith("      run: |"):
                    run_index = j
                    break
                j += 1
            if name in wanted:
                if run_index is None:
                    raise SystemExit(f"MENUUI22: missing run block: {name}")
                k = run_index + 1
                body = []
                while k < len(source) and not source[k].startswith("    - name:"):
                    row = source[k]
                    if row.startswith("        "):
                        body.append(row[8:])
                    elif row.strip() == "":
                        body.append("")
                    else:
                        break
                    k += 1
                found[name] = "\n".join(body) + "\n"
            i = max(j, i + 1)

        missing = [name for name in wanted if name not in found]
        if missing:
            raise SystemExit("MENUUI22: missing frozen MENUUI21 steps: " + ", ".join(missing))

        patcher_anchor = 'PATCHER="$GITHUB_WORKSPACE/apply_menuui21_schedctx1.py"'
        if found[wanted[1]].count(patcher_anchor) != 1:
            raise SystemExit("MENUUI22: frozen MENUUI21 patcher anchor changed")
        found[wanted[1]] = found[wanted[1]].replace(
            patcher_anchor, f'PATCHER="{frozen_menuui21}"', 1
        )

        for idx, name in enumerate(wanted, 1):
            script = out / f"step{idx}.sh"
            script.write_text("#!/usr/bin/env bash\n" + found[name], encoding="utf-8")
            print(f"MENUUI22: extracted authority step {idx}: {name}")
        PY_EXTRACT

        for n in 1 2; do
          SCRIPT="$EXTRACT_DIR/step${n}.sh"
          chmod +x "$SCRIPT"
          (cd "$GITHUB_WORKSPACE" && bash "$SCRIPT")
        done

        UPSTREAM="$GITHUB_WORKSPACE/upstream"
        BIN="$UPSTREAM/build-ios-device/src/emu/ios/eka2l1.app/eka2l1"
        SVC="$UPSTREAM/src/emu/kernel/src/svc.cpp"
        test -x "$BIN"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI21 SCHED_SCAN:' "$SVC"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI21 VTABLE:' "$SVC"
        echo 'MENUUI22: frozen MENUUI21 authority replay PASS'

    - name: Apply MENUUI22 WAITOWNER1 diagnostic traces and rebuild
      run: |
        set -euo pipefail
        LOG="$GITHUB_WORKSPACE/eka2l1-java-build.log"
        touch "$LOG"
        exec > >(tee -a "$LOG") 2>&1

        UPSTREAM="$GITHUB_WORKSPACE/upstream"
        PATCHER="$GITHUB_WORKSPACE/apply_menuui22_waitowner1.py"
        BIN="$UPSTREAM/build-ios-device/src/emu/ios/eka2l1.app/eka2l1"
        SVC="$UPSTREAM/src/emu/kernel/src/svc.cpp"

        test -f "$PATCHER"
        python3 -m py_compile "$PATCHER"
        cp "$SVC" "$RUNNER_TEMP/menuui22-svc-before.cpp"
        python3 "$PATCHER" "$UPSTREAM"

        python3 - "$RUNNER_TEMP/menuui22-svc-before.cpp" "$SVC" <<'PY_GATE'
        from pathlib import Path
        import sys

        before = Path(sys.argv[1]).read_text(encoding="utf-8")
        svc = Path(sys.argv[2]).read_text(encoding="utf-8")
        expected = {
            "SYMBIAN-SYSTEMAPPS1 MENUUI22 SYNC_SEND:": 1,
            "SYMBIAN-SYSTEMAPPS1 MENUUI22 SYNC_COMPLETE:": 1,
            "SYMBIAN-SYSTEMAPPS1 MENUUI22 ALF_WAKE_CONTEXT:": 1,
            "SYMBIAN-SYSTEMAPPS1 MENUUI22 WAIT_OWNER:": 1,
            "SYMBIAN-SYSTEMAPPS1 MENUUI22 WAIT_FRAME:": 1,
        }
        for marker, count in expected.items():
            actual = svc.count(marker)
            assert actual == count, (marker, actual, count)

        for marker in [
            "SYMBIAN-SYSTEMAPPS1 MENUUI17 ALF_PTR_ARM:",
            "SYMBIAN-SYSTEMAPPS1 MENUUI17 ALF_PTR_COMPLETE:",
            "SYMBIAN-SYSTEMAPPS1 MENUUI18 CLIENT_STATUS:",
            "SYMBIAN-SYSTEMAPPS1 MENUUI18 CLIENT_SIGNAL:",
            "SYMBIAN-SYSTEMAPPS1 MENUUI18 CLIENT_WAIT:",
            "SYMBIAN-SYSTEMAPPS1 MENUUI19 AO_TRACK:",
            "SYMBIAN-SYSTEMAPPS1 MENUUI19 AO_STATE:",
            "SYMBIAN-SYSTEMAPPS1 MENUUI20 ACTIVEQ_HEAD:",
            "SYMBIAN-SYSTEMAPPS1 MENUUI20 ACTIVEQ_DIR:",
            "SYMBIAN-SYSTEMAPPS1 MENUUI21 SCHED_REG_A:",
            "SYMBIAN-SYSTEMAPPS1 MENUUI21 SCHED_SCAN:",
            "SYMBIAN-SYSTEMAPPS1 MENUUI21 VTABLE:",
        ]:
            assert marker in svc, marker

        # The frozen source also waits in virtual_reality. Preserve whole-file
        # call counts; only the WaitForAnyRequest bridge must contain one wait.
        behavior_tokens = [
            "kern->crr_thread()->wait_for_any_request();",
            "msg->own_thr->signal_request();",
            "status->set(val, kern->is_eka1());",
            "kern->call_ipc_send_callbacks(server_name, ord, arg, status.ptr_address(), kern->crr_thread());",
            "kern->call_ipc_complete_callbacks(msg, val);",
        ]
        for token in behavior_tokens:
            before_count = before.count(token)
            after_count = svc.count(token)
            assert before_count > 0, ("missing authority call", token)
            assert after_count == before_count, (
                "behavior call count changed", token, before_count, after_count
            )
            print(f"MENUUI22 preserved call: {token} before={before_count} after={after_count}")

        wait_sig = "    BRIDGE_FUNC(void, wait_for_any_request) {\n"
        assert svc.count(wait_sig) == 1, "WaitForAnyRequest bridge signature count changed"
        wait_pos = svc.index(wait_sig)
        wait_end = svc.find("\n    BRIDGE_FUNC(", wait_pos + len(wait_sig))
        assert wait_end >= 0, "cannot find end of WaitForAnyRequest bridge"
        wait_body = svc[wait_pos:wait_end]
        wait_count = wait_body.count("kern->crr_thread()->wait_for_any_request();")
        assert wait_count == 1, ("WaitForAnyRequest bridge wait count", wait_count)
        assert "menuui22_post_alf_wait_budget = 6;" in svc
        assert "menuui22_sync_active = true;" in svc
        assert "menuui22_sync_active = false;" in svc
        print("MENUUI22 WAITOWNER1 source gates: PASS")
        PY_GATE

        git -C "$UPSTREAM" diff --check
        git -C "$UPSTREAM" diff > "$GITHUB_WORKSPACE/MENUUI22-WAITOWNER1-source.diff"
        diff -u "$RUNNER_TEMP/menuui22-svc-before.cpp" "$SVC" > "$GITHUB_WORKSPACE/MENUUI22-WAITOWNER1-only.diff" || test $? -eq 1

        {
          echo "MENUUI22 WAITOWNER1 BUILD AUDIT"
          echo "menuui21_authority_commit=afeaf13f8768bb44905ca0cc212c4ef7d99095d7"
          echo "menuui11_device_baseline=PRESERVED"
          echo "epoc94_0xAA=UNMAPPED"
          echo "epoc94_0xAB=message_construct"
          echo "epoc94_0xAC=message_kill"
          echo "menuui17_alfroute1=PRESERVED"
          echo "menuui18_clientwake1=PRESERVED"
          echo "menuui19_activeobj1=PRESERVED"
          echo "menuui20_activeqdir1=PRESERVED"
          echo "menuui21_schedctx1=PRESERVED"
          echo "scope=diagnostic_only_sync_wait_ownership"
          echo "sync_owner=seq_status_opcode_server_hash"
          echo "alf_window=6_waits_after_opcode7_completion"
          echo "stack=pc_lr_plus_up_to_10_resolved_frames_per_wait_stage"
          echo "behavior_change=NONE"
        } > "$GITHUB_WORKSPACE/MENUUI22-WAITOWNER1-BUILD-AUDIT.txt"

        cmake --build "$UPSTREAM/build-ios-device" --parallel 4
        test -x "$BIN"

        STRINGS_OUT="$RUNNER_TEMP/menuui22.binary.strings"
        strings "$BIN" > "$STRINGS_OUT"
        for marker in \
          'SYMBIAN-SYSTEMAPPS1 MENUUI17 ALF_PTR_COMPLETE:' \
          'SYMBIAN-SYSTEMAPPS1 MENUUI18 CLIENT_WAIT:' \
          'SYMBIAN-SYSTEMAPPS1 MENUUI19 AO_STATE:' \
          'SYMBIAN-SYSTEMAPPS1 MENUUI20 ACTIVEQ_DIR:' \
          'SYMBIAN-SYSTEMAPPS1 MENUUI21 SCHED_SCAN:' \
          'SYMBIAN-SYSTEMAPPS1 MENUUI22 SYNC_SEND:' \
          'SYMBIAN-SYSTEMAPPS1 MENUUI22 SYNC_COMPLETE:' \
          'SYMBIAN-SYSTEMAPPS1 MENUUI22 ALF_WAKE_CONTEXT:' \
          'SYMBIAN-SYSTEMAPPS1 MENUUI22 WAIT_OWNER:' \
          'SYMBIAN-SYSTEMAPPS1 MENUUI22 WAIT_FRAME:'; do
          grep -Fq "$marker" "$STRINGS_OUT"
        done
        echo 'MENUUI22 WAITOWNER1 binary + authority gates: PASS'

    - name: Package MENUUI22 WAITOWNER1 unsigned IPA
      run: |
        set -euo pipefail
        LOG="$GITHUB_WORKSPACE/eka2l1-java-build.log"
        touch "$LOG"
        exec > >(tee -a "$LOG") 2>&1

        APP="$GITHUB_WORKSPACE/upstream/build-ios-device/src/emu/ios/eka2l1.app"
        BIN="$APP/eka2l1"
        IPA="$GITHUB_WORKSPACE/upstream/EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI22-WAITOWNER1-unsigned.ipa"
        STAGE="$RUNNER_TEMP/ipa-stage-menuui22-waitowner1"
        IPA_LIST="$RUNNER_TEMP/menuui22-waitowner1.ipa-list.txt"

        test -d "$APP"
        test -x "$BIN"
        rm -rf "$STAGE" "$IPA"
        mkdir -p "$STAGE/Payload"
        cp -R "$APP" "$STAGE/Payload/EKA2L1.app"
        rm -rf "$STAGE/Payload/EKA2L1.app/_CodeSignature"
        rm -f "$STAGE/Payload/EKA2L1.app/embedded.mobileprovision"
        (cd "$STAGE" && /usr/bin/zip -qry "$IPA" Payload)
        /usr/bin/unzip -t "$IPA" >/dev/null
        /usr/bin/unzip -l "$IPA" > "$IPA_LIST"
        grep -Fq 'Payload/EKA2L1.app/eka2l1' "$IPA_LIST"
        test -s "$IPA"
        shasum -a 256 "$IPA" | tee "$GITHUB_WORKSPACE/MENUUI22-WAITOWNER1-IPA-SHA256.txt"
        echo 'MENUUI22 WAITOWNER1 unsigned IPA package: PASS'

    - name: Upload MENUUI22 WAITOWNER1 IPA
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI22-WAITOWNER1-IPA
        path: upstream/EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI22-WAITOWNER1-unsigned.ipa
        if-no-files-found: error
        retention-days: 14

    - name: Upload MENUUI22 WAITOWNER1 audit
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI22-WAITOWNER1-AUDIT
        path: |
          MENUUI22-WAITOWNER1-source.diff
          MENUUI22-WAITOWNER1-only.diff
          MENUUI22-WAITOWNER1-BUILD-AUDIT.txt
          MENUUI22-WAITOWNER1-IPA-SHA256.txt
        if-no-files-found: warn
        retention-days: 14

    - name: Upload diagnostic log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI22-WAITOWNER1-diagnostic-log
        path: eka2l1-java-build.log
        if-no-files-found: warn
        retention-days: 14
