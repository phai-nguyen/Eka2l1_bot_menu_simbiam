name: Build EKA2L1 SYMBIAN SYSTEMAPPS1 MENUUI30 STOCKFEP1 NOJAVA MANIC3 IPA

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-app:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
    - name: Checkout project
      uses: actions/checkout@v4

    - name: Restore MENUUI30 cache
      id: menuui30_cache
      uses: actions/cache/restore@v4
      with:
        path: upstream
        key: eka2l1-menuui30-stockfep1-nojava-manic3-macos15-v1

    - name: Restore MENUUI29 baseline
      id: menuui29_cache
      if: steps.menuui30_cache.outputs.cache-hit != 'true'
      uses: actions/cache/restore@v4
      with:
        path: upstream
        key: eka2l1-menuui29-peninputtrace1-nojava-manic3-macos15-v1

    - name: Apply MENUUI30 stock Nokia FEP and rebuild
      if: steps.menuui30_cache.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail
        LOG="$GITHUB_WORKSPACE/eka2l1-menuui30-stockfep1.log"
        : > "$LOG"
        exec > >(tee -a "$LOG") 2>&1

        test "${{ steps.menuui29_cache.outputs.cache-hit }}" = "true"

        UPSTREAM="$GITHUB_WORKSPACE/upstream"
        PATCHER="$GITHUB_WORKSPACE/apply_menuui30_stockfep1.py"
        CMAKE_BIN="$UPSTREAM/.tools/cmake-3.31.6-macos-universal/CMake.app/Contents/bin/cmake"
        IOS="$UPSTREAM/src/emu/ios/Bridge/IosEmulator.mm"
        SVC="$UPSTREAM/src/emu/kernel/src/svc.cpp"
        ANIM="$UPSTREAM/src/emu/services/src/window/classes/plugins/animdll.cpp"

        python3 -m py_compile "$PATCHER"
        python3 "$PATCHER" "$UPSTREAM"

        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI30 STOCK_FEP:' "$IOS"
        ! grep -Fq '"avkonfep_general.dll", epocver::epoc93fp1' "$IOS"
        grep -Fq 'goommonitor_general.dll' "$IOS"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI29 PENINPUT_IPC:' "$SVC"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI28 PENINPUT_ANIM:' "$ANIM"
        test ! -e "$UPSTREAM/src/emu/j2me"

        git -C "$UPSTREAM" diff --check
        "$CMAKE_BIN" --build "$UPSTREAM/build-ios-device" --target eka2l1 --parallel 4

        APP="$UPSTREAM/build-ios-device/src/emu/ios/eka2l1.app"
        BIN="$APP/eka2l1"
        test -x "$BIN"
        test -f "$APP/emures/patch/avkonfep_general.dll"
        STRINGS_OUT="$RUNNER_TEMP/menuui30.strings"
        strings "$BIN" > "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI30 STOCK_FEP:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI29 PENINPUT_IPC:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI28 PENINPUT_ANIM:' "$STRINGS_OUT"
        ! grep -Eiq 'phoneME|JAVA-STABLE1|MMAPI-DIAG2|GM-SYNTH1 renderer=gm-sf2' "$STRINGS_OUT"

        {
          echo 'MENUUI30 STOCKFEP1 NOJAVA MANIC3 BUILD AUDIT'
          echo 'base_cache=MENUUI29_PENINPUTTRACE1_NOJAVA_MANIC3'
          echo 'ios_avkonfep_override=DISABLED'
          echo 'stock_avkonfep_bak=RESTORED_IF_PRESENT'
          echo 'avkonfep_patch_asset=KEPT_BUT_NOT_INSTALLED'
          echo 'goommonitor=UNCHANGED'
          echo 'MENUUI29_TRACE=PRESERVED'
          echo 'MENUUI28_PENINPUT=PRESERVED'
          echo 'java_j2me=REMOVED'
        } > "$GITHUB_WORKSPACE/MENUUI30-STOCKFEP1-BUILD-AUDIT.txt"
        git -C "$UPSTREAM" diff > "$GITHUB_WORKSPACE/MENUUI30-STOCKFEP1-source.diff"

    - name: Verify restored MENUUI30 cache
      if: steps.menuui30_cache.outputs.cache-hit == 'true'
      run: |
        set -euo pipefail
        UPSTREAM="$GITHUB_WORKSPACE/upstream"
        IOS="$UPSTREAM/src/emu/ios/Bridge/IosEmulator.mm"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI30 STOCK_FEP:' "$IOS"
        ! grep -Fq '"avkonfep_general.dll", epocver::epoc93fp1' "$IOS"
        test -x "$UPSTREAM/build-ios-device/src/emu/ios/eka2l1.app/eka2l1"
        test ! -e "$UPSTREAM/src/emu/j2me"
        echo 'MENUUI30 STOCKFEP1 cache_hit=true' > "$GITHUB_WORKSPACE/MENUUI30-STOCKFEP1-BUILD-AUDIT.txt"
        : > "$GITHUB_WORKSPACE/MENUUI30-STOCKFEP1-source.diff"

    - name: Save MENUUI30 cache
      if: steps.menuui30_cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: upstream
        key: eka2l1-menuui30-stockfep1-nojava-manic3-macos15-v1

    - name: Package MENUUI30 unsigned IPA
      run: |
        set -euo pipefail
        APP="$GITHUB_WORKSPACE/upstream/build-ios-device/src/emu/ios/eka2l1.app"
        IPA="$GITHUB_WORKSPACE/upstream/EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI30-STOCKFEP1-NOJAVA-MANIC3-unsigned.ipa"
        STAGE="$RUNNER_TEMP/ipa-stage-menuui30"
        rm -rf "$STAGE" "$IPA"
        mkdir -p "$STAGE/Payload"
        cp -R "$APP" "$STAGE/Payload/EKA2L1.app"
        rm -rf "$STAGE/Payload/EKA2L1.app/_CodeSignature"
        rm -f "$STAGE/Payload/EKA2L1.app/embedded.mobileprovision"
        (cd "$STAGE" && /usr/bin/zip -qry "$IPA" Payload)
        /usr/bin/unzip -t "$IPA" >/dev/null
        /usr/bin/unzip -l "$IPA" > "$RUNNER_TEMP/menuui30-ipa-list.txt"
        grep -Fq 'Payload/EKA2L1.app/eka2l1' "$RUNNER_TEMP/menuui30-ipa-list.txt"
        grep -Fq 'Payload/EKA2L1.app/emures/patch/avkonfep_general.dll' "$RUNNER_TEMP/menuui30-ipa-list.txt"
        ! grep -Ei '\.jar([[:space:]]|$)' "$RUNNER_TEMP/menuui30-ipa-list.txt"
        shasum -a 256 "$IPA" | tee "$GITHUB_WORKSPACE/MENUUI30-STOCKFEP1-IPA-SHA256.txt"

    - name: Upload MENUUI30 IPA
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI30-STOCKFEP1-NOJAVA-MANIC3-IPA
        path: upstream/EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI30-STOCKFEP1-NOJAVA-MANIC3-unsigned.ipa
        retention-days: 14

    - name: Upload MENUUI30 audit
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI30-STOCKFEP1-NOJAVA-MANIC3-AUDIT
        path: |
          MENUUI30-STOCKFEP1-BUILD-AUDIT.txt
          MENUUI30-STOCKFEP1-source.diff
          MENUUI30-STOCKFEP1-IPA-SHA256.txt
        retention-days: 14

    - name: Upload diagnostic log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI30-STOCKFEP1-diagnostic-log
        path: eka2l1-menuui30-stockfep1.log
        if-no-files-found: warn
        retention-days: 14
