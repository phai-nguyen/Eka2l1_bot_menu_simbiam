name: Build HOMEONLY10 MMF Audio Paused P&S

"on":
  push:
    branches:
      - codex/m3home-homeonly2-build
    paths:
      - ".github/workflows/build-homeonly10-mmfaudiops-paused1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
    - name: Checkout build host
      uses: actions/checkout@v4

    - name: Restore HOMEONLY9 cache
      id: home9
      uses: actions/cache/restore@v4
      with:
        path: upstream
        key: eka2l1-homeonly9-mmfaudiops1-macos15-v1

    - name: Require HOMEONLY9 baseline
      run: |
        set -euo pipefail
        test "${{ steps.home9.outputs.cache-hit }}" = "true"

        UPSTREAM="$GITHUB_WORKSPACE/upstream"
        BIN="$UPSTREAM/build-ios-device/src/emu/ios/eka2l1.app/eka2l1"
        AUDIO="$UPSTREAM/src/emu/services/src/audio/mmf/audio.cpp"

        test -x "$BIN"
        test -f "$AUDIO"
        test ! -e "$UPSTREAM/src/emu/j2me"

        grep -Fq '[HOMEONLY9][MMF_AUDIO_PS]' "$AUDIO"
        ! grep -Fq '[HOMEONLY10][MMF_AUDIO_PS]' "$AUDIO"

        strings "$BIN" > "$RUNNER_TEMP/home9.strings"
        grep -Fq '[HOMEONLY9][MMF_AUDIO_PS]' "$RUNNER_TEMP/home9.strings"
        grep -Fq '[HOMEONLY8][APPLIST_NONNATIVE]' "$RUNNER_TEMP/home9.strings"
        grep -Fq '[HOMEONLY5][USER11_CONTEXT]' "$RUNNER_TEMP/home9.strings"
        grep -Fq '[HOMEONLY4][EVENT_WAKE]' "$RUNNER_TEMP/home9.strings"
        grep -Fq '[HOMEONLY3][HOME_EXIT_KEEP_MENU3]' "$RUNNER_TEMP/home9.strings"
        ! grep -Fq '[NBOOT2]' "$RUNNER_TEMP/home9.strings"
        ! grep -Fq '[COMPATBOOT]' "$RUNNER_TEMP/home9.strings"

        git -C "$UPSTREAM" rev-parse HEAD | tee HOMEONLY10-UPSTREAM-HEAD.txt

    - name: Fetch HOMEONLY10 source
      run: |
        set -euo pipefail
        git clone --depth 1 --branch codex/menu3-homeonly10-mmfaudiops-paused1           https://github.com/phai-nguyen/Eka2l1-nhanh-menuu3.git "$GITHUB_WORKSPACE/home10-src"
        git -C "$GITHUB_WORKSPACE/home10-src" rev-parse HEAD | tee HOMEONLY10-SOURCE-HEAD.txt

    - name: Apply paused MMF P&S compatibility fix
      run: |
        set -euo pipefail
        SRC="$GITHUB_WORKSPACE/home10-src"
        UPSTREAM="$GITHUB_WORKSPACE/upstream"

        python3 -m py_compile           "$SRC/apply_homeonly10_mmfaudiops_paused1.py"           "$SRC/test_homeonly10_mmfaudiops_paused1.py"

        python3 "$SRC/apply_homeonly10_mmfaudiops_paused1.py" "$UPSTREAM"
        python3 "$SRC/test_homeonly10_mmfaudiops_paused1.py" "$UPSTREAM"

        AUDIO="$UPSTREAM/src/emu/services/src/audio/mmf/audio.cpp"
        grep -Fq '[HOMEONLY10][MMF_AUDIO_PS]' "$AUDIO"
        grep -Fq 'audio_state_paused_key = 0x00000004' "$AUDIO"
        grep -Fq '[HOMEONLY9][MMF_AUDIO_PS]' "$AUDIO"
        grep -Fq '[HOMEONLY8][APPLIST_NONNATIVE]'           "$UPSTREAM/src/emu/services/src/applist/applist.cpp"
        grep -Fq 'struct ini_token {' "$UPSTREAM/src/emu/common/src/ini.cpp"

        ! grep -R -Fq '52 -> 26' "$UPSTREAM/src/emu/services/src/centralrepo"
        ! grep -R -Fq '52/2' "$UPSTREAM/src/emu/services/src/centralrepo"

        git -C "$UPSTREAM" diff --check
        git -C "$UPSTREAM" diff > HOMEONLY10-source.diff

    - name: Incremental build HOMEONLY10
      run: |
        set -euo pipefail
        UPSTREAM="$GITHUB_WORKSPACE/upstream"
        CMAKE_BIN="$UPSTREAM/.tools/cmake-3.31.6-macos-universal/CMake.app/Contents/bin/cmake"

        "$CMAKE_BIN" --build "$UPSTREAM/build-ios-device" --target eka2l1 --parallel 4

        BIN="$UPSTREAM/build-ios-device/src/emu/ios/eka2l1.app/eka2l1"
        test -x "$BIN"
        strings "$BIN" > "$RUNNER_TEMP/home10.strings"

        grep -Fq '[HOMEONLY10][MMF_AUDIO_PS]' "$RUNNER_TEMP/home10.strings"
        grep -Fq '[HOMEONLY9][MMF_AUDIO_PS]' "$RUNNER_TEMP/home10.strings"
        grep -Fq '[HOMEONLY8][APPLIST_NONNATIVE]' "$RUNNER_TEMP/home10.strings"
        grep -Fq '[HOMEONLY5][USER11_CONTEXT]' "$RUNNER_TEMP/home10.strings"
        grep -Fq '[HOMEONLY4][EVENT_WAKE]' "$RUNNER_TEMP/home10.strings"
        grep -Fq '[HOMEONLY3][HOME_EXIT_KEEP_MENU3]' "$RUNNER_TEMP/home10.strings"
        ! grep -Fq '[NBOOT2]' "$RUNNER_TEMP/home10.strings"
        ! grep -Fq '[COMPATBOOT]' "$RUNNER_TEMP/home10.strings"
        test ! -e "$UPSTREAM/src/emu/j2me"

        {
          echo 'HOMEONLY10 BUILD AUDIT'
          echo 'baseline=HOMEONLY9_MMFAUDIOPS1'
          echo 'device_evidence=MMF_AUDIO_POLICY_KEY_4_UNDEFINED'
          echo 'fix=DEFINE_STANDARD_PAUSED_CLIENT_PROCESS_LIST'
          echo 'mmf_audio_ps_category=0x101F457F'
          echo 'mmf_audio_ps_playing_key=2'
          echo 'mmf_audio_ps_paused_key=4'
          echo 'mmf_audio_ps_package_bytes=88'
          echo 'other_audio_policy_keys=UNCHANGED'
          echo 'input_pipeline=UNCHANGED'
          echo 'window_focus=UNCHANGED'
          echo 'cenrep_get_52_to_26=UNCHANGED_FORBIDDEN'
          echo 'aiscutplugin=UNCHANGED'
          echo 'panic_suppression=NO'
          echo 'nativeboot=ABSENT'
          echo 'compatboot=ABSENT'
          echo 'java_j2me=REMOVED'
        } > HOMEONLY10-BUILD-AUDIT.txt

    - name: Save HOMEONLY10 cache
      uses: actions/cache/save@v4
      with:
        path: upstream
        key: eka2l1-homeonly10-mmfaudiops-paused1-macos15-v1

    - name: Package HOMEONLY10 IPA
      run: |
        set -euo pipefail
        APP="$GITHUB_WORKSPACE/upstream/build-ios-device/src/emu/ios/eka2l1.app"
        IPA="$GITHUB_WORKSPACE/upstream/EKA2L1-HOMEONLY10-MMFAUDIOPS-PAUSED1-unsigned.ipa"
        STAGE="$RUNNER_TEMP/ipa-stage-home10"

        rm -rf "$STAGE" "$IPA"
        mkdir -p "$STAGE/Payload"
        cp -R "$APP" "$STAGE/Payload/EKA2L1.app"
        rm -rf "$STAGE/Payload/EKA2L1.app/_CodeSignature"
        rm -f "$STAGE/Payload/EKA2L1.app/embedded.mobileprovision"
        (cd "$STAGE" && /usr/bin/zip -qry "$IPA" Payload)

        /usr/bin/unzip -t "$IPA" >/dev/null
        ! /usr/bin/unzip -l "$IPA" | grep -Eiq '\.jar([[:space:]]|$)'
        shasum -a 256 "$IPA" | tee HOMEONLY10-IPA-SHA256.txt

    - name: Upload HOMEONLY10 IPA
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-HOMEONLY10-MMFAUDIOPS-PAUSED1-IPA
        path: upstream/EKA2L1-HOMEONLY10-MMFAUDIOPS-PAUSED1-unsigned.ipa
        retention-days: 14

    - name: Upload HOMEONLY10 audit
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-HOMEONLY10-MMFAUDIOPS-PAUSED1-AUDIT
        path: |
          HOMEONLY10-UPSTREAM-HEAD.txt
          HOMEONLY10-SOURCE-HEAD.txt
          HOMEONLY10-source.diff
          HOMEONLY10-BUILD-AUDIT.txt
          HOMEONLY10-IPA-SHA256.txt
        if-no-files-found: warn
        retention-days: 14
