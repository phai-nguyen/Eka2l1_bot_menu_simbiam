name: Build EKA2L1 SYMBIAN SYSTEMAPPS1 MENUUI10 EP95 SVCAB DIFF1 Manual IPA

"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/run-menuui10

permissions:
  contents: read

jobs:
  build-app:
    runs-on: macos-15
    timeout-minutes: 120

    steps:
    - name: Checkout current package and Git history
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Replay validated MENUUI9 and apply MENUUI10 epoc95 one-slot registration
      run: |
        set -euo pipefail
        LOG="$GITHUB_WORKSPACE/eka2l1-java-build.log"
        touch "$LOG"
        exec > >(tee -a "$LOG") 2>&1

        SOURCE_COMMIT="f698422a95461a5b239db9998260e717fc0042be"
        SOURCE_WORKFLOW=".github/workflows/build-ios-symbian-systemapps1-menuui9-xntheme-msgconstruct1-manual.yml"
        SOURCE_YML="$RUNNER_TEMP/menuui10-menuui9-source.yml"
        REPLAY_SCRIPT="$RUNNER_TEMP/menuui10-menuui9-outer-replay.sh"

        git cat-file -e "$SOURCE_COMMIT^{commit}"
        git show "$SOURCE_COMMIT:$SOURCE_WORKFLOW" > "$SOURCE_YML"
        test -s "$SOURCE_YML"
        test -f "$GITHUB_WORKSPACE/apply_menuui10_ep95_svcab_diff1.py"
        python3 -m py_compile "$GITHUB_WORKSPACE/apply_menuui10_ep95_svcab_diff1.py"

        python3 - "$SOURCE_YML" "$REPLAY_SCRIPT" <<'PY_MENUUI10_EXTRACT'
        import hashlib
        import sys
        from pathlib import Path

        source = Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()
        output = Path(sys.argv[2])
        target = "Replay validated MENUUI2 chain with MENUUI3-8 diagnostics and MENUUI9 semantic fix"
        matches = []

        i = 0
        while i < len(source):
            if source[i].startswith("    - name:"):
                name = source[i].split("    - name:", 1)[1].strip()
                j = i + 1
                run_index = None
                while j < len(source) and not source[j].startswith("    - name:"):
                    if source[j].startswith("      run: |"):
                        run_index = j
                        break
                    j += 1
                if name == target:
                    if run_index is None:
                        raise SystemExit("MENUUI10: MENUUI9 replay step has no run block")
                    k = run_index + 1
                    body = []
                    while k < len(source) and not source[k].startswith("    - name:"):
                        row = source[k]
                        if row.startswith("        "):
                            body.append(row[8:])
                        elif row.strip() == "":
                            body.append("")
                        else:
                            break
                        k += 1
                    matches.append("\n".join(body) + "\n")
                i = j
            else:
                i += 1

        if len(matches) != 1:
            raise SystemExit(f"MENUUI10: expected exactly one MENUUI9 replay step, found {len(matches)}")

        script = matches[0]
        required = [
            'SOURCE_COMMIT="be2e4d7191ccb61f2232b9bc50d3c29f8bc5e52c"',
            'python3 "$GITHUB_WORKSPACE/apply_menuui9_xntheme_msgconstruct1.py" "$UPSTREAM"',
            "MENUUI9 v10 SVC table semantic gate: PASS",
            "JAVA-STABLE1 + N-GAGE-STABILITY1-CUBEB1 + COMPAT1-T9AKN1 frozen behavior files: byte-identical PASS",
        ]
        missing = [marker for marker in required if marker not in script]
        if missing:
            raise SystemExit("MENUUI10: pinned MENUUI9 replay guard failed: " + ", ".join(missing))

        # MENUUI9's outer step builds an inner replay script from a Python list.
        # Insert MENUUI10 as the very next list item after MENUUI9, so the patch
        # is applied before the inherited compile/build steps execute.
        anchor = '\'python3 "$GITHUB_WORKSPACE/apply_menuui9_xntheme_msgconstruct1.py" "$UPSTREAM"\','
        if script.count(anchor) != 1:
            raise SystemExit(f"MENUUI10: MENUUI9 list-item anchor count={script.count(anchor)}")
        replacement = anchor + '\n    \'python3 "$GITHUB_WORKSPACE/apply_menuui10_ep95_svcab_diff1.py" "$UPSTREAM"\','
        script = script.replace(anchor, replacement, 1)

        if script.count('apply_menuui10_ep95_svcab_diff1.py') != 1:
            raise SystemExit("MENUUI10: replay injection postcondition failed")

        output.write_text(script, encoding="utf-8")
        digest = hashlib.sha256(script.encode("utf-8")).hexdigest()
        print(f"MENUUI10: corrected MENUUI9 outer replay sha256={digest}")
        PY_MENUUI10_EXTRACT

        chmod +x "$REPLAY_SCRIPT"
        bash -n "$REPLAY_SCRIPT"
        bash "$REPLAY_SCRIPT"

        UPSTREAM="$GITHUB_WORKSPACE/upstream"
        python3 - "$UPSTREAM" <<'PY_MENUUI10_GATE'
        from pathlib import Path
        import sys

        up = Path(sys.argv[1])
        svc = (up / "src/emu/kernel/src/svc.cpp").read_text(encoding="utf-8")
        svc_h = (up / "src/emu/kernel/include/kernel/svc.h").read_text(encoding="utf-8")
        reg = (up / "src/emu/kernel/src/reg.cpp").read_text(encoding="utf-8")
        reg_h = (up / "src/emu/kernel/include/kernel/reg.h").read_text(encoding="utf-8")
        lib = (up / "src/emu/kernel/src/libmanager.cpp").read_text(encoding="utf-8")

        a = svc.index("    const eka2l1::hle::func_map svc_register_funcs_v95_diff = {")
        b = svc.index("    const eka2l1::hle::func_map svc_register_funcs_v94 = {", a)
        v95 = svc[a:b]
        assert v95.count("BRIDGE_REGISTER(") == 1
        assert v95.count("BRIDGE_REGISTER(0xAB, message_construct)") == 1
        assert "0xAC" not in v95
        assert "0xAD" not in v95
        assert "message_kill" not in v95
        assert "message_open_handle" not in v95

        assert svc_h.count("extern const eka2l1::hle::func_map svc_register_funcs_v95_diff;") == 1
        assert reg_h.count("void register_epocv95(eka2l1::hle::lib_manager &mngr);") == 1
        assert reg.count("ADD_SVC_REGISTERS(mngr, svc_register_funcs_v95_diff);") == 1
        assert lib.count("SYMBIAN-SYSTEMAPPS1 MENUUI10 EP95_SVCAB_REG:") == 1
        assert lib.count("epoc::register_epocv95(*this);") == 1

        for marker in [
            "SYMBIAN-SYSTEMAPPS1 MENUUI9 MSGCONSTRUCT:",
            "SYMBIAN-SYSTEMAPPS1 MENUUI7 IPC_SEND:",
            "SYMBIAN-SYSTEMAPPS1 MENUUI6 LEAVE_NEG1:",
        ]:
            assert marker in svc
        for marker in [
            "SYMBIAN-SYSTEMAPPS1 MENUUI8 XNTHEME_SVCAB:",
            "SYMBIAN-SYSTEMAPPS1 MENUUI8 SVCAB_REGFRAME:",
            "SYMBIAN-SYSTEMAPPS1 MENUUI8 SVCAB_STACK:",
            "SYMBIAN-SYSTEMAPPS1 MENUUI8 SVCAB_PTR:",
        ]:
            assert marker in lib

        print("MENUUI10 EP95 one-slot registration source gate: PASS")
        PY_MENUUI10_GATE

        git -C "$UPSTREAM" diff --check
        echo 'MENUUI10 EP95-SVCAB-DIFF1 + MENUUI9 validated chain: PASS'

    - name: Package MENUUI10 EP95 SVCAB DIFF1 unsigned IPA
      working-directory: upstream
      run: |
        set -euo pipefail
        LOG="$GITHUB_WORKSPACE/eka2l1-java-build.log"
        touch "$LOG"
        exec > >(tee -a "$LOG") 2>&1
        echo "=== STEP: Package MENUUI10 EP95 SVCAB DIFF1 unsigned IPA ==="

        APP="build-ios-device/src/emu/ios/eka2l1.app"
        BIN="$APP/eka2l1"
        IPA="EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI10-EP95-SVCAB-DIFF1-unsigned.ipa"
        STAGE="ipa-stage-menuui10-ep95-svcab-diff1"
        STRINGS_OUT="$RUNNER_TEMP/menuui10-ep95-svcab-diff1.binary.strings"
        IPA_LIST="$RUNNER_TEMP/menuui10-ep95-svcab-diff1.ipa-list.txt"

        test -d "$APP"
        test -x "$BIN"

        strings "$BIN" > "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI10 EP95_SVCAB_REG:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI9 MSGCONSTRUCT:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI8 XNTHEME_SVCAB:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI8 SVCAB_REGFRAME:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI7 IPC_SEND:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI6 LEAVE_NEG1:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI5 SELFKILL:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI4 THREADKILL:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI3 WINFOCUS NULL:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI2 FS27 PRE:' "$STRINGS_OUT"
        echo 'MENUUI10 + MENUUI9 + preserved diagnostic chain binary markers: PASS'

        rm -rf "$STAGE" "$IPA"
        mkdir -p "$STAGE/Payload"
        cp -R "$APP" "$STAGE/Payload/EKA2L1.app"
        rm -rf "$STAGE/Payload/EKA2L1.app/_CodeSignature"
        rm -f "$STAGE/Payload/EKA2L1.app/embedded.mobileprovision"

        (cd "$STAGE" && /usr/bin/zip -qry "../$IPA" Payload)
        /usr/bin/unzip -t "$IPA" >/dev/null
        /usr/bin/unzip -l "$IPA" > "$IPA_LIST"
        grep -Fq 'Payload/EKA2L1.app/eka2l1' "$IPA_LIST"
        test -s "$IPA"
        shasum -a 256 "$IPA"
        echo 'MENUUI10 EP95 SVCAB DIFF1 unsigned IPA package: PASS'

    - name: Upload MENUUI10 EP95 SVCAB DIFF1 IPA
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI10-EP95-SVCAB-DIFF1-IPA
        path: upstream/EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI10-EP95-SVCAB-DIFF1-unsigned.ipa
        if-no-files-found: error
        retention-days: 14

    - name: Upload diagnostic log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI10-EP95-SVCAB-DIFF1-diagnostic-log
        path: eka2l1-java-build.log
        if-no-files-found: warn
        retention-days: 14
