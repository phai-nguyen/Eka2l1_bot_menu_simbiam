name: Build M3HOME1 HomeBridge IPA

"on":
  push:
    branches:
      - codex/m3home-build1
    paths:
      - ".github/workflows/build-m3home1-homebridge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
    - name: Checkout cache host
      uses: actions/checkout@v4

    - name: Restore B28 bootstrap
      id: b28
      uses: actions/cache/restore@v4
      with:
        path: upstream
        key: eka2l1-fastbuild1-bootstrap-b28-nojava-manic3-macos15-v1

    - name: Restore B19 fallback
      id: b19
      if: steps.b28.outputs.cache-hit != 'true'
      uses: actions/cache/restore@v4
      with:
        path: upstream
        key: eka2l1-nativeboot2-b19-salangabi1-nojava-manic3-macos15-v1

    - name: Reconstruct B28 baseline if needed
      run: |
        set -euo pipefail
        UPSTREAM="$GITHUB_WORKSPACE/upstream"
        if [ "${{ steps.b28.outputs.cache-hit }}" != "true" ]; then
          test "${{ steps.b19.outputs.cache-hit }}" = "true"
          python3 apply_nativeboot2_b20_cenresetall1.py "$UPSTREAM"
          python3 apply_nativeboot2_b21_fbsfontalias1.py "$UPSTREAM"
          python3 apply_nativeboot2_b22_fbsdefaulttypeface1.py "$UPSTREAM"
          python3 apply_nativeboot2_b23_fbsfontspecv2abi1.py "$UPSTREAM"
          python3 apply_nativeboot2_b24_fbsvtableabi1.py "$UPSTREAM"
          python3 apply_nativeboot2_b25_fbssharedheap1.py "$UPSTREAM"
          python3 apply_nativeboot2_b26_ioslibraryexit1.py "$UPSTREAM"
          python3 apply_nativeboot2_b27_wservpanic13trace1.py "$UPSTREAM"
          python3 apply_nativeboot2_b28_wservlibtype1.py "$UPSTREAM"
        fi

    - name: Fetch Hướng 1 source of truth
      run: |
        set -euo pipefail
        SRC="$GITHUB_WORKSPACE/m3home-src"
        git clone --depth 1 --branch codex/menu3-homebridge1 \
          https://github.com/phai-nguyen/Eka2l1-nhanh-menuu3.git "$SRC"
        git -C "$SRC" rev-parse HEAD | tee "$GITHUB_WORKSPACE/M3HOME1-SOURCE-HEAD.txt"

    - name: Apply B29-B98 and M3HOME1
      run: |
        set -euo pipefail
        SRC="$GITHUB_WORKSPACE/m3home-src"
        UPSTREAM="$GITHUB_WORKSPACE/upstream"

        python3 "$SRC/ci/fastbuild1_manifest.py" validate "$SRC"
        python3 "$SRC/ci/fastbuild1_manifest.py" apply "$SRC" "$UPSTREAM"
        python3 "$SRC/test_m3home1_homebridge.py"

        ROOT="$UPSTREAM/src/emu/ios/app/RootViewController.mm"
        BRIDGE="$UPSTREAM/src/emu/ios/src/emu_bridge.mm"
        grep -Fq '[M3HOME1][TRIGGER]' "$ROOT"
        grep -Fq 'self.currentGameUid == 0x101F4CD2u' "$ROOT"
        grep -Fq '[self launchAppUid:0x102750F0u]' "$ROOT"
        grep -Fq 'Vào màn hình chính' "$ROOT"
        grep -Fq '[M3HOME1][APPARC_REQUEST]' "$BRIDGE"
        grep -Fq '[M3HOME1][APPARC_DISPATCHED]' "$BRIDGE"
        grep -Fq '[M3HOME1][GUARD_REJECT]' "$BRIDGE"
        grep -R -Fq '[NBOOT2][MENU3_ENTRY_STATUS]' "$UPSTREAM/src/emu" || true

        git -C "$UPSTREAM" diff --check
        git -C "$UPSTREAM" diff > "$GITHUB_WORKSPACE/M3HOME1-source.diff"

        {
          echo 'M3HOME1 HOMEBRIDGE1 BUILD AUDIT'
          echo 'source_repo=phai-nguyen/Eka2l1-nhanh-menuu3'
          echo 'source_branch=codex/menu3-homebridge1'
          echo 'source_uid=0x101F4CD2'
          echo 'target_uid=0x102750F0'
          echo 'route=launchAppUid_to_existing_bridge_launcher'
          echo 'menu3_lifetime=PRESERVED'
          echo 'normal_hle_mode=EXPECTED'
          echo 'phoneui=UNCHANGED'
          echo 'ailaunch=NOT_USED'
          echo 'tfxserver=NOT_SHIMMED'
          echo 'firmware=UNCHANGED'
        } > "$GITHUB_WORKSPACE/M3HOME1-BUILD-AUDIT.txt"

    - name: Build iOS app
      run: |
        set -euo pipefail
        UPSTREAM="$GITHUB_WORKSPACE/upstream"
        CMAKE_BIN="$UPSTREAM/.tools/cmake-3.31.6-macos-universal/CMake.app/Contents/bin/cmake"
        "$CMAKE_BIN" --build "$UPSTREAM/build-ios-device" --target eka2l1 --parallel 4

        APP="$UPSTREAM/build-ios-device/src/emu/ios/eka2l1.app"
        BIN="$APP/eka2l1"
        test -x "$BIN"
        strings "$BIN" > "$RUNNER_TEMP/m3home1.strings"
        grep -Fq '[M3HOME1][APPARC_REQUEST]' "$RUNNER_TEMP/m3home1.strings"
        grep -Fq '[M3HOME1][APPARC_DISPATCHED]' "$RUNNER_TEMP/m3home1.strings"
        grep -Fq '[M3HOME1][GUARD_REJECT]' "$RUNNER_TEMP/m3home1.strings"

    - name: Package unsigned IPA
      run: |
        set -euo pipefail
        APP="$GITHUB_WORKSPACE/upstream/build-ios-device/src/emu/ios/eka2l1.app"
        IPA="$GITHUB_WORKSPACE/upstream/EKA2L1-M3HOME1-HOMEBRIDGE1-unsigned.ipa"
        STAGE="$RUNNER_TEMP/ipa-stage-m3home1"
        rm -rf "$STAGE" "$IPA"
        mkdir -p "$STAGE/Payload"
        cp -R "$APP" "$STAGE/Payload/EKA2L1.app"
        rm -rf "$STAGE/Payload/EKA2L1.app/_CodeSignature"
        rm -f "$STAGE/Payload/EKA2L1.app/embedded.mobileprovision"
        (cd "$STAGE" && /usr/bin/zip -qry "$IPA" Payload)
        /usr/bin/unzip -t "$IPA" >/dev/null
        /usr/bin/unzip -l "$IPA" > "$RUNNER_TEMP/m3home1-ipa-list.txt"
        grep -Fq 'Payload/EKA2L1.app/eka2l1' "$RUNNER_TEMP/m3home1-ipa-list.txt"
        shasum -a 256 "$IPA" | tee "$GITHUB_WORKSPACE/M3HOME1-IPA-SHA256.txt"

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-M3HOME1-HOMEBRIDGE1-IPA
        path: upstream/EKA2L1-M3HOME1-HOMEBRIDGE1-unsigned.ipa
        retention-days: 14

    - name: Upload audit
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-M3HOME1-HOMEBRIDGE1-AUDIT
        path: |
          M3HOME1-SOURCE-HEAD.txt
          M3HOME1-BUILD-AUDIT.txt
          M3HOME1-source.diff
          M3HOME1-IPA-SHA256.txt
        retention-days: 14

    - name: Upload diagnostic log context on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-M3HOME1-HOMEBRIDGE1-FAILURE-CONTEXT
        path: |
          M3HOME1-SOURCE-HEAD.txt
          M3HOME1-BUILD-AUDIT.txt
          M3HOME1-source.diff
        if-no-files-found: warn
        retention-days: 14
