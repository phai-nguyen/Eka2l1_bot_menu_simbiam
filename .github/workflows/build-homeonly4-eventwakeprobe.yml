name: Build HOMEONLY4 Event Wake Probe

"on":
  push:
    branches:
      - codex/m3home-homeonly2-build
    paths:
      - ".github/workflows/build-homeonly4-eventwakeprobe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
    - name: Checkout build host
      uses: actions/checkout@v4

    - name: Restore HOMEONLY3 cache
      id: home3
      uses: actions/cache/restore@v4
      with:
        path: upstream
        key: eka2l1-homeonly3-keepmenu3-macos15-v1

    - name: Require HOMEONLY3 baseline
      run: |
        set -euo pipefail
        test "${{ steps.home3.outputs.cache-hit }}" = "true"
        UPSTREAM="$GITHUB_WORKSPACE/upstream"
        BIN="$UPSTREAM/build-ios-device/src/emu/ios/eka2l1.app/eka2l1"
        test -x "$BIN"
        test ! -e "$UPSTREAM/src/emu/j2me"
        strings "$BIN" > "$RUNNER_TEMP/home3.strings"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI36 WG_FOCUS:' "$RUNNER_TEMP/home3.strings"
        grep -Fq '[M3HOME1][APPARC_REQUEST]' "$RUNNER_TEMP/home3.strings"
        grep -Fq '[HOMEONLY3][HOME_EXIT_KEEP_MENU3]' "$RUNNER_TEMP/home3.strings"
        ! grep -Fq '[NBOOT2]' "$RUNNER_TEMP/home3.strings"
        ! grep -Fq '[COMPATBOOT]' "$RUNNER_TEMP/home3.strings"

    - name: Fetch HOMEONLY4 source
      run: |
        set -euo pipefail
        git clone --depth 1 --branch codex/menu3-homeonly4           https://github.com/phai-nguyen/Eka2l1-nhanh-menuu3.git "$GITHUB_WORKSPACE/home4-src"
        git -C "$GITHUB_WORKSPACE/home4-src" rev-parse HEAD | tee HOMEONLY4-SOURCE-HEAD.txt

    - name: Apply HOMEONLY4 diagnostic delta
      run: |
        set -euo pipefail
        SRC="$GITHUB_WORKSPACE/home4-src"
        UPSTREAM="$GITHUB_WORKSPACE/upstream"
        python3 -m py_compile           "$SRC/apply_homeonly4_eventwakeprobe1.py"           "$SRC/test_homeonly4_eventwakeprobe1.py"
        python3 "$SRC/apply_homeonly4_eventwakeprobe1.py" "$UPSTREAM"
        python3 "$SRC/test_homeonly4_eventwakeprobe1.py" "$UPSTREAM"
        git -C "$UPSTREAM" diff --check
        git -C "$UPSTREAM" diff > HOMEONLY4-source.diff

    - name: Incremental build HOMEONLY4
      run: |
        set -euo pipefail
        UPSTREAM="$GITHUB_WORKSPACE/upstream"
        CMAKE_BIN="$UPSTREAM/.tools/cmake-3.31.6-macos-universal/CMake.app/Contents/bin/cmake"
        "$CMAKE_BIN" --build "$UPSTREAM/build-ios-device" --target eka2l1 --parallel 4

        BIN="$UPSTREAM/build-ios-device/src/emu/ios/eka2l1.app/eka2l1"
        test -x "$BIN"
        strings "$BIN" > "$RUNNER_TEMP/home4.strings"
        grep -Fq '[HOMEONLY4][EVENT_WAKE]' "$RUNNER_TEMP/home4.strings"
        grep -Fq '[HOMEONLY4][SEMA_WAKE]' "$RUNNER_TEMP/home4.strings"
        grep -Fq '[HOMEONLY4][REQ_WAIT]' "$RUNNER_TEMP/home4.strings"
        grep -Fq '[HOMEONLY3][HOME_EXIT_KEEP_MENU3]' "$RUNNER_TEMP/home4.strings"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI36 WG_FOCUS:' "$RUNNER_TEMP/home4.strings"
        grep -Fq '[M3HOME1][APPARC_REQUEST]' "$RUNNER_TEMP/home4.strings"
        ! grep -Fq '[NBOOT2]' "$RUNNER_TEMP/home4.strings"
        ! grep -Fq '[COMPATBOOT]' "$RUNNER_TEMP/home4.strings"
        test ! -e "$UPSTREAM/src/emu/j2me"

        {
          echo 'HOMEONLY4 BUILD AUDIT'
          echo 'baseline=HOMEONLY3_FROM_CLEAN_HOMEONLY2'
          echo 'probe=HOME_EVENTREADY_STATUS_SEMAPHORE_WAIT'
          echo 'behavior_change=NONE'
          echo 'touch_mapping=UNCHANGED'
          echo 'window_hit_test=UNCHANGED'
          echo 'event_fifo=UNCHANGED'
          echo 'scheduler=UNCHANGED'
          echo 'nativeboot=ABSENT'
          echo 'compatboot=ABSENT'
          echo 'java_j2me=REMOVED'
        } > HOMEONLY4-BUILD-AUDIT.txt

    - name: Save HOMEONLY4 cache
      uses: actions/cache/save@v4
      with:
        path: upstream
        key: eka2l1-homeonly4-eventwakeprobe-macos15-v1

    - name: Package HOMEONLY4 IPA
      run: |
        set -euo pipefail
        APP="$GITHUB_WORKSPACE/upstream/build-ios-device/src/emu/ios/eka2l1.app"
        IPA="$GITHUB_WORKSPACE/upstream/EKA2L1-HOMEONLY4-EVENTWAKEPROBE-unsigned.ipa"
        STAGE="$RUNNER_TEMP/ipa-stage-home4"
        rm -rf "$STAGE" "$IPA"
        mkdir -p "$STAGE/Payload"
        cp -R "$APP" "$STAGE/Payload/EKA2L1.app"
        rm -rf "$STAGE/Payload/EKA2L1.app/_CodeSignature"
        rm -f "$STAGE/Payload/EKA2L1.app/embedded.mobileprovision"
        (cd "$STAGE" && /usr/bin/zip -qry "$IPA" Payload)
        /usr/bin/unzip -t "$IPA" >/dev/null
        ! /usr/bin/unzip -l "$IPA" | grep -Eiq '\.jar([[:space:]]|$)'
        shasum -a 256 "$IPA" | tee HOMEONLY4-IPA-SHA256.txt

    - name: Upload HOMEONLY4 IPA
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-HOMEONLY4-EVENTWAKEPROBE-IPA
        path: upstream/EKA2L1-HOMEONLY4-EVENTWAKEPROBE-unsigned.ipa
        retention-days: 14

    - name: Upload HOMEONLY4 audit
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-HOMEONLY4-EVENTWAKEPROBE-AUDIT
        path: |
          HOMEONLY4-SOURCE-HEAD.txt
          HOMEONLY4-source.diff
          HOMEONLY4-BUILD-AUDIT.txt
          HOMEONLY4-IPA-SHA256.txt
        if-no-files-found: warn
        retention-days: 14
