name: RED NATIVEBOOT2 B28 WSERVLIBTYPE1

"on":
  workflow_dispatch:
  push:
    branches:
      - nativeboot2-b28-wservlibtype1
    paths:
      - test_nativeboot2_b28_wservlibtype1.py
      - .github/workflows/test-nativeboot2-b28-wservlibtype1-red.yml

permissions:
  contents: read

jobs:
  red-contract:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
    - name: Checkout project
      uses: actions/checkout@v4

    - name: Materialize pinned upstream source
      run: |
        set -euo pipefail
        UPSTREAM="$GITHUB_WORKSPACE/upstream-red"
        rm -rf "$UPSTREAM"
        git init "$UPSTREAM"
        git -C "$UPSTREAM" remote add origin https://github.com/EKA2L1/EKA2L1.git
        git -C "$UPSTREAM" fetch --depth 1 origin 971ebd747db0b2a58229f8a2c232c0d1f6192785
        git -C "$UPSTREAM" checkout --detach FETCH_HEAD

    - name: Run B28 RED contract
      run: |
        set -euo pipefail
        python3 test_nativeboot2_b28_wservlibtype1.py "$GITHUB_WORKSPACE/upstream-red"
