name: Build EKA2L1 SYMBIAN SYSTEMAPPS1 MENUUI2 XNTHEME CRASH TRACE1 Manual IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-app:
    runs-on: macos-15
    timeout-minutes: 120

    steps:
    - name: Checkout current package and Git history
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Replay frozen baseline with MENUUI2 XNTHEME CRASH TRACE1
      run: |
        set -euo pipefail
        BASELINE_COMMIT="5c3358a65d82e3ca83ea174d51e35b35815b49d4"
        BASELINE_WORKFLOW=".github/workflows/build-ios-symbian-systemapps1-runtimefix1-manual.yml"
        CURRENT_PAYLOAD="$GITHUB_WORKSPACE/EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI2-XNTHEME-CRASH-TRACE1-BASELINE-PAYLOAD.zip"
        LEGACY_PAYLOAD="$GITHUB_WORKSPACE/EKA2L1-SYMBIAN-SYSTEMAPPS1-FIX1-PAYLOAD.zip"
        MENU_PATCH="$GITHUB_WORKSPACE/EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI2-XNTHEME-CRASH-TRACE1-source-patch.zip"
        BASE_YML="$RUNNER_TEMP/systemapps1-runtimefix1-baseline.yml"
        MENU_STEP="$RUNNER_TEMP/menuui2-xntheme-crash-trace1-step.sh"

        echo "e130ca8345e762842753aba351ed6a108165c81e79a8d847768c9334f31d7304  $CURRENT_PAYLOAD" | shasum -a 256 -c -
        echo "2591c115cfd1afeb453d9a2d8fb2a941c9f02c8996cbd7ebd4adf0463c20ccc6  $MENU_PATCH" | shasum -a 256 -c -
        rm -f "$LEGACY_PAYLOAD"
        ln -s "$(basename "$CURRENT_PAYLOAD")" "$LEGACY_PAYLOAD"
        git cat-file -e "$BASELINE_COMMIT^{commit}"
        git show "$BASELINE_COMMIT:$BASELINE_WORKFLOW" > "$BASE_YML"
        test -s "$BASE_YML"

        cat > "$MENU_STEP" <<'MENU_STEP_SCRIPT'
        set -euo pipefail
        LOG="$GITHUB_WORKSPACE/eka2l1-java-build.log"
        touch "$LOG"
        exec > >(tee -a "$LOG") 2>&1
        echo "=== STEP: Apply SYMBIAN-SYSTEMAPPS1 + VIEW19 + MENUUI2-XNTHEME-CRASH-TRACE1 ==="
        UPSTREAM="$GITHUB_WORKSPACE/upstream"
        PATCH_ZIP="$GITHUB_WORKSPACE/EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI2-XNTHEME-CRASH-TRACE1-source-patch.zip"
        PATCH_DIR="$RUNNER_TEMP/eka2l1-symbian-systemapps1-menuui2"

        EXPECTED_PATCH_SHA="2591c115cfd1afeb453d9a2d8fb2a941c9f02c8996cbd7ebd4adf0463c20ccc6"
        echo "$EXPECTED_PATCH_SHA  $PATCH_ZIP" | shasum -a 256 -c -
        echo "MENUUI2 standalone diagnostic patch: OK ($EXPECTED_PATCH_SHA)"
        rm -rf "$PATCH_DIR"
        mkdir -p "$PATCH_DIR"
        /usr/bin/unzip -q "$PATCH_ZIP" -d "$PATCH_DIR"
        PAYLOAD="$PATCH_DIR/EKA2L1-SYMBIAN-SYSTEMAPPS1"
        test -f "$PAYLOAD/apply_symbian_systemapps1.py"
        test -f "$PAYLOAD/SHA256SUMS.txt"
        (cd "$PAYLOAD" && shasum -a 256 -c SHA256SUMS.txt)

        python3 - "$UPSTREAM" <<'PY_SYS_FROZEN_BEFORE'
        import hashlib, json, sys
        from pathlib import Path
        up=Path(sys.argv[1])
        # svc.cpp is intentionally excluded in MENUUI2 because this iteration adds
        # diagnostic-only FileServer/leave tracing there. All behavior-bearing
        # Java/N-Gage files remain byte-identical gates.
        fixed=[
          'src/emu/drivers/src/audio/backend/ios/audio_ios.mm',
          'src/emu/utils/include/utils/dll.h',
          'src/emu/drivers/src/audio/backend/cubeb/audio_cubeb.cpp',
          'src/emu/services/src/fs/files.cpp',
          'src/emu/services/src/ui/cap/oom_app.cpp',
          'src/emu/services/include/services/ui/cap/oom_app.h',
        ]
        out={r:hashlib.sha256((up/r).read_bytes()).hexdigest() for r in fixed}
        jroot=up/'src/emu/ios/app/j2me'
        jh=hashlib.sha256()
        for p in sorted(x for x in jroot.rglob('*') if x.is_file() and x.name != 'EKAUnifiedLibraryViewController.mm'):
            jh.update(str(p.relative_to(jroot)).encode()); jh.update(b'\0'); jh.update(p.read_bytes()); jh.update(b'\0')
        out['__j2me_except_unified__']=jh.hexdigest()
        Path('/tmp/eka2l1-systemapps1-menuui2-frozen-before.json').write_text(json.dumps(out,sort_keys=True))
        diag={
          'src/emu/kernel/src/svc.cpp': hashlib.sha256((up/'src/emu/kernel/src/svc.cpp').read_bytes()).hexdigest(),
          'src/emu/kernel/src/libmanager.cpp': hashlib.sha256((up/'src/emu/kernel/src/libmanager.cpp').read_bytes()).hexdigest(),
        }
        Path('/tmp/eka2l1-systemapps1-menuui2-diag-before.json').write_text(json.dumps(diag,sort_keys=True))
        print('MENUUI2 frozen behavior baseline hashes captured; svc.cpp/libmanager.cpp diagnostic-owned')
        PY_SYS_FROZEN_BEFORE

        python3 "$PAYLOAD/apply_symbian_systemapps1.py" "$UPSTREAM"

        python3 - "$UPSTREAM" <<'PY_SYS_FROZEN_AFTER'
        import hashlib, json, sys
        from pathlib import Path
        up=Path(sys.argv[1])
        before=json.loads(Path('/tmp/eka2l1-systemapps1-menuui2-frozen-before.json').read_text())
        after={}
        for r in before:
            if r == '__j2me_except_unified__':
                continue
            after[r]=hashlib.sha256((up/r).read_bytes()).hexdigest()
        jroot=up/'src/emu/ios/app/j2me'
        jh=hashlib.sha256()
        for p in sorted(x for x in jroot.rglob('*') if x.is_file() and x.name != 'EKAUnifiedLibraryViewController.mm'):
            jh.update(str(p.relative_to(jroot)).encode()); jh.update(b'\0'); jh.update(p.read_bytes()); jh.update(b'\0')
        after['__j2me_except_unified__']=jh.hexdigest()
        if before != after:
            bad=[r for r in before if before[r] != after.get(r)]
            raise SystemExit('MENUUI2 touched frozen behavior baseline files: ' + ', '.join(bad))
        print('JAVA-STABLE1 + N-GAGE-STABILITY1-CUBEB1 + COMPAT1-T9AKN1 frozen behavior files: byte-identical PASS')
        PY_SYS_FROZEN_AFTER

        LAUNCHER_H="$UPSTREAM/src/emu/ios/include/ios/launcher.h"
        LAUNCHER_CPP="$UPSTREAM/src/emu/ios/src/launcher.cpp"
        BRIDGE_H="$UPSTREAM/src/emu/ios/include/ios/emu_bridge.h"
        BRIDGE_MM="$UPSTREAM/src/emu/ios/src/emu_bridge.mm"
        ROOT="$UPSTREAM/src/emu/ios/app/RootViewController.mm"
        UNIFIED="$UPSTREAM/src/emu/ios/app/j2me/EKAUnifiedLibraryViewController.mm"
        VIEW="$UPSTREAM/src/emu/services/src/ui/view/view.cpp"
        SVC="$UPSTREAM/src/emu/kernel/src/svc.cpp"
        LIBMGR="$UPSTREAM/src/emu/kernel/src/libmanager.cpp"

        grep -Fq 'std::vector<std::string> get_system_apps();' "$LAUNCHER_H"
        grep -Fq 'std::vector<std::string> launcher::get_system_apps()' "$LAUNCHER_CPP"
        grep -Fq 'reg.caps.is_hidden || reg.land_drive != drive_z' "$LAUNCHER_CPP"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 ENUM1: enumerated {} visible ROM system app(s)' "$LAUNCHER_CPP"
        grep -Fq 'std::vector<app_entry> get_system_apps();' "$BRIDGE_H"
        grep -Fq 'g_state->launcher_->get_system_apps()' "$BRIDGE_MM"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 BRIDGE1: bridge visible ROM system apps count={}' "$BRIDGE_MM"
        grep -Fq 'eka2l1::ios::bridge::get_system_apps()' "$ROOT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 UI1: unified system apps=' "$ROOT"
        grep -Fq '[self loadIconsForApps:systemList]' "$ROOT"
        grep -Fq '@{ @"title":@"Hệ thống", @"kind":@"system"' "$UNIFIED"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 LAUNCH1: system uid=0x%08X name=%@' "$UNIFIED"
        grep -Fq 'eka2l1::ios::bridge::launch_app(uid);' "$ROOT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI1 VIEWIPC: raw={} mapped={} epocver={}' "$VIEW"
        grep -Fq 'case view_opcode_set_cross_check_uid:' "$VIEW"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI1 VIEW19: raw={} final=19 complete=KErrNone' "$VIEW"
        grep -Fq 'V11 LEAVE5:' "$SVC"
        grep -Fq 'V5 SVCMISS:' "$LIBMGR"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI2 FS27 PRE:' "$SVC"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI2 FS27 POST-DISPATCH:' "$SVC"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI2 FS27 PRE-PROCESS: entering HLE service dispatch' "$SVC"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI2 FS27 POST-PROCESS: HLE service dispatch returned' "$SVC"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI2 LEAVE ENTER:' "$SVC"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI2 LEAVE RETURN:' "$SVC"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI2 LEAVE_END ENTER:' "$SVC"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI2 LEAVE_END EXIT:' "$SVC"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI2 SVCMISS:' "$LIBMGR"
        grep -Fq 'svcnum == 0xAB' "$LIBMGR"
        grep -Fq 'svcnum == 0x00800018' "$LIBMGR"
        grep -Fq 'void launch_app(std::uint32_t uid);' "$BRIDGE_H"
        grep -Fq 'N-GAGE-COMPAT1 T9PATH1: legacy T9 resource fallback' "$UPSTREAM/src/emu/services/src/fs/files.cpp"
        grep -Fq 'N-GAGE-COMPAT1 AKNFAD1: set-system-faded handled' "$UPSTREAM/src/emu/services/src/ui/cap/oom_app.cpp"
        grep -Fq 'N-GAGE-STABILITY1 CUBEBSEL1: skipping Cubeb init on iOS; RemoteIO output backend active' "$UPSTREAM/src/emu/drivers/src/audio/backend/cubeb/audio_cubeb.cpp"
        git -C "$UPSTREAM" diff --check
        echo 'MENUUI2-XNTHEME-CRASH-TRACE1 source + VIEW19 + frozen baseline gates: PASS'
        MENU_STEP_SCRIPT
        chmod +x "$MENU_STEP"
        bash -n "$MENU_STEP"

        python3 - "$BASE_YML" "$MENU_STEP" <<'PY_REPLAY'
        import hashlib, os, subprocess, sys
        from pathlib import Path
        yml=Path(sys.argv[1]).read_text(encoding='utf-8').splitlines()
        menu_script=Path(sys.argv[2]).read_text(encoding='utf-8')
        steps=[]; i=0
        while i < len(yml):
            if not yml[i].startswith('    - name:'):
                i += 1; continue
            name=yml[i].split('    - name:',1)[1].strip(); j=i+1; wd=None; ri=None
            while j < len(yml) and not yml[j].startswith('    - name:'):
                s=yml[j].strip()
                if s.startswith('working-directory:'): wd=s.split(':',1)[1].strip().strip('"').strip("'")
                if yml[j].startswith('      run: |'): ri=j; break
                j += 1
            if ri is None:
                i=j; continue
            k=ri+1; body=[]
            while k < len(yml) and not yml[k].startswith('    - name:'):
                row=yml[k]
                if row.startswith('        '): body.append(row[8:])
                elif row.strip()=='': body.append('')
                else: break
                k += 1
            steps.append((name,wd,'\n'.join(body)+'\n')); i=k
        names=[x[0] for x in steps]
        target='Apply SYMBIAN-SYSTEMAPPS1 AppList enumeration and direct UID launcher UI'
        importer='Install N-Gage Classic R2A FIX3 multi-format importer'
        old_nem4_sha='606abe79138c4089c3d0d666b45a377badc6e2a641092fc9536f4619689a7da8'
        frozen_nem4_sha='e7b0a4778fb04fdcba8c11a5b2f42e63bbe4139b50d0d669d5db91878a33b8c4'
        if names.count(target) != 1: raise SystemExit(f'Expected one SYSTEMAPPS1 target, found {names.count(target)}')
        if names.count(importer) != 1: raise SystemExit(f'Expected one N-Gage importer step, found {names.count(importer)}')
        if not any('RUNTIMEFIX1' in n for n in names): raise SystemExit('RUNTIMEFIX1 baseline step not found')
        env=os.environ.copy(); rt=Path(env['RUNNER_TEMP'])
        envf=rt/'replay-github-env.txt'; pathf=rt/'replay-github-path.txt'
        envf.write_text(''); pathf.write_text(''); env['GITHUB_ENV']=str(envf); env['GITHUB_PATH']=str(pathf)
        def sync_env():
            for raw in envf.read_text().splitlines():
                if '=' in raw and not raw.startswith('#'):
                    k,v=raw.split('=',1); env[k]=v
            envf.write_text('')
            adds=[x for x in pathf.read_text().splitlines() if x]
            if adds: env['PATH']=os.pathsep.join(reversed(adds))+os.pathsep+env.get('PATH','')
            pathf.write_text('')
        def restore_pristine_nem4_helper():
            support_zip=rt/'eka2l1-java-bundle'/'EKA2L1-JAVA-R1-PHONEME-SUPPORT1-LIBUVFIX1'/'EKA2L1-NGAGE-R2FX2-R2-CRASHFIX1-SUPPORT1.zip'
            target_patch=rt/'eka2l1-ngage-support'/'payload'/'NGAGE_CLASSIC_R1_BUNDLED_NEM4_PATCH.py'
            expected_zip='10877e51ad6c4415623162a6aabb1c11cd60a3ddd55cea30ae4af6ad84020e16'
            expected_patch=frozen_nem4_sha
            if not support_zip.is_file(): raise SystemExit(f'REPLAYFIX2 missing frozen SUPPORT1 ZIP: {support_zip}')
            got_zip=hashlib.sha256(support_zip.read_bytes()).hexdigest()
            if got_zip != expected_zip: raise SystemExit(f'REPLAYFIX2 SUPPORT1 ZIP SHA mismatch: {got_zip}')
            p=subprocess.run(['/usr/bin/unzip','-p',str(support_zip),'payload/NGAGE_CLASSIC_R1_BUNDLED_NEM4_PATCH.py'],stdout=subprocess.PIPE,check=True)
            got_patch=hashlib.sha256(p.stdout).hexdigest()
            if got_patch != expected_patch: raise SystemExit(f'REPLAYFIX2 pristine NEM4 helper SHA mismatch: {got_patch}')
            target_patch.parent.mkdir(parents=True,exist_ok=True)
            target_patch.write_bytes(p.stdout)
            print(f'REPLAYFIX2: restored frozen NEM4 helper sha256={got_patch}',flush=True)
        ran=0; skipped=[]
        for name,wd,script in steps:
            if 'RUNTIMEFIX1' in name or name == 'Package unsigned IPA':
                skipped.append(name); continue
            if name == target: script=menu_script; wd=None
            if name == importer:
                restore_pristine_nem4_helper()
                if script.count(old_nem4_sha) != 1:
                    raise SystemExit(f'REPLAYFIX2 expected exactly one legacy NEM4 SHA gate, found {script.count(old_nem4_sha)}')
                script=script.replace(old_nem4_sha,frozen_nem4_sha,1)
                print(f'REPLAYFIX2: importer NEM4 checksum gate {old_nem4_sha[:12]} -> {frozen_nem4_sha[:12]}',flush=True)
            cwd=(Path(env['GITHUB_WORKSPACE'])/(wd or '')).resolve()
            print(f'\n=== REPLAY STEP: {name} (cwd={cwd}) ===',flush=True)
            rc=subprocess.run(['bash','-e','-o','pipefail','-c',script],cwd=str(cwd),env=env).returncode
            if rc: raise SystemExit(f'Replay step failed rc={rc}: {name}')
            sync_env(); ran += 1
        print(f'Replay complete: ran={ran} skipped={len(skipped)}')
        for n in skipped: print('  skipped:',n)
        print('MENUUI2 XNTHEME CRASH TRACE1 REPLAYFIX2 baseline replay: PASS')
        PY_REPLAY

    - name: Package MENUUI2 XNTHEME CRASH TRACE1 unsigned IPA
      working-directory: upstream
      run: |
        set -euo pipefail
        LOG="$GITHUB_WORKSPACE/eka2l1-java-build.log"
        touch "$LOG"
        exec > >(tee -a "$LOG") 2>&1
        APP="build-ios-device/src/emu/ios/eka2l1.app"
        IPA="EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI2-XNTHEME-CRASH-TRACE1-unsigned.ipa"
        STAGE="ipa-stage-menuui2-trace1"
        test -d "$APP"; test -x "$APP/eka2l1"
        strings "$APP/eka2l1" | grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI2 FS27 PRE:'
        strings "$APP/eka2l1" | grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI2 LEAVE RETURN:'
        strings "$APP/eka2l1" | grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI2 SVCMISS:'
        strings "$APP/eka2l1" | grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI1 VIEW19: raw={} final=19 complete=KErrNone'
        rm -rf "$STAGE" "$IPA"; mkdir -p "$STAGE/Payload"
        cp -R "$APP" "$STAGE/Payload/EKA2L1.app"
        rm -rf "$STAGE/Payload/EKA2L1.app/_CodeSignature"
        rm -f "$STAGE/Payload/EKA2L1.app/embedded.mobileprovision"
        (cd "$STAGE" && /usr/bin/zip -qry "../$IPA" Payload)
        /usr/bin/unzip -t "$IPA" >/dev/null
        /usr/bin/unzip -l "$IPA" | grep -Fq 'Payload/EKA2L1.app/eka2l1'
        test -s "$IPA"; shasum -a 256 "$IPA"

    - name: Upload MENUUI2 XNTHEME CRASH TRACE1 IPA
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI2-XNTHEME-CRASH-TRACE1-IPA
        path: upstream/EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI2-XNTHEME-CRASH-TRACE1-unsigned.ipa
        if-no-files-found: error
        retention-days: 14

    - name: Upload diagnostic log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI2-XNTHEME-CRASH-TRACE1-diagnostic-log
        path: eka2l1-java-build.log
        if-no-files-found: warn
        retention-days: 14
