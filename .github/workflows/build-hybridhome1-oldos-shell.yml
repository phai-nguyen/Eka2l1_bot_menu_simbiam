name: Build HYBRIDHOME1 OldOS-style Shell

"on":
  push:
    branches:
      - codex/m3home-homeonly2-build
    paths:
      - ".github/workflows/build-hybridhome1-oldos-shell.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35

    steps:
    - name: Checkout build host
      uses: actions/checkout@v4

    - name: Restore latest validated HOMEONLY9 backend cache
      id: backend
      uses: actions/cache/restore@v4
      with:
        path: upstream
        key: eka2l1-homeonly9-mmfaudiops1-macos15-v1

    - name: Require clean hybrid baseline
      run: |
        set -euo pipefail
        test "${{ steps.backend.outputs.cache-hit }}" = "true"

        UPSTREAM="$GITHUB_WORKSPACE/upstream"
        BIN="$UPSTREAM/build-ios-device/src/emu/ios/eka2l1.app/eka2l1"
        ROOT="$UPSTREAM/src/emu/ios/app/RootViewController.mm"

        test -x "$BIN"
        test -f "$ROOT"
        test ! -e "$UPSTREAM/src/emu/j2me"

        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI36 WG_FOCUS:'           "$UPSTREAM/src/emu/services/src/window/classes/wingroup.cpp"
        grep -Fq '[M3HOME1][TRIGGER]' "$ROOT"
        grep -Fq '[M3HOME1][APPARC_REQUEST]' "$UPSTREAM/src/emu/ios/src/emu_bridge.mm"
        ! grep -Fq '[HYBRIDHOME1][SHOW]' "$ROOT"
        ! grep -R -Fq '[NBOOT2]' "$UPSTREAM/src/emu/ios"
        ! grep -R -Fq '[COMPATBOOT]' "$UPSTREAM/src/emu/ios"
        ! grep -R -Fq 'CompatBoot Menu Probe' "$UPSTREAM/src/emu/ios"

        git -C "$UPSTREAM" rev-parse HEAD | tee HYBRIDHOME1-UPSTREAM-HEAD.txt

    - name: Fetch HYBRIDHOME1 source
      run: |
        set -euo pipefail
        git clone --depth 1 --branch codex/hybridhome1-oldos-shell           https://github.com/phai-nguyen/Eka2l1-nhanh-menuu3.git           "$GITHUB_WORKSPACE/hybrid-src"
        git -C "$GITHUB_WORKSPACE/hybrid-src" rev-parse HEAD | tee HYBRIDHOME1-SOURCE-HEAD.txt

    - name: Apply OldOS-style host shell
      run: |
        set -euo pipefail
        SRC="$GITHUB_WORKSPACE/hybrid-src"
        UPSTREAM="$GITHUB_WORKSPACE/upstream"

        python3 -m py_compile           "$SRC/apply_hybridhome1_oldosshell.py"           "$SRC/test_hybridhome1_oldosshell.py"

        python3 "$SRC/apply_hybridhome1_oldosshell.py" "$UPSTREAM"
        python3 "$SRC/test_hybridhome1_oldosshell.py" "$UPSTREAM"

        ROOT="$UPSTREAM/src/emu/ios/app/RootViewController.mm"
        grep -Fq '[HYBRIDHOME1][SHOW]' "$ROOT"
        grep -Fq '[HYBRIDHOME1][APP_CHOOSER]' "$ROOT"
        grep -Fq '[HYBRIDHOME1][LAUNCH_REAL_APP]' "$ROOT"
        grep -Fq 'eka2l1::ios::bridge::get_apps()' "$ROOT"
        grep -Fq '[M3HOME1][TRIGGER]' "$ROOT"

        test ! -e "$UPSTREAM/src/emu/j2me"
        ! grep -R -Fq '[NBOOT2]' "$UPSTREAM/src/emu/ios"
        ! grep -R -Fq '[COMPATBOOT]' "$UPSTREAM/src/emu/ios"

        git -C "$UPSTREAM" diff --check
        git -C "$UPSTREAM" diff > HYBRIDHOME1-source.diff

    - name: Incremental build HYBRIDHOME1
      run: |
        set -euo pipefail
        UPSTREAM="$GITHUB_WORKSPACE/upstream"
        CMAKE_BIN="$UPSTREAM/.tools/cmake-3.31.6-macos-universal/CMake.app/Contents/bin/cmake"

        "$CMAKE_BIN" --build "$UPSTREAM/build-ios-device" --target eka2l1 --parallel 4

        BIN="$UPSTREAM/build-ios-device/src/emu/ios/eka2l1.app/eka2l1"
        test -x "$BIN"
        strings "$BIN" > "$RUNNER_TEMP/hybridhome1.strings"

        grep -Fq '[HYBRIDHOME1][TRIGGER]' "$RUNNER_TEMP/hybridhome1.strings"
        grep -Fq '[HYBRIDHOME1][SHOW]' "$RUNNER_TEMP/hybridhome1.strings"
        grep -Fq '[HYBRIDHOME1][RETURN_MENU3]' "$RUNNER_TEMP/hybridhome1.strings"
        grep -Fq '[HYBRIDHOME1][APP_CHOOSER]' "$RUNNER_TEMP/hybridhome1.strings"
        grep -Fq '[HYBRIDHOME1][LAUNCH_REAL_APP]' "$RUNNER_TEMP/hybridhome1.strings"
        grep -Fq 'guest_menu3_alive=1' "$RUNNER_TEMP/hybridhome1.strings"
        grep -Fq 'real_home_started=0' "$RUNNER_TEMP/hybridhome1.strings"

        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI36 WG_FOCUS:' "$RUNNER_TEMP/hybridhome1.strings"
        grep -Fq '[M3HOME1][APPARC_REQUEST]' "$RUNNER_TEMP/hybridhome1.strings"
        ! grep -Fq '[NBOOT2]' "$RUNNER_TEMP/hybridhome1.strings"
        ! grep -Fq '[COMPATBOOT]' "$RUNNER_TEMP/hybridhome1.strings"
        test ! -e "$UPSTREAM/src/emu/j2me"

        {
          echo 'HYBRIDHOME1 BUILD AUDIT'
          echo 'architecture=OLDOS_STYLE_HOST_SHELL_PLUS_REAL_SYMBIAN_BACKEND'
          echo 'baseline=HOMEONLY9_BACKEND_ON_MENUUI36_NOJAVA_MANIC3'
          echo 'menu3_uid=0x101F4CD2'
          echo 'real_home_uid_0x102750F0=NOT_REQUIRED'
          echo 'hybrid_presentation=UIKIT_HOST_OVERLAY'
          echo 'app_registry=EKA2L1_BRIDGE_GET_APPS'
          echo 'app_launch=EXISTING_EKA2L1_LAUNCHER'
          echo 'menu3_underlay=PRESERVED'
          echo 'nativeboot=ABSENT'
          echo 'compatboot=ABSENT'
          echo 'java_j2me=REMOVED'
        } > HYBRIDHOME1-BUILD-AUDIT.txt

    - name: Save HYBRIDHOME1 cache
      uses: actions/cache/save@v4
      with:
        path: upstream
        key: eka2l1-hybridhome1-oldos-shell-macos15-v1

    - name: Package HYBRIDHOME1 unsigned IPA
      run: |
        set -euo pipefail
        APP="$GITHUB_WORKSPACE/upstream/build-ios-device/src/emu/ios/eka2l1.app"
        IPA="$GITHUB_WORKSPACE/upstream/EKA2L1-HYBRIDHOME1-OLDOS-SHELL-unsigned.ipa"
        STAGE="$RUNNER_TEMP/ipa-stage-hybridhome1"

        rm -rf "$STAGE" "$IPA"
        mkdir -p "$STAGE/Payload"
        cp -R "$APP" "$STAGE/Payload/EKA2L1.app"
        rm -rf "$STAGE/Payload/EKA2L1.app/_CodeSignature"
        rm -f "$STAGE/Payload/EKA2L1.app/embedded.mobileprovision"
        (cd "$STAGE" && /usr/bin/zip -qry "$IPA" Payload)

        /usr/bin/unzip -t "$IPA" >/dev/null
        ! /usr/bin/unzip -l "$IPA" | grep -Eiq '\.jar([[:space:]]|$)'
        shasum -a 256 "$IPA" | tee HYBRIDHOME1-IPA-SHA256.txt

    - name: Upload HYBRIDHOME1 IPA
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-HYBRIDHOME1-OLDOS-SHELL-IPA
        path: upstream/EKA2L1-HYBRIDHOME1-OLDOS-SHELL-unsigned.ipa
        retention-days: 14

    - name: Upload HYBRIDHOME1 audit
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-HYBRIDHOME1-OLDOS-SHELL-AUDIT
        path: |
          HYBRIDHOME1-UPSTREAM-HEAD.txt
          HYBRIDHOME1-SOURCE-HEAD.txt
          HYBRIDHOME1-source.diff
          HYBRIDHOME1-BUILD-AUDIT.txt
          HYBRIDHOME1-IPA-SHA256.txt
        if-no-files-found: warn
        retention-days: 14
# HYBRIDHOME1 source refresh: 83e1326d
