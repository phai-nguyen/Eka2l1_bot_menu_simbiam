name: RED B20 CENRESETALL1 Contract

"on":
  push:
    branches:
      - nativeboot2-b20-cenresetall1
    paths:
      - test_nativeboot2_b20_cenresetall1.py
      - .github/workflows/test-nativeboot2-b20-cenresetall1-red.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  red:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Restore B19 baseline
        id: b19
        uses: actions/cache/restore@v4
        with:
          path: upstream
          key: eka2l1-nativeboot2-b19-salangabi1-nojava-manic3-macos15-v1
      - name: Verify B20 contract is RED on B19
        run: |
          set -euo pipefail
          test "${{ steps.b19.outputs.cache-hit }}" = "true"
          python3 test_nativeboot2_b20_cenresetall1.py upstream
