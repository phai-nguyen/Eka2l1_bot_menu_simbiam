name: Test NATIVEBOOT2 B23 FBSFONTSPECV2ABI1 RED

"on":
  workflow_dispatch:
  push:
    branches:
      - nativeboot2-b23-fbsfontspecv2abi1
    paths:
      - test_nativeboot2_b23_fbsfontspecv2abi1.py
      - .github/workflows/test-nativeboot2-b23-fbsfontspecv2abi1-red.yml

permissions:
  contents: read

jobs:
  red-contract:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
    - name: Checkout project
      uses: actions/checkout@v4

    - name: Restore B19 baseline
      id: b19_cache
      uses: actions/cache/restore@v4
      with:
        path: upstream
        key: eka2l1-nativeboot2-b19-salangabi1-nojava-manic3-macos15-v1

    - name: Recreate B22 and prove B23 RED
      run: |
        set -euo pipefail
        test "${{ steps.b19_cache.outputs.cache-hit }}" = "true"

        UPSTREAM="$GITHUB_WORKSPACE/upstream"
        python3 apply_nativeboot2_b20_cenresetall1.py "$UPSTREAM"
        python3 test_nativeboot2_b20_cenresetall1.py "$UPSTREAM"
        python3 apply_nativeboot2_b21_fbsfontalias1.py "$UPSTREAM"
        python3 test_nativeboot2_b21_fbsfontalias1.py "$UPSTREAM"
        python3 apply_nativeboot2_b22_fbsdefaulttypeface1.py "$UPSTREAM"
        python3 test_nativeboot2_b22_fbsdefaulttypeface1.py "$UPSTREAM"

        FONTCPP="$UPSTREAM/src/emu/services/src/fbs/impls/font.cpp"
        FONTH="$UPSTREAM/src/emu/services/include/services/fbs/font.h"

        echo '=== B22 font_spec structs ==='
        python3 - "$FONTH" <<'PY'
        import sys
        from pathlib import Path
        s = Path(sys.argv[1]).read_text(encoding="utf-8")
        start = s.find("struct font_spec_base")
        print(s[start:start+1400] if start >= 0 else "font_spec_base: NOT FOUND")
        PY

        echo '=== B22 get_nearest_font ==='
        python3 - "$FONTCPP" <<'PY'
        import sys
        from pathlib import Path
        s = Path(sys.argv[1]).read_text(encoding="utf-8")
        start = s.find("void fbscli::get_nearest_font")
        end = s.find("void fbscli::get_font_by_uid", start)
        print(s[start:end] if start >= 0 and end > start else "get_nearest_font: NOT FOUND")
        PY

        echo '=== B22 fill_bitmap_information ==='
        python3 - "$FONTCPP" <<'PY'
        import sys
        from pathlib import Path
        s = Path(sys.argv[1]).read_text(encoding="utf-8")
        start = s.find("void fbscli::fill_bitmap_information")
        end = s.find("template void fbscli::fill_bitmap_information", start)
        print(s[start:end] if start >= 0 and end > start else "fill_bitmap_information: NOT FOUND")
        PY

        python3 -m py_compile test_nativeboot2_b23_fbsfontspecv2abi1.py
        python3 test_nativeboot2_b23_fbsfontspecv2abi1.py "$UPSTREAM"
