name: Inspect NOJAVA FAST1 cached source

"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/INSPECT_NOJAVA_FAST1_TRIGGER

permissions:
  contents: read

jobs:
  inspect:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - name: Restore FAST1 cache
      id: cache
      uses: actions/cache/restore@v4
      with:
        path: upstream
        key: eka2l1-menuui22-nojava-fast1-macos15-bbe898f1921ce192-v1
    - name: Inspect native/Java boundaries
      run: |
        set -euo pipefail
        test "${{ steps.cache.outputs.cache-hit }}" = "true"
        echo '===== src/emu/CMakeLists.txt ====='
        sed -n '1,180p' upstream/src/emu/CMakeLists.txt
        echo '===== iOS CMake j2me/manic/unified refs ====='
        grep -nEi 'j2me|java|manic|EKAUnified' upstream/src/emu/ios/CMakeLists.txt || true
        echo '===== Unified header ====='
        cat upstream/src/emu/ios/app/j2me/EKAUnifiedLibraryViewController.h
        echo '===== Unified implementation ====='
        cat upstream/src/emu/ios/app/j2me/EKAUnifiedLibraryViewController.mm
        echo '===== Manic header ====='
        cat upstream/src/emu/ios/app/j2me/J2MEManicControlsView.h
        echo '===== Manic implementation ====='
        cat upstream/src/emu/ios/app/j2me/J2MEManicControlsView.m
        echo '===== Remaining app/j2me files ====='
        find upstream/src/emu/ios/app/j2me -maxdepth 2 -type f -print | sort
        echo '===== Root Java/J2ME refs ====='
        grep -nEi 'java|j2me|jar|phoneme' upstream/src/emu/ios/app/RootViewController.mm || true
        echo '===== GameControls Manic hooks ====='
        grep -nE -C 5 'controlVisualOutput|emitControlVisualForIndex|pressCodes|releaseCodes|updateJoystickToPoint|drawRect|rebuildControls' upstream/src/emu/ios/app/GameControlsView.h upstream/src/emu/ios/app/GameControlsView.mm || true
        echo '===== iOS CMake tail ====='
        sed -n '130,260p' upstream/src/emu/ios/CMakeLists.txt
