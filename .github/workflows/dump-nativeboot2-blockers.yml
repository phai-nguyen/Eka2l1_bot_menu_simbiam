name: Dump NATIVEBOOT2 kernel blocker sources

"on":
  push:
    paths:
      - '.dump-nativeboot2-blockers-trigger'

permissions:
  contents: read

jobs:
  dump:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - name: Restore NATIVEBOOT2 cache
      id: cache
      uses: actions/cache/restore@v4
      with:
        path: upstream
        key: eka2l1-nativeboot2-emuhub1-nojava-manic3-macos15-v2
    - name: Collect blocker sources
      run: |
        set -euo pipefail
        test "${{ steps.cache.outputs.cache-hit }}" = "true"
        mkdir -p dump/kernel dump/ldd dump/cmake
        cp upstream/src/emu/kernel/src/svc.cpp dump/kernel/
        cp upstream/src/emu/kernel/src/libmanager.cpp dump/kernel/
        cp upstream/src/emu/kernel/include/kernel/svc.h dump/kernel/
        cp upstream/src/emu/ldd/src/collection.cpp dump/ldd/ 2>/dev/null || true
        cp upstream/src/emu/ldd/CMakeLists.txt dump/ldd/ 2>/dev/null || true
        find upstream/src/emu/ldd -maxdepth 4 -type f | sort > dump/ldd-tree.txt
        grep -RIn "BRIDGE_REGISTER(0x83\|execute_v81a_create_logical_channel\|SVCMISS\|nokiaisc\|channel_create\|timer_create"           upstream/src/emu/kernel upstream/src/emu/ldd > dump/search.txt || true
    - uses: actions/upload-artifact@v4
      with:
        name: NATIVEBOOT2-BLOCKER-SOURCES
        path: dump
        retention-days: 2
