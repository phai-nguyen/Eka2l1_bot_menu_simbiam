name: Build EKA2L1 NATIVEBOOT2 B18 SARTC1 NOJAVA MANIC3 IPA

"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - apply_nativeboot2_b18_sartc1.py
      - .github/workflows/build-ios-nativeboot2-b18-sartc1-nojava-manic3.yml

permissions:
  contents: read

jobs:
  build-app:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
    - name: Checkout project
      uses: actions/checkout@v4

    - name: Restore B18 cache
      id: b18_cache
      uses: actions/cache/restore@v4
      with:
        path: upstream
        key: eka2l1-nativeboot2-b18-sartc1-nojava-manic3-macos15-v1

    - name: Restore B17 baseline
      id: b17_cache
      if: steps.b18_cache.outputs.cache-hit != 'true'
      uses: actions/cache/restore@v4
      with:
        path: upstream
        key: eka2l1-nativeboot2-b17-sahiddenreset1-nojava-manic3-macos15-v1

    - name: Apply B18 RM356 RTC validation response ABI and rebuild
      if: steps.b18_cache.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail
        LOG="$GITHUB_WORKSPACE/eka2l1-nativeboot2-b18-sartc1.log"
        : > "$LOG"
        exec > >(tee -a "$LOG") 2>&1

        test "${{ steps.b17_cache.outputs.cache-hit }}" = "true"

        UPSTREAM="$GITHUB_WORKSPACE/upstream"
        PATCHER="$GITHUB_WORKSPACE/apply_nativeboot2_b18_sartc1.py"
        CMAKE_BIN="$UPSTREAM/.tools/cmake-3.31.6-macos-universal/CMake.app/Contents/bin/cmake"
        SA="$UPSTREAM/src/emu/services/src/sms/sa/sa.cpp"
        SAH="$UPSTREAM/src/emu/services/include/services/sms/sa/sa.h"
        SVC="$UPSTREAM/src/emu/kernel/src/svc.cpp"
        FS="$UPSTREAM/src/emu/services/src/fs/fs.cpp"
        LOADER="$UPSTREAM/src/emu/services/src/loader/loader.cpp"
        HAL="$UPSTREAM/src/emu/system/src/hal.cpp"
        ROOT="$UPSTREAM/src/emu/ios/app/RootViewController.mm"
        STATE="$UPSTREAM/src/emu/ios/src/state.cpp"

        python3 -m py_compile "$PATCHER"
        python3 "$PATCHER" "$UPSTREAM"

        grep -Fq '[NBOOT2][SA_RTC_VALID]' "$SA"
        grep -Fq '[NBOOT2][SA_RESPONSE_RTC]' "$SA"
        grep -Fq '[NBOOT2][SA_RESPONSE_RTC_FAIL]' "$SA"
        grep -Fq '0x0100006BU' "$SA"
        grep -Fq 'REGISTER_IPC(sa_server, unk_op1, 107, "NBOOT2::SaValidateRTCTime");' "$SA"

        grep -Fq '[NBOOT2][SA_HIDDEN_RESET]' "$SA"
        grep -Fq '[NBOOT2][SA_RESPONSE_HIDDEN]' "$SA"
        grep -Fq 'REGISTER_IPC(sa_server, unk_op1, 117, "NBOOT2::SaGetHiddenReset");' "$SA"

        grep -Fq '[NBOOT2][SA_STARTUP_MODE]' "$SA"
        grep -Fq '[NBOOT2][SA_RESPONSE_MODE]' "$SA"
        grep -Fq 'REGISTER_IPC(sa_server, unk_op1, 102, "NBOOT2::SaGetGlobalStartupMode");' "$SA"

        grep -Fq '[NBOOT2][SA_OP1_CONTROL]' "$SA"
        grep -Fq '[NBOOT2][SA_OP1_PENDING]' "$SA"
        grep -Fq 'pending_sa_event_.pending();' "$SA"
        grep -Fq 'pending_sa_event_' "$SAH"

        grep -Fq '[NBOOT2][SA_RESPONSE]' "$SA"
        grep -Fq 'REGISTER_IPC(sa_server, unk_op1, 100, "NBOOT2::SaGlobalStateChange");' "$SA"
        grep -Fq 'REGISTER_IPC(sa_server, unk_op1, 1, "NBOOT2::SaServerLegacyOp1");' "$SA"
        grep -Fq 'REGISTER_IPC(sa_server, unk_op1, 1001, "SaServer::UnkOp1");' "$SA"

        grep -Fq '[NBOOT2][DM_INIT_SET_INT]' "$SVC"
        grep -Fq 'BRIDGE_REGISTER(0xB1, creator_security_info)' "$SVC"
        grep -Fq '[NBOOT2][RM356_FS_FORMAT_OPEN]' "$FS"
        grep -Fq '[NBOOT2][RM356_LOADER_FSY]' "$LOADER"
        grep -Fq '[NBOOT2][RM356_STARTUP_REASON]' "$HAL"
        grep -Fq '[NBOOT2][ESTART_RUN]' "$STATE"
        grep -Fq 'NATIVEBOOT2 EMUHUB1' "$ROOT"
        test ! -e "$UPSTREAM/src/emu/j2me"

        git -C "$UPSTREAM" diff --check
        "$CMAKE_BIN" --build "$UPSTREAM/build-ios-device" --target eka2l1 --parallel 4

        APP="$UPSTREAM/build-ios-device/src/emu/ios/eka2l1.app"
        BIN="$APP/eka2l1"
        test -x "$BIN"

        STRINGS_OUT="$RUNNER_TEMP/nativeboot2-b18-sartc1.strings"
        strings "$BIN" > "$STRINGS_OUT"
        grep -Fq '[NBOOT2][SA_RTC_VALID]' "$STRINGS_OUT"
        grep -Fq '[NBOOT2][SA_RESPONSE_RTC]' "$STRINGS_OUT"
        grep -Fq 'NBOOT2::SaValidateRTCTime' "$STRINGS_OUT"
        grep -Fq '[NBOOT2][SA_HIDDEN_RESET]' "$STRINGS_OUT"
        grep -Fq '[NBOOT2][SA_STARTUP_MODE]' "$STRINGS_OUT"
        grep -Fq '[NBOOT2][SA_OP1_PENDING]' "$STRINGS_OUT"
        grep -Fq '[NBOOT2][SA_RESPONSE]' "$STRINGS_OUT"
        grep -Fq '[NBOOT2][DM_INIT_SET_INT]' "$STRINGS_OUT"
        grep -Fq 'NATIVEBOOT2 EMUHUB1' "$STRINGS_OUT"
        ! grep -Eiq 'phoneME|JAVA-STABLE1|MMAPI-DIAG2|GM-SYNTH1 renderer=gm-sf2' "$STRINGS_OUT"

        {
          echo 'NATIVEBOOT2 B18 SARTC1 BUILD AUDIT'
          echo 'base_cache=NATIVEBOOT2_B17_SAHIDDENRESET1'
          echo 'saserver_opcode_107=EValidateRTCTime'
          echo 'rtc_response=TResponsePckg_TInt'
          echo 'rtc_payload_size=4'
          echo 'rtc_value=KErrNone_valid'
          echo 'rtc_source=EKA2L1_KERNEL_CLOCK'
          echo 'response_header=IPC_SLOT2_12_BYTES_ECHO'
          echo 'response_payload=IPC_SLOT3_4_BYTES'
          echo 'descriptor_failure=KErrBadDescriptor'
          echo 'unknown_sa_commands=NOT_BLANKET_ACKED'
          echo 'saserver_opcode_117=B17_HIDDEN_RESET_PRESERVED'
          echo 'saserver_opcode_102=B16_STARTUP_MODE_PRESERVED'
          echo 'saserver_opcode_1_event=B15_ASYNC_PENDING_PRESERVED'
          echo 'saserver_opcode_100=B14_RESPONSE_ABI_PRESERVED'
          echo 'saserver_opcode_1001=PRESERVED'
          echo 'boot_owner=firmware_SYSSTART'
          echo 'host_sysstart=DISABLED'
          echo 'host_menu=DISABLED'
          echo 'b17_sahiddenreset1=PRESERVED'
          echo 'b16_samode1=PRESERVED'
          echo 'b15_saasync1=PRESERVED'
          echo 'b14_saresponse1=PRESERVED'
          echo 'b13_saglobalstate1=PRESERVED'
          echo 'b12_saipc1=PRESERVED'
          echo 'b11_dminit1=PRESERVED'
          echo 'b10_fsformat1=PRESERVED'
          echo 'b9_fsprops1=PRESERVED'
          echo 'b8_loaderfsy1=PRESERVED'
          echo 'b7_localeabi1=PRESERVED'
          echo 'b6_rm356_bsp1=PRESERVED'
          echo 'frontend=EMUHUB1_PRESERVED'
          echo 'NOJAVA=PRESERVED'
          echo 'MANIC3=PRESERVED'
        } > "$GITHUB_WORKSPACE/NATIVEBOOT2-B18-SARTC1-BUILD-AUDIT.txt"

        git -C "$UPSTREAM" diff > "$GITHUB_WORKSPACE/NATIVEBOOT2-B18-SARTC1-source.diff"

    - name: Verify restored B18 cache
      if: steps.b18_cache.outputs.cache-hit == 'true'
      run: |
        set -euo pipefail
        UPSTREAM="$GITHUB_WORKSPACE/upstream"
        grep -Fq '[NBOOT2][SA_RTC_VALID]' "$UPSTREAM/src/emu/services/src/sms/sa/sa.cpp"
        grep -Fq '[NBOOT2][SA_RESPONSE_RTC]' "$UPSTREAM/src/emu/services/src/sms/sa/sa.cpp"
        grep -Fq '[NBOOT2][SA_HIDDEN_RESET]' "$UPSTREAM/src/emu/services/src/sms/sa/sa.cpp"
        grep -Fq '[NBOOT2][SA_STARTUP_MODE]' "$UPSTREAM/src/emu/services/src/sms/sa/sa.cpp"
        grep -Fq '[NBOOT2][SA_OP1_PENDING]' "$UPSTREAM/src/emu/services/src/sms/sa/sa.cpp"
        grep -Fq '[NBOOT2][DM_INIT_SET_INT]' "$UPSTREAM/src/emu/kernel/src/svc.cpp"
        test -x "$UPSTREAM/build-ios-device/src/emu/ios/eka2l1.app/eka2l1"
        test ! -e "$UPSTREAM/src/emu/j2me"
        echo 'NATIVEBOOT2 B18 SARTC1 cache_hit=true' > "$GITHUB_WORKSPACE/NATIVEBOOT2-B18-SARTC1-BUILD-AUDIT.txt"
        : > "$GITHUB_WORKSPACE/NATIVEBOOT2-B18-SARTC1-source.diff"

    - name: Save B18 cache
      if: steps.b18_cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: upstream
        key: eka2l1-nativeboot2-b18-sartc1-nojava-manic3-macos15-v1

    - name: Package unsigned IPA
      run: |
        set -euo pipefail
        APP="$GITHUB_WORKSPACE/upstream/build-ios-device/src/emu/ios/eka2l1.app"
        IPA="$GITHUB_WORKSPACE/upstream/EKA2L1-NATIVEBOOT2-B18-SARTC1-NOJAVA-MANIC3-unsigned.ipa"
        STAGE="$RUNNER_TEMP/ipa-stage-nativeboot2-b18"
        rm -rf "$STAGE" "$IPA"
        mkdir -p "$STAGE/Payload"
        cp -R "$APP" "$STAGE/Payload/EKA2L1.app"
        rm -rf "$STAGE/Payload/EKA2L1.app/_CodeSignature"
        rm -f "$STAGE/Payload/EKA2L1.app/embedded.mobileprovision"
        (cd "$STAGE" && /usr/bin/zip -qry "$IPA" Payload)
        /usr/bin/unzip -t "$IPA" >/dev/null
        /usr/bin/unzip -l "$IPA" > "$RUNNER_TEMP/nativeboot2-b18-ipa-list.txt"
        grep -Fq 'Payload/EKA2L1.app/eka2l1' "$RUNNER_TEMP/nativeboot2-b18-ipa-list.txt"
        ! grep -Ei '\\.jar([[:space:]]|$)' "$RUNNER_TEMP/nativeboot2-b18-ipa-list.txt"
        shasum -a 256 "$IPA" | tee "$GITHUB_WORKSPACE/NATIVEBOOT2-B18-SARTC1-IPA-SHA256.txt"

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-NATIVEBOOT2-B18-SARTC1-NOJAVA-MANIC3-IPA
        path: upstream/EKA2L1-NATIVEBOOT2-B18-SARTC1-NOJAVA-MANIC3-unsigned.ipa
        retention-days: 14

    - name: Upload audit
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-NATIVEBOOT2-B18-SARTC1-NOJAVA-MANIC3-AUDIT
        path: |
          NATIVEBOOT2-B18-SARTC1-BUILD-AUDIT.txt
          NATIVEBOOT2-B18-SARTC1-source.diff
          NATIVEBOOT2-B18-SARTC1-IPA-SHA256.txt
        retention-days: 14

    - name: Upload diagnostic log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-NATIVEBOOT2-B18-SARTC1-diagnostic-log
        path: eka2l1-nativeboot2-b18-sartc1.log
        if-no-files-found: warn
        retention-days: 14
