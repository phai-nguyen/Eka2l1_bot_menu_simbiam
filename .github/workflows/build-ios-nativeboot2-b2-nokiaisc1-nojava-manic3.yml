name: Build EKA2L1 NATIVEBOOT2 B2 NOKIAISC1 NOJAVA MANIC3 IPA

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-app:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
    - name: Checkout project
      uses: actions/checkout@v4

    - name: Restore B2 cache
      id: b2_cache
      uses: actions/cache/restore@v4
      with:
        path: upstream
        key: eka2l1-nativeboot2-b2-nokiaisc1-nojava-manic3-macos15-v1

    - name: Restore NATIVEBOOT2 EMUHUB1 baseline
      id: emuhub_cache
      if: steps.b2_cache.outputs.cache-hit != 'true'
      uses: actions/cache/restore@v4
      with:
        path: upstream
        key: eka2l1-nativeboot2-emuhub1-nojava-manic3-macos15-v2

    - name: Apply B2 NokiaISC and rebuild
      if: steps.b2_cache.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail
        LOG="$GITHUB_WORKSPACE/eka2l1-nativeboot2-b2-nokiaisc1.log"
        : > "$LOG"
        exec > >(tee -a "$LOG") 2>&1

        test "${{ steps.emuhub_cache.outputs.cache-hit }}" = "true"

        UPSTREAM="$GITHUB_WORKSPACE/upstream"
        PATCHER="$GITHUB_WORKSPACE/apply_nativeboot2_b2_nokiaisc1.py"
        CMAKE_BIN="$UPSTREAM/.tools/cmake-3.31.6-macos-universal/CMake.app/Contents/bin/cmake"
        SVC="$UPSTREAM/src/emu/kernel/src/svc.cpp"
        COLL="$UPSTREAM/src/emu/ldd/src/collection.cpp"
        ISC="$UPSTREAM/src/emu/ldd/src/nokiaisc/nokiaisc.cpp"
        ROOT="$UPSTREAM/src/emu/ios/app/RootViewController.mm"
        STATE="$UPSTREAM/src/emu/ios/src/state.cpp"
        WGC="$UPSTREAM/src/emu/services/src/window/classes/wingroup.cpp"

        python3 -m py_compile "$PATCHER"
        python3 "$PATCHER" "$UPSTREAM"

        grep -Fq 'NATIVEBOOT2-B2 NOKIAISC1 EP94_CHANNEL_ABI' "$SVC"
        grep -Fq 'BRIDGE_REGISTER(0x0A, logical_channel_request_v95)' "$SVC"
        grep -Fq 'BRIDGE_REGISTER(0x83, logical_channel_create_v95)' "$SVC"
        grep -Fq 'FACTORY_REGISTER("nokiaiscdriver", nokiaisc_factory)' "$COLL"
        grep -Fq '[NBOOT2][NOKIAISC_CONTROL]' "$ISC"
        grep -Fq '[NBOOT2][ESTART_RUN]' "$STATE"
        grep -Fq 'NATIVEBOOT2 EMUHUB1' "$ROOT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI36 WG_FOCUS:' "$WGC"
        test ! -e "$UPSTREAM/src/emu/j2me"

        python3 - <<'PY'
        from pathlib import Path
        p=Path("upstream/src/emu/kernel/src/svc.cpp")
        s=p.read_text()
        a=s.index("const eka2l1::hle::func_map svc_register_funcs_v94 = {")
        b=s.index("\n    };",a)
        v=s[a:b]
        assert "BRIDGE_REGISTER(0x0A, logical_channel_request_v95)" in v
        assert "BRIDGE_REGISTER(0x83, logical_channel_create_v95)" in v
        assert "BRIDGE_REGISTER(0xAA," not in v
        assert "BRIDGE_REGISTER(0xAB, message_construct)" in v
        assert "BRIDGE_REGISTER(0xAC, message_kill)" in v
        PY

        git -C "$UPSTREAM" diff --check
        "$CMAKE_BIN" --build "$UPSTREAM/build-ios-device" --target eka2l1 --parallel 4

        APP="$UPSTREAM/build-ios-device/src/emu/ios/eka2l1.app"
        BIN="$APP/eka2l1"
        test -x "$BIN"
        STRINGS_OUT="$RUNNER_TEMP/nativeboot2-b2-nokiaisc1.strings"
        strings "$BIN" > "$STRINGS_OUT"

        grep -Fq '[NBOOT2][NOKIAISC_INSTALL]' "$STRINGS_OUT"
        grep -Fq '[NBOOT2][NOKIAISC_CHANNEL]' "$STRINGS_OUT"
        grep -Fq '[NBOOT2][NOKIAISC_CONTROL]' "$STRINGS_OUT"
        grep -Fq '[NBOOT2][ESTART_RUN]' "$STRINGS_OUT"
        grep -Fq 'NATIVEBOOT2 EMUHUB1' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI36 WG_FOCUS:' "$STRINGS_OUT"
        ! grep -Eiq 'phoneME|JAVA-STABLE1|MMAPI-DIAG2|GM-SYNTH1 renderer=gm-sf2' "$STRINGS_OUT"

        {
          echo 'NATIVEBOOT2 B2 NOKIAISC1 BUILD AUDIT'
          echo 'base_cache=NATIVEBOOT2_EMUHUB1_V2'
          echo 'epoc94_svc_0x83=logical_channel_create_v95'
          echo 'epoc94_svc_0x0A=logical_channel_request_v95'
          echo 'nokiaiscdriver=HLE_INERT_PRESENT'
          echo 'epoc94_0xAA=UNMAPPED'
          echo 'epoc94_0xAB=message_construct'
          echo 'epoc94_0xAC=message_kill'
          echo 'frontend=EMUHUB1_PRESERVED'
          echo 'MENUUI36=PRESERVED'
          echo 'NOJAVA=PRESERVED'
          echo 'MANIC3=PRESERVED'
        } > "$GITHUB_WORKSPACE/NATIVEBOOT2-B2-NOKIAISC1-BUILD-AUDIT.txt"
        git -C "$UPSTREAM" diff > "$GITHUB_WORKSPACE/NATIVEBOOT2-B2-NOKIAISC1-source.diff"

    - name: Verify restored B2 cache
      if: steps.b2_cache.outputs.cache-hit == 'true'
      run: |
        set -euo pipefail
        UPSTREAM="$GITHUB_WORKSPACE/upstream"
        grep -Fq 'NATIVEBOOT2-B2 NOKIAISC1 EP94_CHANNEL_ABI' "$UPSTREAM/src/emu/kernel/src/svc.cpp"
        grep -Fq '[NBOOT2][NOKIAISC_CONTROL]' "$UPSTREAM/src/emu/ldd/src/nokiaisc/nokiaisc.cpp"
        test -x "$UPSTREAM/build-ios-device/src/emu/ios/eka2l1.app/eka2l1"
        test ! -e "$UPSTREAM/src/emu/j2me"
        echo 'NATIVEBOOT2 B2 NOKIAISC1 cache_hit=true' > "$GITHUB_WORKSPACE/NATIVEBOOT2-B2-NOKIAISC1-BUILD-AUDIT.txt"
        : > "$GITHUB_WORKSPACE/NATIVEBOOT2-B2-NOKIAISC1-source.diff"

    - name: Save B2 cache
      if: steps.b2_cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: upstream
        key: eka2l1-nativeboot2-b2-nokiaisc1-nojava-manic3-macos15-v1

    - name: Package unsigned IPA
      run: |
        set -euo pipefail
        APP="$GITHUB_WORKSPACE/upstream/build-ios-device/src/emu/ios/eka2l1.app"
        IPA="$GITHUB_WORKSPACE/upstream/EKA2L1-NATIVEBOOT2-B2-NOKIAISC1-NOJAVA-MANIC3-unsigned.ipa"
        STAGE="$RUNNER_TEMP/ipa-stage-nativeboot2-b2"
        rm -rf "$STAGE" "$IPA"
        mkdir -p "$STAGE/Payload"
        cp -R "$APP" "$STAGE/Payload/EKA2L1.app"
        rm -rf "$STAGE/Payload/EKA2L1.app/_CodeSignature"
        rm -f "$STAGE/Payload/EKA2L1.app/embedded.mobileprovision"
        (cd "$STAGE" && /usr/bin/zip -qry "$IPA" Payload)
        /usr/bin/unzip -t "$IPA" >/dev/null
        /usr/bin/unzip -l "$IPA" > "$RUNNER_TEMP/nativeboot2-b2-ipa-list.txt"
        grep -Fq 'Payload/EKA2L1.app/eka2l1' "$RUNNER_TEMP/nativeboot2-b2-ipa-list.txt"
        ! grep -Ei '\.jar([[:space:]]|$)' "$RUNNER_TEMP/nativeboot2-b2-ipa-list.txt"
        shasum -a 256 "$IPA" | tee "$GITHUB_WORKSPACE/NATIVEBOOT2-B2-NOKIAISC1-IPA-SHA256.txt"

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-NATIVEBOOT2-B2-NOKIAISC1-NOJAVA-MANIC3-IPA
        path: upstream/EKA2L1-NATIVEBOOT2-B2-NOKIAISC1-NOJAVA-MANIC3-unsigned.ipa
        retention-days: 14

    - name: Upload audit
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-NATIVEBOOT2-B2-NOKIAISC1-NOJAVA-MANIC3-AUDIT
        path: |
          NATIVEBOOT2-B2-NOKIAISC1-BUILD-AUDIT.txt
          NATIVEBOOT2-B2-NOKIAISC1-source.diff
          NATIVEBOOT2-B2-NOKIAISC1-IPA-SHA256.txt
        retention-days: 14

    - name: Upload diagnostic log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-NATIVEBOOT2-B2-NOKIAISC1-diagnostic-log
        path: eka2l1-nativeboot2-b2-nokiaisc1.log
        if-no-files-found: warn
        retention-days: 14
