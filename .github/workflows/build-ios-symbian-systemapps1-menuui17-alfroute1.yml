name: Build EKA2L1 SYMBIAN SYSTEMAPPS1 MENUUI17 ALFROUTE1 IPA

"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/run-menuui17-alfroute1

permissions:
  contents: read

jobs:
  build-app:
    runs-on: macos-15
    timeout-minutes: 120

    steps:
    - name: Checkout project history
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Replay frozen MENUUI16 authority build chain
      run: |
        set -euo pipefail
        LOG="$GITHUB_WORKSPACE/eka2l1-java-build.log"
        : > "$LOG"
        exec > >(tee -a "$LOG") 2>&1

        SOURCE_COMMIT="d1e3bb46bc3e07b4c169c31bbd5346d2683ada82"
        SOURCE_WORKFLOW=".github/workflows/build-ios-symbian-systemapps1-menuui16-advflag1.yml"
        SOURCE_YML="$RUNNER_TEMP/menuui17-menuui16-authority.yml"
        EXTRACT_DIR="$RUNNER_TEMP/menuui17-menuui16-steps"
        FROZEN_MENUUI16_PATCHER="$RUNNER_TEMP/apply_menuui16_advflag1.py"

        git cat-file -e "$SOURCE_COMMIT^{commit}"
        git show "$SOURCE_COMMIT:$SOURCE_WORKFLOW" > "$SOURCE_YML"
        git show "$SOURCE_COMMIT:apply_menuui16_advflag1.py" > "$FROZEN_MENUUI16_PATCHER"
        test -s "$SOURCE_YML"
        test -s "$FROZEN_MENUUI16_PATCHER"

        rm -rf "$EXTRACT_DIR"
        mkdir -p "$EXTRACT_DIR"

        python3 - "$SOURCE_YML" "$EXTRACT_DIR" "$FROZEN_MENUUI16_PATCHER" <<'PY_EXTRACT'
        import sys
        from pathlib import Path

        source = Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()
        out = Path(sys.argv[2])
        frozen_menuui16 = sys.argv[3]
        wanted = [
            "Replay frozen MENUUI15 authority build chain",
            "Apply MENUUI16 ADVFLAG1 and rebuild",
        ]

        found = {}
        i = 0
        while i < len(source):
            if not source[i].startswith("    - name:"):
                i += 1
                continue
            name = source[i].split("    - name:", 1)[1].strip()
            j = i + 1
            run_index = None
            while j < len(source) and not source[j].startswith("    - name:"):
                if source[j].startswith("      run: |"):
                    run_index = j
                    break
                j += 1
            if name in wanted:
                if run_index is None:
                    raise SystemExit(f"MENUUI17: missing run block: {name}")
                k = run_index + 1
                body = []
                while k < len(source) and not source[k].startswith("    - name:"):
                    row = source[k]
                    if row.startswith("        "):
                        body.append(row[8:])
                    elif row.strip() == "":
                        body.append("")
                    else:
                        break
                    k += 1
                found[name] = "\n".join(body) + "\n"
            i = max(j, i + 1)

        missing = [name for name in wanted if name not in found]
        if missing:
            raise SystemExit("MENUUI17: missing frozen MENUUI16 steps: " + ", ".join(missing))

        found[wanted[1]] = found[wanted[1]].replace(
            'PATCHER="$GITHUB_WORKSPACE/apply_menuui16_advflag1.py"',
            f'PATCHER="{frozen_menuui16}"',
            1,
        )

        for idx, name in enumerate(wanted, 1):
            script = out / f"step{idx}.sh"
            script.write_text("#!/usr/bin/env bash\n" + found[name], encoding="utf-8")
            print(f"MENUUI17: extracted authority step {idx}: {name}")
        PY_EXTRACT

        for n in 1 2; do
          SCRIPT="$EXTRACT_DIR/step${n}.sh"
          chmod +x "$SCRIPT"
          (cd "$GITHUB_WORKSPACE" && bash "$SCRIPT")
        done

        UPSTREAM="$GITHUB_WORKSPACE/upstream"
        BIN="$UPSTREAM/build-ios-device/src/emu/ios/eka2l1.app/eka2l1"
        WINDOW="$UPSTREAM/src/emu/services/src/window/window.cpp"
        SVC="$UPSTREAM/src/emu/kernel/src/svc.cpp"

        test -x "$BIN"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI7 IPC_SEND:' "$SVC"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI15 EVENT_GET_FULL:' "$WINDOW"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI16 ADVFLAG1:' "$WINDOW"
        grep -Fq 'guest_evt_.adv_pointer_evt_.modifier = 0;' "$WINDOW"

        echo 'MENUUI17: frozen MENUUI16 authority replay PASS'

    - name: Apply MENUUI17 ALFROUTE1 diagnostic traces and rebuild
      run: |
        set -euo pipefail
        LOG="$GITHUB_WORKSPACE/eka2l1-java-build.log"
        touch "$LOG"
        exec > >(tee -a "$LOG") 2>&1

        UPSTREAM="$GITHUB_WORKSPACE/upstream"
        PATCHER="$GITHUB_WORKSPACE/apply_menuui17_alfroute1.py"
        BIN="$UPSTREAM/build-ios-device/src/emu/ios/eka2l1.app/eka2l1"
        SVC="$UPSTREAM/src/emu/kernel/src/svc.cpp"
        WINDOW="$UPSTREAM/src/emu/services/src/window/window.cpp"

        test -f "$PATCHER"
        python3 -m py_compile "$PATCHER"

        cp "$SVC" "$RUNNER_TEMP/menuui17-svc-before.cpp"
        python3 "$PATCHER" "$UPSTREAM"

        python3 - "$SVC" "$WINDOW" <<'PY_GATE'
        from pathlib import Path
        import sys

        svc = Path(sys.argv[1]).read_text(encoding="utf-8")
        window = Path(sys.argv[2]).read_text(encoding="utf-8")

        for marker in [
            "SYMBIAN-SYSTEMAPPS1 MENUUI7 IPC_SEND:",
            "SYMBIAN-SYSTEMAPPS1 MENUUI17 ALF_PTR_ARM:",
            "SYMBIAN-SYSTEMAPPS1 MENUUI17 ALF_PTR_COPY:",
            "SYMBIAN-SYSTEMAPPS1 MENUUI17 ALF_PTR_WORD:",
            "SYMBIAN-SYSTEMAPPS1 MENUUI17 ALF_PTR_COMPLETE:",
            "SYMBIAN-SYSTEMAPPS1 MENUUI17 ALF_PTR_FRAME:",
        ]:
            assert marker in svc, marker

        for marker in [
            "SYMBIAN-SYSTEMAPPS1 MENUUI14 INPUT_GET:",
            "SYMBIAN-SYSTEMAPPS1 MENUUI15 EVENT_GET_FULL:",
            "SYMBIAN-SYSTEMAPPS1 MENUUI16 ADVFLAG1:",
        ]:
            assert marker in window, marker

        assert 'guest_evt_.adv_pointer_evt_.modifier = 0;' in window
        assert '10282845_10282845_AppServer' in svc
        assert 'msg->function == 7' in svc
        assert '0x101F4CD2U' in svc

        print("MENUUI17 ALFROUTE1 source gates: PASS")
        PY_GATE

        git -C "$UPSTREAM" diff --check
        git -C "$UPSTREAM" diff > "$GITHUB_WORKSPACE/MENUUI17-ALFROUTE1-source.diff"
        diff -u "$RUNNER_TEMP/menuui17-svc-before.cpp" "$SVC" > "$GITHUB_WORKSPACE/MENUUI17-ALFROUTE1-only.diff" || test $? -eq 1

        {
          echo "MENUUI17 ALFROUTE1 BUILD AUDIT"
          echo "menuui16_authority_commit=d1e3bb46bc3e07b4c169c31bbd5346d2683ada82"
          echo "menuui15_authority_commit=16653be42030f4d4f116221aa5d0a5d149a0d65d"
          echo "menuui14_device_authority_commit=df0ff57277f433c394720857b5391559024dc661"
          echo "upstream_head=$(git -C "$UPSTREAM" rev-parse HEAD)"
          echo "menuui13_fs_diruid1=PRESERVED"
          echo "menuui14_inputdispatch1=PRESERVED"
          echo "menuui15_eventsem1=PRESERVED"
          echo "menuui16_advflag1=PRESERVED"
          echo "scope=diagnostic_only_kernel_ipc_trace"
          echo "client_uid=0x101F4CD2"
          echo "alf_server=10282845_10282845_AppServer"
          echo "alf_pointer_opcode=7"
          echo "trace=ARM_COPY_PAYLOAD_COMPLETE_ALFSTACK"
          echo "behavior_change=NONE"
        } > "$GITHUB_WORKSPACE/MENUUI17-ALFROUTE1-BUILD-AUDIT.txt"

        cmake --build "$UPSTREAM/build-ios-device" --parallel 4

        test -x "$BIN"
        STRINGS_OUT="$RUNNER_TEMP/menuui17.binary.strings"
        strings "$BIN" > "$STRINGS_OUT"

        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI13 FS_DIRUID1:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI14 INPUT_HIT:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI14 INPUT_GET:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI15 EVENT_TARGET:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI15 EVENT_GET_FULL:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI16 ADVFLAG1:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI17 ALF_PTR_ARM:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI17 ALF_PTR_COPY:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI17 ALF_PTR_WORD:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI17 ALF_PTR_COMPLETE:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI17 ALF_PTR_FRAME:' "$STRINGS_OUT"

        echo 'MENUUI17 ALFROUTE1 binary + preserved authority gates: PASS'

    - name: Package MENUUI17 ALFROUTE1 unsigned IPA
      run: |
        set -euo pipefail
        LOG="$GITHUB_WORKSPACE/eka2l1-java-build.log"
        touch "$LOG"
        exec > >(tee -a "$LOG") 2>&1

        APP="$GITHUB_WORKSPACE/upstream/build-ios-device/src/emu/ios/eka2l1.app"
        BIN="$APP/eka2l1"
        IPA="$GITHUB_WORKSPACE/upstream/EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI17-ALFROUTE1-unsigned.ipa"
        STAGE="$RUNNER_TEMP/ipa-stage-menuui17-alfroute1"
        IPA_LIST="$RUNNER_TEMP/menuui17-alfroute1.ipa-list.txt"

        test -d "$APP"
        test -x "$BIN"
        rm -rf "$STAGE" "$IPA"
        mkdir -p "$STAGE/Payload"
        cp -R "$APP" "$STAGE/Payload/EKA2L1.app"
        rm -rf "$STAGE/Payload/EKA2L1.app/_CodeSignature"
        rm -f "$STAGE/Payload/EKA2L1.app/embedded.mobileprovision"
        (cd "$STAGE" && /usr/bin/zip -qry "$IPA" Payload)
        /usr/bin/unzip -t "$IPA" >/dev/null
        /usr/bin/unzip -l "$IPA" > "$IPA_LIST"
        grep -Fq 'Payload/EKA2L1.app/eka2l1' "$IPA_LIST"
        test -s "$IPA"
        shasum -a 256 "$IPA" | tee "$GITHUB_WORKSPACE/MENUUI17-ALFROUTE1-IPA-SHA256.txt"

        echo 'MENUUI17 ALFROUTE1 unsigned IPA package: PASS'

    - name: Upload MENUUI17 ALFROUTE1 IPA
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI17-ALFROUTE1-IPA
        path: upstream/EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI17-ALFROUTE1-unsigned.ipa
        if-no-files-found: error
        retention-days: 14

    - name: Upload MENUUI17 ALFROUTE1 audit
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI17-ALFROUTE1-AUDIT
        path: |
          MENUUI17-ALFROUTE1-source.diff
          MENUUI17-ALFROUTE1-only.diff
          MENUUI17-ALFROUTE1-BUILD-AUDIT.txt
          MENUUI17-ALFROUTE1-IPA-SHA256.txt
        if-no-files-found: warn
        retention-days: 14

    - name: Upload diagnostic log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI17-ALFROUTE1-diagnostic-log
        path: eka2l1-java-build.log
        if-no-files-found: warn
        retention-days: 14
