name: Build EKA2L1 SYMBIAN SYSTEMAPPS1 MENUUI15 EVENTSEM1 IPA

"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/run-menuui15-eventsem1

permissions:
  contents: read

jobs:
  build-app:
    runs-on: macos-15
    timeout-minutes: 120

    steps:
    - name: Checkout project history
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Replay device-validated MENUUI14 FIX2 build chain
      run: |
        set -euo pipefail
        LOG="$GITHUB_WORKSPACE/eka2l1-java-build.log"
        : > "$LOG"
        exec > >(tee -a "$LOG") 2>&1

        SOURCE_COMMIT="df0ff57277f433c394720857b5391559024dc661"
        SOURCE_WORKFLOW=".github/workflows/build-ios-symbian-systemapps1-menuui14-inputdispatch1-fix2.yml"
        SOURCE_YML="$RUNNER_TEMP/menuui15-menuui14-fix2.yml"
        SCRIPT="$RUNNER_TEMP/menuui15-replay-menuui14-fix2.sh"

        git cat-file -e "$SOURCE_COMMIT^{commit}"
        git show "$SOURCE_COMMIT:$SOURCE_WORKFLOW" > "$SOURCE_YML"
        test -s "$SOURCE_YML"

        python3 - "$SOURCE_YML" "$SCRIPT" <<'PY_EXTRACT'
        import sys
        from pathlib import Path

        source = Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()
        output = Path(sys.argv[2])
        wanted = "Replay MENUUI14 workflow with FIX2 patcher"

        start = None
        run_index = None
        for i, line in enumerate(source):
            if line.startswith("    - name:") and line.split("    - name:", 1)[1].strip() == wanted:
                start = i
                j = i + 1
                while j < len(source) and not source[j].startswith("    - name:"):
                    if source[j].startswith("      run: |"):
                        run_index = j
                        break
                    j += 1
                break
        if start is None or run_index is None:
            raise SystemExit("MENUUI15: frozen MENUUI14 FIX2 replay step not found")

        body = []
        k = run_index + 1
        while k < len(source) and not source[k].startswith("    - name:"):
            row = source[k]
            if row.startswith("        "):
                body.append(row[8:])
            elif row.strip() == "":
                body.append("")
            else:
                break
            k += 1

        output.write_text("#!/usr/bin/env bash\n" + "\n".join(body) + "\n", encoding="utf-8")
        print("MENUUI15: extracted frozen MENUUI14 FIX2 replay step")
        PY_EXTRACT

        chmod +x "$SCRIPT"
        (cd "$GITHUB_WORKSPACE" && bash "$SCRIPT")

        UPSTREAM="$GITHUB_WORKSPACE/upstream"
        BIN="$UPSTREAM/build-ios-device/src/emu/ios/eka2l1.app/eka2l1"
        test -x "$BIN"
        strings "$BIN" > "$RUNNER_TEMP/menuui15-base.strings"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI13 FS_DIRUID1:' "$RUNNER_TEMP/menuui15-base.strings"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI14 INPUT_GET:' "$RUNNER_TEMP/menuui15-base.strings"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI14 INPUT_HIT:' "$RUNNER_TEMP/menuui15-base.strings"
        echo 'MENUUI15: frozen MENUUI14 FIX2 replay PASS'

    - name: Apply MENUUI15 EVENTSEM1 diagnostic-only traces
      run: |
        set -euo pipefail
        LOG="$GITHUB_WORKSPACE/eka2l1-java-build.log"
        touch "$LOG"
        exec > >(tee -a "$LOG") 2>&1

        UPSTREAM="$GITHUB_WORKSPACE/upstream"
        PATCHER="$GITHUB_WORKSPACE/apply_menuui15_eventsem1.py"
        BIN="$UPSTREAM/build-ios-device/src/emu/ios/eka2l1.app/eka2l1"
        WINDOW="$UPSTREAM/src/emu/services/src/window/window.cpp"
        IO="$UPSTREAM/src/emu/services/src/window/io.cpp"
        FIFO="$UPSTREAM/src/emu/services/src/window/fifo.cpp"
        WINUSER="$UPSTREAM/src/emu/services/src/window/classes/winuser.cpp"
        OP="$UPSTREAM/src/emu/services/include/services/window/op.h"

        test -f "$PATCHER"
        python3 -m py_compile "$PATCHER"
        python3 "$PATCHER" "$UPSTREAM"

        python3 - "$WINDOW" "$IO" "$FIFO" "$WINUSER" "$OP" <<'PY_GATE'
        from pathlib import Path
        import sys

        window, io, fifo, winuser, op = [Path(p).read_text(encoding="utf-8") for p in sys.argv[1:]]

        # Device-proven MENUUI14 path must remain present.
        # INPUT_WAKE is emitted by fifo.cpp; validate each marker in its owner.
        for source, marker in [
            (window, "SYMBIAN-SYSTEMAPPS1 MENUUI14 INPUT_POINTER:"),
            (io, "SYMBIAN-SYSTEMAPPS1 MENUUI14 INPUT_HIT:"),
            (io, "SYMBIAN-SYSTEMAPPS1 MENUUI14 INPUT_FIFO_ENQUEUE:"),
            (fifo, "SYMBIAN-SYSTEMAPPS1 MENUUI14 INPUT_WAKE:"),
            (window, "SYMBIAN-SYSTEMAPPS1 MENUUI14 INPUT_GET:"),
        ]:
            assert marker in source, marker

        # Static semantic gap under investigation.
        assert "EWsWinOpEnableAdvancedPointers" in op
        assert "case EWsWinOpEnableAdvancedPointers:" not in winuser

        for marker in [
            "MENUUI15 EVENTSEM1: diagnostic-only post-GetEvent/pointer-semantics trace",
            "SYMBIAN-SYSTEMAPPS1 MENUUI15 EVENT_TARGET:",
        ]:
            assert marker in io, marker
        assert "SYMBIAN-SYSTEMAPPS1 MENUUI15 EVENT_GET_FULL:" in window
        assert "SYMBIAN-SYSTEMAPPS1 MENUUI15 ADV_OPCODE:" in winuser

        print("MENUUI15 EVENTSEM1 source + semantic gates: PASS")
        PY_GATE

        git -C "$UPSTREAM" diff --check
        git -C "$UPSTREAM" diff > "$GITHUB_WORKSPACE/MENUUI15-EVENTSEM1-source.diff"

        {
          echo "MENUUI15 EVENTSEM1 BUILD AUDIT"
          echo "menuui14_authority_commit=df0ff57277f433c394720857b5391559024dc661"
          echo "upstream_head=$(git -C "$UPSTREAM" rev-parse HEAD)"
          echo "menuui13_fs_diruid1=PRESERVED"
          echo "menuui14_inputdispatch1=PRESERVED"
          echo "enable_advanced_opcode_declared=YES"
          if grep -Fq 'case EWsWinOpEnableAdvancedPointers:' "$WINUSER"; then
            echo "enable_advanced_base_handler=PRESENT"
          else
            echo "enable_advanced_base_handler=ABSENT"
          fi
          echo "make_mouse_event_advanced_modifier=UNCONDITIONAL_IN_FROZEN_BASE"
          echo "behavior_change=NONE_DIAGNOSTIC_ONLY"
          echo "research_target=post_GetEvent_pointer_semantics_and_EnableAdvancedPointers"
        } > "$GITHUB_WORKSPACE/MENUUI15-EVENTSEM1-BUILD-AUDIT.txt"

        cmake --build "$UPSTREAM/build-ios-device" --parallel 4

        test -x "$BIN"
        STRINGS_OUT="$RUNNER_TEMP/menuui15.binary.strings"
        strings "$BIN" > "$STRINGS_OUT"

        # Preserve authority markers.
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI13 FS_DIRUID1:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI14 INPUT_HIT:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI14 INPUT_GET:' "$STRINGS_OUT"

        # New diagnostic markers.
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI15 EVENT_TARGET:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI15 EVENT_GET_FULL:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI15 ADV_OPCODE:' "$STRINGS_OUT"

        echo 'MENUUI15 EVENTSEM1 binary + preserved authority gates: PASS'

    - name: Package MENUUI15 EVENTSEM1 unsigned IPA
      run: |
        set -euo pipefail
        LOG="$GITHUB_WORKSPACE/eka2l1-java-build.log"
        touch "$LOG"
        exec > >(tee -a "$LOG") 2>&1

        APP="$GITHUB_WORKSPACE/upstream/build-ios-device/src/emu/ios/eka2l1.app"
        BIN="$APP/eka2l1"
        IPA="$GITHUB_WORKSPACE/upstream/EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI15-EVENTSEM1-unsigned.ipa"
        STAGE="$RUNNER_TEMP/ipa-stage-menuui15-eventsem1"
        IPA_LIST="$RUNNER_TEMP/menuui15-eventsem1.ipa-list.txt"

        test -d "$APP"
        test -x "$BIN"
        rm -rf "$STAGE" "$IPA"
        mkdir -p "$STAGE/Payload"
        cp -R "$APP" "$STAGE/Payload/EKA2L1.app"
        rm -rf "$STAGE/Payload/EKA2L1.app/_CodeSignature"
        rm -f "$STAGE/Payload/EKA2L1.app/embedded.mobileprovision"
        (cd "$STAGE" && /usr/bin/zip -qry "$IPA" Payload)
        /usr/bin/unzip -t "$IPA" >/dev/null
        /usr/bin/unzip -l "$IPA" > "$IPA_LIST"
        grep -Fq 'Payload/EKA2L1.app/eka2l1' "$IPA_LIST"
        test -s "$IPA"
        shasum -a 256 "$IPA" | tee "$GITHUB_WORKSPACE/MENUUI15-EVENTSEM1-IPA-SHA256.txt"
        echo 'MENUUI15 EVENTSEM1 unsigned IPA package: PASS'

    - name: Upload MENUUI15 EVENTSEM1 IPA
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI15-EVENTSEM1-IPA
        path: upstream/EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI15-EVENTSEM1-unsigned.ipa
        if-no-files-found: error
        retention-days: 14

    - name: Upload MENUUI15 EVENTSEM1 audit
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI15-EVENTSEM1-AUDIT
        path: |
          MENUUI15-EVENTSEM1-source.diff
          MENUUI15-EVENTSEM1-BUILD-AUDIT.txt
          MENUUI15-EVENTSEM1-IPA-SHA256.txt
        if-no-files-found: warn
        retention-days: 14

    - name: Upload diagnostic log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI15-EVENTSEM1-diagnostic-log
        path: eka2l1-java-build.log
        if-no-files-found: warn
        retention-days: 14
