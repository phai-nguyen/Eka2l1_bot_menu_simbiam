name: Build EKA2L1 NATIVEBOOT2 EMUHUB1 NOJAVA MANIC3 IPA

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-app:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
    - name: Checkout project
      uses: actions/checkout@v4

    - name: Restore NATIVEBOOT2 cache
      id: nativeboot2_cache
      uses: actions/cache/restore@v4
      with:
        path: upstream
        key: eka2l1-nativeboot2-emuhub1-nojava-manic3-macos15-v2

    - name: Restore stable MENUUI36 baseline
      id: menuui36_cache
      if: steps.nativeboot2_cache.outputs.cache-hit != 'true'
      uses: actions/cache/restore@v4
      with:
        path: upstream
        key: eka2l1-menuui36-winfocus1-nojava-manic3-macos15-v1

    - name: Apply NATIVEBOOT2 EMUHUB1 and rebuild
      if: steps.nativeboot2_cache.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail
        LOG="$GITHUB_WORKSPACE/eka2l1-nativeboot2-emuhub1.log"
        : > "$LOG"
        exec > >(tee -a "$LOG") 2>&1

        test "${{ steps.menuui36_cache.outputs.cache-hit }}" = "true"

        UPSTREAM="$GITHUB_WORKSPACE/upstream"
        PATCHER="$GITHUB_WORKSPACE/apply_nativeboot2_emuhub1.py"
        CMAKE_BIN="$UPSTREAM/.tools/cmake-3.31.6-macos-universal/CMake.app/Contents/bin/cmake"
        ROOT="$UPSTREAM/src/emu/ios/app/RootViewController.mm"
        STATE="$UPSTREAM/src/emu/ios/src/state.cpp"
        BRIDGE="$UPSTREAM/src/emu/ios/src/emu_bridge.mm"
        INIT="$UPSTREAM/src/emu/services/src/init.cpp"
        WGC="$UPSTREAM/src/emu/services/src/window/classes/wingroup.cpp"

        python3 -m py_compile "$PATCHER"
        python3 "$PATCHER" "$UPSTREAM"

        grep -Fq 'NATIVEBOOT2 EMUHUB1' "$ROOT"
        grep -Fq 'EKAL(@"Emulator")' "$ROOT"
        grep -Fq '[NBOOT2][ESTART_RUN]' "$STATE"
        grep -Fq 'u"Z:\\sys\\bin\\EStart.exe"' "$STATE"
        ! grep -Fq 'u"Z:\sys\bin\EStart.exe"' "$STATE"
        grep -Fq '[NBOOT2][BRIDGE_ROLLBACK]' "$BRIDGE"
        grep -Fq '[NBOOT2][HLE_POLICY]' "$INIT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI36 WG_FOCUS:' "$WGC"
        ! grep -Fq 'PHONE_BOOT_PLAN' "$STATE"
        ! grep -Fq 'sysstart_path' "$STATE"
        test ! -e "$UPSTREAM/src/emu/j2me"

        git -C "$UPSTREAM" diff --check
        "$CMAKE_BIN" --build "$UPSTREAM/build-ios-device" --target eka2l1 --parallel 4

        APP="$UPSTREAM/build-ios-device/src/emu/ios/eka2l1.app"
        BIN="$APP/eka2l1"
        test -x "$BIN"
        STRINGS_OUT="$RUNNER_TEMP/nativeboot2-emuhub1.strings"
        strings "$BIN" > "$STRINGS_OUT"

        grep -Fq '[NBOOT2][BOOT_MODE]' "$STRINGS_OUT"
        grep -Fq '[NBOOT2][ESTART_RUN]' "$STRINGS_OUT"
        grep -Fq '[NBOOT2][BRIDGE_ROLLBACK]' "$STRINGS_OUT"
        grep -Fq '[NBOOT2][COLLISION]' "$STRINGS_OUT"
        grep -Fq 'NATIVEBOOT2 EMUHUB1' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI36 WG_FOCUS:' "$STRINGS_OUT"
        ! grep -Eiq 'phoneME|JAVA-STABLE1|MMAPI-DIAG2|GM-SYNTH1 renderer=gm-sf2' "$STRINGS_OUT"

        {
          echo 'NATIVEBOOT2 EMUHUB1 BUILD AUDIT'
          echo 'base_cache=MENUUI36_WINFOCUS1_NOJAVA_MANIC3'
          echo 'default_mode=stable_EKA2L1'
          echo 'toolbar=Devices,InstallGame,Settings,Emulator'
          echo 'native_mode=on_demand_only'
          echo 'handoff=Z:\sys\bin\EStart.exe_ONLY_AFTER_Z_MOUNT'
          echo 'host_sysstart=DISABLED'
          echo 'host_menu=DISABLED'
          echo 'rollback_on_handoff_failure=ENABLED'
          echo 'firmware_98pct_app_wait=REMOVED'
          echo 'native_ownership=domainSrv,applist,akncap,view,notifier,keysound,eikappui,system_agent'
          echo 'hle_keep=fs,loader,fbs,wserv,centralrepo,featmgr,hwrm,etel,comm,socket,bt,accessory,skin'
          echo 'MENUUI36=PRESERVED'
          echo 'NOJAVA=PRESERVED'
          echo 'MANIC3=PRESERVED_FROM_BASELINE'
        } > "$GITHUB_WORKSPACE/NATIVEBOOT2-EMUHUB1-BUILD-AUDIT.txt"
        git -C "$UPSTREAM" diff > "$GITHUB_WORKSPACE/NATIVEBOOT2-EMUHUB1-source.diff"

    - name: Verify restored NATIVEBOOT2 cache
      if: steps.nativeboot2_cache.outputs.cache-hit == 'true'
      run: |
        set -euo pipefail
        UPSTREAM="$GITHUB_WORKSPACE/upstream"
        grep -Fq '[NBOOT2][ESTART_RUN]' "$UPSTREAM/src/emu/ios/src/state.cpp"
        grep -Fq 'NATIVEBOOT2 EMUHUB1' "$UPSTREAM/src/emu/ios/app/RootViewController.mm"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI36 WG_FOCUS:' "$UPSTREAM/src/emu/services/src/window/classes/wingroup.cpp"
        test -x "$UPSTREAM/build-ios-device/src/emu/ios/eka2l1.app/eka2l1"
        test ! -e "$UPSTREAM/src/emu/j2me"
        echo 'NATIVEBOOT2 EMUHUB1 cache_hit=true' > "$GITHUB_WORKSPACE/NATIVEBOOT2-EMUHUB1-BUILD-AUDIT.txt"
        : > "$GITHUB_WORKSPACE/NATIVEBOOT2-EMUHUB1-source.diff"

    - name: Save NATIVEBOOT2 cache
      if: steps.nativeboot2_cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: upstream
        key: eka2l1-nativeboot2-emuhub1-nojava-manic3-macos15-v2

    - name: Package unsigned IPA
      run: |
        set -euo pipefail
        APP="$GITHUB_WORKSPACE/upstream/build-ios-device/src/emu/ios/eka2l1.app"
        IPA="$GITHUB_WORKSPACE/upstream/EKA2L1-NATIVEBOOT2-EMUHUB1-NOJAVA-MANIC3-unsigned.ipa"
        STAGE="$RUNNER_TEMP/ipa-stage-nativeboot2-emuhub1"
        rm -rf "$STAGE" "$IPA"
        mkdir -p "$STAGE/Payload"
        cp -R "$APP" "$STAGE/Payload/EKA2L1.app"
        rm -rf "$STAGE/Payload/EKA2L1.app/_CodeSignature"
        rm -f "$STAGE/Payload/EKA2L1.app/embedded.mobileprovision"
        (cd "$STAGE" && /usr/bin/zip -qry "$IPA" Payload)
        /usr/bin/unzip -t "$IPA" >/dev/null
        /usr/bin/unzip -l "$IPA" > "$RUNNER_TEMP/nativeboot2-emuhub1-ipa-list.txt"
        grep -Fq 'Payload/EKA2L1.app/eka2l1' "$RUNNER_TEMP/nativeboot2-emuhub1-ipa-list.txt"
        ! grep -Ei '\.jar([[:space:]]|$)' "$RUNNER_TEMP/nativeboot2-emuhub1-ipa-list.txt"
        shasum -a 256 "$IPA" | tee "$GITHUB_WORKSPACE/NATIVEBOOT2-EMUHUB1-IPA-SHA256.txt"

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-NATIVEBOOT2-EMUHUB1-NOJAVA-MANIC3-IPA
        path: upstream/EKA2L1-NATIVEBOOT2-EMUHUB1-NOJAVA-MANIC3-unsigned.ipa
        retention-days: 14

    - name: Upload audit
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-NATIVEBOOT2-EMUHUB1-NOJAVA-MANIC3-AUDIT
        path: |
          NATIVEBOOT2-EMUHUB1-BUILD-AUDIT.txt
          NATIVEBOOT2-EMUHUB1-source.diff
          NATIVEBOOT2-EMUHUB1-IPA-SHA256.txt
        retention-days: 14

    - name: Upload diagnostic log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-NATIVEBOOT2-EMUHUB1-diagnostic-log
        path: eka2l1-nativeboot2-emuhub1.log
        if-no-files-found: warn
        retention-days: 14
