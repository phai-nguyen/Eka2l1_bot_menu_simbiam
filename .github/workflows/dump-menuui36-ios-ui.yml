name: Dump MENUUI36 iOS frontend sources

"on":
  push:
    paths:
      - '.dump-menuui36-ios-ui-trigger'

permissions:
  contents: read

jobs:
  dump:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - name: Restore MENUUI36 cache
      id: cache
      uses: actions/cache/restore@v4
      with:
        path: upstream
        key: eka2l1-menuui36-winfocus1-nojava-manic3-macos15-v1
    - name: Collect frontend sources
      run: |
        set -euo pipefail
        test "${{ steps.cache.outputs.cache-hit }}" = "true"
        mkdir -p dump/ios dump/system
        find upstream/src/emu/ios -maxdepth 4 -type f | sort > dump/ios-tree.txt
        while IFS= read -r f; do
          rel="${f#upstream/src/emu/ios/}"
          case "$f" in
            *.swift|*.mm|*.m|*.cpp|*.cc|*.c|*.h|*.hpp|*.plist|*.strings|*CMakeLists.txt)
              mkdir -p "dump/ios/$(dirname "$rel")"
              cp "$f" "dump/ios/$rel"
              ;;
          esac
        done < dump/ios-tree.txt
        cp upstream/src/emu/system/src/epoc.cpp dump/system/
        grep -RIn "SYMBIAN-SYSTEMAPPS1\|Ứng dụng\|Cài đặt trò chơi\|Thiết bị\|Applications\|TabView\|Picker\|system apps" dump/ios > dump/search.txt || true
    - uses: actions/upload-artifact@v4
      with:
        name: MENUUI36-IOS-FRONTEND-SOURCES
        path: dump
        retention-days: 2
