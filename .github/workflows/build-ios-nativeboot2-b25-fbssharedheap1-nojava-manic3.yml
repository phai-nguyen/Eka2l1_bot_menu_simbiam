name: Build EKA2L1 NATIVEBOOT2 B25 FBSSHAREDHEAP1 NOJAVA MANIC3 IPA

"on":
  workflow_dispatch:
  push:
    branches:
      - nativeboot2-b25-fbssharedheap1
    paths:
      - apply_nativeboot2_b20_cenresetall1.py
      - test_nativeboot2_b20_cenresetall1.py
      - apply_nativeboot2_b21_fbsfontalias1.py
      - test_nativeboot2_b21_fbsfontalias1.py
      - apply_nativeboot2_b22_fbsdefaulttypeface1.py
      - test_nativeboot2_b22_fbsdefaulttypeface1.py
      - apply_nativeboot2_b23_fbsfontspecv2abi1.py
      - test_nativeboot2_b23_fbsfontspecv2abi1.py
      - apply_nativeboot2_b24_fbsvtableabi1.py
      - test_nativeboot2_b24_fbsvtableabi1.py
      - apply_nativeboot2_b25_fbssharedheap1.py
      - test_nativeboot2_b25_fbssharedheap1.py
      - .github/workflows/build-ios-nativeboot2-b25-fbssharedheap1-nojava-manic3.yml

permissions:
  contents: read

jobs:
  build-app:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
    - name: Checkout project
      uses: actions/checkout@v4

    - name: Restore B25 cache
      id: b25_cache
      uses: actions/cache/restore@v4
      with:
        path: upstream
        key: eka2l1-nativeboot2-b25-fbssharedheap1-nojava-manic3-macos15-v1

    - name: Restore B24 baseline
      id: b24_cache
      if: steps.b25_cache.outputs.cache-hit != 'true'
      uses: actions/cache/restore@v4
      with:
        path: upstream
        key: eka2l1-nativeboot2-b24-fbsvtableabi1-nojava-manic3-macos15-v1

    - name: Restore B19 fallback baseline
      id: b19_cache
      if: steps.b25_cache.outputs.cache-hit != 'true' && steps.b24_cache.outputs.cache-hit != 'true'
      uses: actions/cache/restore@v4
      with:
        path: upstream
        key: eka2l1-nativeboot2-b19-salangabi1-nojava-manic3-macos15-v1

    - name: Apply B25 and rebuild
      if: steps.b25_cache.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail
        LOG="$GITHUB_WORKSPACE/eka2l1-nativeboot2-b25-fbssharedheap1.log"
        : > "$LOG"
        exec > >(tee -a "$LOG") 2>&1

        UPSTREAM="$GITHUB_WORKSPACE/upstream"
        CMAKE_BIN="$UPSTREAM/.tools/cmake-3.31.6-macos-universal/CMake.app/Contents/bin/cmake"

        python3 -m py_compile \
          apply_nativeboot2_b20_cenresetall1.py test_nativeboot2_b20_cenresetall1.py \
          apply_nativeboot2_b21_fbsfontalias1.py test_nativeboot2_b21_fbsfontalias1.py \
          apply_nativeboot2_b22_fbsdefaulttypeface1.py test_nativeboot2_b22_fbsdefaulttypeface1.py \
          apply_nativeboot2_b23_fbsfontspecv2abi1.py test_nativeboot2_b23_fbsfontspecv2abi1.py \
          apply_nativeboot2_b24_fbsvtableabi1.py test_nativeboot2_b24_fbsvtableabi1.py \
          apply_nativeboot2_b25_fbssharedheap1.py test_nativeboot2_b25_fbssharedheap1.py

        if [ "${{ steps.b24_cache.outputs.cache-hit }}" = "true" ]; then
          echo "Using exact B24 cache"
          python3 test_nativeboot2_b24_fbsvtableabi1.py "$UPSTREAM"
          python3 test_nativeboot2_b23_fbsfontspecv2abi1.py "$UPSTREAM"
          python3 test_nativeboot2_b22_fbsdefaulttypeface1.py "$UPSTREAM"
          python3 test_nativeboot2_b21_fbsfontalias1.py "$UPSTREAM"
          python3 test_nativeboot2_b20_cenresetall1.py "$UPSTREAM"
        else
          test "${{ steps.b19_cache.outputs.cache-hit }}" = "true"
          echo "Recreating B24 from B19 cache"

          python3 apply_nativeboot2_b20_cenresetall1.py "$UPSTREAM"
          python3 test_nativeboot2_b20_cenresetall1.py "$UPSTREAM"
          python3 apply_nativeboot2_b21_fbsfontalias1.py "$UPSTREAM"
          python3 test_nativeboot2_b21_fbsfontalias1.py "$UPSTREAM"
          python3 apply_nativeboot2_b22_fbsdefaulttypeface1.py "$UPSTREAM"
          python3 test_nativeboot2_b22_fbsdefaulttypeface1.py "$UPSTREAM"
          python3 apply_nativeboot2_b23_fbsfontspecv2abi1.py "$UPSTREAM"
          python3 test_nativeboot2_b23_fbsfontspecv2abi1.py "$UPSTREAM"
          python3 apply_nativeboot2_b24_fbsvtableabi1.py "$UPSTREAM"
          python3 test_nativeboot2_b24_fbsvtableabi1.py "$UPSTREAM"
        fi

        # GREEN: exact B25 contract that failed on B24.
        python3 apply_nativeboot2_b25_fbssharedheap1.py "$UPSTREAM"
        python3 test_nativeboot2_b25_fbssharedheap1.py "$UPSTREAM"

        # Regression suite.
        python3 test_nativeboot2_b24_fbsvtableabi1.py "$UPSTREAM"
        python3 test_nativeboot2_b23_fbsfontspecv2abi1.py "$UPSTREAM"
        python3 test_nativeboot2_b22_fbsdefaulttypeface1.py "$UPSTREAM"
        python3 test_nativeboot2_b21_fbsfontalias1.py "$UPSTREAM"
        python3 test_nativeboot2_b20_cenresetall1.py "$UPSTREAM"

        FBSCPP="$UPSTREAM/src/emu/services/src/fbs/fbs.cpp"
        FONTCPP="$UPSTREAM/src/emu/services/src/fbs/impls/font.cpp"
        REPOCPP="$UPSTREAM/src/emu/services/src/centralrepo/repo.cpp"
        SA="$UPSTREAM/src/emu/services/src/sms/sa/sa.cpp"
        SVC="$UPSTREAM/src/emu/kernel/src/svc.cpp"
        ROOT="$UPSTREAM/src/emu/ios/app/RootViewController.mm"

        grep -Fq '[NBOOT2][FBS_SHARED_HEAP_HANDOFF]' "$FBSCPP"
        grep -Fq '[NBOOT2][FBS_SHARED_HEAP_READY]' "$FBSCPP"
        grep -Fq 'rename("FbsSharedChunk.NativeBoot")' "$FBSCPP"
        grep -Fq 'rename("FbsLargeChunk.NativeBoot")' "$FBSCPP"
        grep -Fq 'get_own_process()' "$FBSCPP"
        ! grep -Fq 'shared_chunk = native_shared' "$FBSCPP"
        ! grep -Fq 'large_chunk = native_large' "$FBSCPP"

        grep -Fq '[NBOOT2][FBS_VTABLE_RELOC]' "$FONTCPP"
        grep -Fq '[NBOOT2][FBS_FONT_SPEC_ABI]' "$FONTCPP"
        grep -Fq '[NBOOT2][FBS_DEFAULT_TYPEFACE]' "$FBSCPP"
        grep -Fq '[NBOOT2][FBS_FONT_ALIAS]' "$FBSCPP"
        grep -Fq '[NBOOT2][CEN_RESET_ALL_DONE]' "$REPOCPP"
        grep -Fq '[NBOOT2][SA_LANG_ABI]' "$SA"
        grep -Fq '[NBOOT2][DM_INIT_SET_INT]' "$SVC"
        grep -Fq 'NATIVEBOOT2 EMUHUB1' "$ROOT"
        test ! -e "$UPSTREAM/src/emu/j2me"

        git -C "$UPSTREAM" diff --check
        "$CMAKE_BIN" --build "$UPSTREAM/build-ios-device" --target eka2l1 --parallel 4

        APP="$UPSTREAM/build-ios-device/src/emu/ios/eka2l1.app"
        BIN="$APP/eka2l1"
        test -x "$BIN"

        STRINGS_OUT="$RUNNER_TEMP/nativeboot2-b25-fbssharedheap1.strings"
        strings "$BIN" > "$STRINGS_OUT"
        grep -Fq '[NBOOT2][FBS_SHARED_HEAP_HANDOFF]' "$STRINGS_OUT"
        grep -Fq '[NBOOT2][FBS_SHARED_HEAP_READY]' "$STRINGS_OUT"
        grep -Fq '[NBOOT2][FBS_VTABLE_RELOC]' "$STRINGS_OUT"
        grep -Fq '[NBOOT2][FBS_FONT_SPEC_ABI]' "$STRINGS_OUT"
        grep -Fq 'NATIVEBOOT2 EMUHUB1' "$STRINGS_OUT"
        ! grep -Eiq 'phoneME|JAVA-STABLE1|MMAPI-DIAG2|GM-SYNTH1 renderer=gm-sf2' "$STRINGS_OUT"

        {
          echo 'NATIVEBOOT2 B25 FBSSHAREDHEAP1 BUILD AUDIT'
          echo 'base_cache=B24_FBSVTABLEABI1_OR_RECREATED_FROM_B19'
          echo 'device_evidence=B24_NATIVE_FBS_0x40200000_HLE_FBS_0x54200000_OFFSET_0x1598_R0_0x40201598'
          echo 'root_cause=FBS_CANONICAL_GLOBAL_CHUNK_NAME_COLLISION'
          echo 'behavior_change=GUEST_OWNED_NATIVE_FBS_CHUNKS_RENAMED_BEFORE_HLE_CANONICAL_CREATION'
          echo 'native_fbserv=PRESERVED'
          echo 'native_chunk_handles=PRESERVED'
          echo 'native_heap_adoption=NONE'
          echo 'hle_allocator=UNCHANGED'
          echo 'vtable=UNCHANGED'
          echo 'TFontSpec=UNCHANGED'
          echo 'font_matcher=UNCHANGED'
          echo 'appserver=UNCHANGED'
          echo 'boot_owner=firmware_SYSSTART'
          echo 'b24_fbsvtableabi1=PRESERVED'
          echo 'b23_fbsfontspecv2abi1=PRESERVED'
          echo 'b22_fbsdefaulttypeface1=PRESERVED'
          echo 'b21_fbsfontalias1=PRESERVED'
          echo 'b20_cenresetall1=PRESERVED'
          echo 'frontend=EMUHUB1_PRESERVED'
          echo 'NOJAVA=PRESERVED'
          echo 'MANIC3=PRESERVED'
          echo 'TDD_RED_RUN=35581550088'
        } > "$GITHUB_WORKSPACE/NATIVEBOOT2-B25-FBSSHAREDHEAP1-BUILD-AUDIT.txt"

        git -C "$UPSTREAM" diff > "$GITHUB_WORKSPACE/NATIVEBOOT2-B25-FBSSHAREDHEAP1-source.diff"

    - name: Verify restored B25 cache
      if: steps.b25_cache.outputs.cache-hit == 'true'
      run: |
        set -euo pipefail
        UPSTREAM="$GITHUB_WORKSPACE/upstream"
        python3 test_nativeboot2_b25_fbssharedheap1.py "$UPSTREAM"
        python3 test_nativeboot2_b24_fbsvtableabi1.py "$UPSTREAM"
        python3 test_nativeboot2_b23_fbsfontspecv2abi1.py "$UPSTREAM"
        python3 test_nativeboot2_b22_fbsdefaulttypeface1.py "$UPSTREAM"
        python3 test_nativeboot2_b21_fbsfontalias1.py "$UPSTREAM"
        python3 test_nativeboot2_b20_cenresetall1.py "$UPSTREAM"
        test -x "$UPSTREAM/build-ios-device/src/emu/ios/eka2l1.app/eka2l1"
        test ! -e "$UPSTREAM/src/emu/j2me"
        echo 'NATIVEBOOT2 B25 FBSSHAREDHEAP1 cache_hit=true' > "$GITHUB_WORKSPACE/NATIVEBOOT2-B25-FBSSHAREDHEAP1-BUILD-AUDIT.txt"
        : > "$GITHUB_WORKSPACE/NATIVEBOOT2-B25-FBSSHAREDHEAP1-source.diff"

    - name: Save B25 cache
      if: steps.b25_cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: upstream
        key: eka2l1-nativeboot2-b25-fbssharedheap1-nojava-manic3-macos15-v1

    - name: Package unsigned IPA
      run: |
        set -euo pipefail
        APP="$GITHUB_WORKSPACE/upstream/build-ios-device/src/emu/ios/eka2l1.app"
        IPA="$GITHUB_WORKSPACE/upstream/EKA2L1-NATIVEBOOT2-B25-FBSSHAREDHEAP1-NOJAVA-MANIC3-unsigned.ipa"
        STAGE="$RUNNER_TEMP/ipa-stage-nativeboot2-b25"
        rm -rf "$STAGE" "$IPA"
        mkdir -p "$STAGE/Payload"
        cp -R "$APP" "$STAGE/Payload/EKA2L1.app"
        rm -rf "$STAGE/Payload/EKA2L1.app/_CodeSignature"
        rm -f "$STAGE/Payload/EKA2L1.app/embedded.mobileprovision"
        (cd "$STAGE" && /usr/bin/zip -qry "$IPA" Payload)
        /usr/bin/unzip -t "$IPA" >/dev/null
        /usr/bin/unzip -l "$IPA" > "$RUNNER_TEMP/nativeboot2-b25-ipa-list.txt"
        grep -Fq 'Payload/EKA2L1.app/eka2l1' "$RUNNER_TEMP/nativeboot2-b25-ipa-list.txt"
        ! grep -Ei '\\.jar([[:space:]]|$)' "$RUNNER_TEMP/nativeboot2-b25-ipa-list.txt"
        shasum -a 256 "$IPA" | tee "$GITHUB_WORKSPACE/NATIVEBOOT2-B25-FBSSHAREDHEAP1-IPA-SHA256.txt"

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-NATIVEBOOT2-B25-FBSSHAREDHEAP1-NOJAVA-MANIC3-IPA
        path: upstream/EKA2L1-NATIVEBOOT2-B25-FBSSHAREDHEAP1-NOJAVA-MANIC3-unsigned.ipa
        retention-days: 14

    - name: Upload audit
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-NATIVEBOOT2-B25-FBSSHAREDHEAP1-NOJAVA-MANIC3-AUDIT
        path: |
          NATIVEBOOT2-B25-FBSSHAREDHEAP1-BUILD-AUDIT.txt
          NATIVEBOOT2-B25-FBSSHAREDHEAP1-source.diff
          NATIVEBOOT2-B25-FBSSHAREDHEAP1-IPA-SHA256.txt
        retention-days: 14

    - name: Upload diagnostic log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-NATIVEBOOT2-B25-FBSSHAREDHEAP1-diagnostic-log
        path: eka2l1-nativeboot2-b25-fbssharedheap1.log
        if-no-files-found: warn
        retention-days: 14
