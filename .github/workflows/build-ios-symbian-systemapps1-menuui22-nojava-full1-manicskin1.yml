name: Build EKA2L1 SYMBIAN SYSTEMAPPS1 MENUUI22 NOJAVA FULL1 MANICSKIN1 IPA

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-app:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
    - name: Checkout project
      uses: actions/checkout@v4

    - name: Restore MANICSKIN1 cache
      id: skin_cache
      uses: actions/cache/restore@v4
      with:
        path: upstream
        key: eka2l1-menuui22-nojava-full1-manicskin1-macos15-v1

    - name: Restore proven NOJAVA FULL1 MANIC1 base
      id: full1_cache
      if: steps.skin_cache.outputs.cache-hit != 'true'
      uses: actions/cache/restore@v4
      with:
        path: upstream
        key: eka2l1-menuui22-nojava-full1-manic1-macos15-v1

    - name: Apply MANICSKIN1 and rebuild
      if: steps.skin_cache.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail
        LOG="$GITHUB_WORKSPACE/eka2l1-manicskin1-build.log"
        : > "$LOG"
        exec > >(tee -a "$LOG") 2>&1

        test "${{ steps.full1_cache.outputs.cache-hit }}" = "true"
        UPSTREAM="$GITHUB_WORKSPACE/upstream"
        PATCHER="$GITHUB_WORKSPACE/apply_manicskin1.py"
        CMAKE_BIN="$UPSTREAM/.tools/cmake-3.31.6-macos-universal/CMake.app/Contents/bin/cmake"

        test -x "$CMAKE_BIN"
        python3 -m py_compile "$PATCHER"
        python3 "$PATCHER" "$UPSTREAM"

        "$CMAKE_BIN" --build "$UPSTREAM/build-ios-device" --target eka2l1 --parallel 4

        APP="$UPSTREAM/build-ios-device/src/emu/ios/eka2l1.app"
        BIN="$APP/eka2l1"
        MANAGER="$UPSTREAM/src/emu/ios/app/controls/manic/EKAManicSkinManager.mm"
        SETTINGS="$UPSTREAM/src/emu/ios/app/GameSettingsViewController.mm"
        STORE="$UPSTREAM/src/emu/ios/app/GameSettingsStore.mm"
        ROOT="$UPSTREAM/src/emu/ios/app/RootViewController.mm"
        IOS_CMAKE="$UPSTREAM/src/emu/ios/CMakeLists.txt"

        test -x "$BIN"
        grep -Fq 'mz_zip_reader_init_file' "$MANAGER"
        grep -Fq 'Import .manicskin' "$SETTINGS"
        grep -Fq 'UIDocumentPickerDelegate' "$SETTINGS"
        grep -Fq 'MIN(7, [dict[@"keyLayout"] integerValue])' "$STORE"
        grep -Fq 'manicSkinID' "$STORE"
        grep -Fq 'setActiveSkinID' "$ROOT"
        grep -Fq 'EKAManicSkinManager.mm' "$IOS_CMAKE"
        grep -Fq 'src/external/miniz' "$IOS_CMAKE"

        test ! -e "$UPSTREAM/src/emu/j2me"
        test ! -e "$UPSTREAM/src/emu/ios/app/j2me"
        ! find "$UPSTREAM/build-ios-device" -type f -name 'libj2me.a' -print -quit | grep -q .
        ! grep -Ei 'src/emu/j2me|libj2me\.a' "$UPSTREAM/build-ios-device/build.ninja"

        STRINGS_OUT="$RUNNER_TEMP/manicskin1.strings"
        strings "$BIN" > "$STRINGS_OUT"
        grep -Fq 'Import .manicskin' "$STRINGS_OUT"
        grep -Fq 'Manic Skin Installed' "$STRINGS_OUT"
        grep -Fq 'com.eka2l1.manicskin' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI22 WAIT_OWNER:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI22 WAIT_FRAME:' "$STRINGS_OUT"

        git -C "$UPSTREAM" diff --check

        APP_BYTES=$(du -sk "$APP" | awk '{print $1 * 1024}')
        {
          echo 'MENUUI22 NOJAVA FULL1 MANICSKIN1 BUILD AUDIT'
          echo 'base=NOJAVA_FULL1_MANIC1'
          echo 'manicskin_import=ENABLED'
          echo 'manicskin_format=ZIP_JSON_PNG_V1'
          echo 'manicskin_security=PATH_AND_SIZE_VALIDATED'
          echo 'manicskin_scope=PER_GAME'
          echo 'layout7_persistence=FIXED'
          echo 'symbian_ngage_scancodes=NATIVE_UNCHANGED'
          echo 'j2me_target=ABSENT'
          echo "app_bundle_bytes=$APP_BYTES"
        } > "$GITHUB_WORKSPACE/MENUUI22-NOJAVA-FULL1-MANICSKIN1-BUILD-AUDIT.txt"

        echo 'MENUUI22 NOJAVA FULL1 MANICSKIN1 build: PASS'

    - name: Verify restored MANICSKIN1 cache
      if: steps.skin_cache.outputs.cache-hit == 'true'
      run: |
        set -euo pipefail
        UPSTREAM="$GITHUB_WORKSPACE/upstream"
        APP="$UPSTREAM/build-ios-device/src/emu/ios/eka2l1.app"
        BIN="$APP/eka2l1"
        test -x "$BIN"
        test -f "$UPSTREAM/src/emu/ios/app/controls/manic/EKAManicSkinManager.mm"
        grep -Fq 'Import .manicskin' "$UPSTREAM/src/emu/ios/app/GameSettingsViewController.mm"
        test ! -e "$UPSTREAM/src/emu/j2me"
        ! find "$UPSTREAM/build-ios-device" -type f -name 'libj2me.a' -print -quit | grep -q .
        echo 'MENUUI22 NOJAVA FULL1 MANICSKIN1 cache restore: PASS'
        APP_BYTES=$(du -sk "$APP" | awk '{print $1 * 1024}')
        {
          echo 'MENUUI22 NOJAVA FULL1 MANICSKIN1 BUILD AUDIT'
          echo 'base=NOJAVA_FULL1_MANIC1'
          echo 'manicskin_import=ENABLED'
          echo 'cache_hit=true'
          echo "app_bundle_bytes=$APP_BYTES"
        } > "$GITHUB_WORKSPACE/MENUUI22-NOJAVA-FULL1-MANICSKIN1-BUILD-AUDIT.txt"

    - name: Save MANICSKIN1 cache
      if: steps.skin_cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: upstream
        key: eka2l1-menuui22-nojava-full1-manicskin1-macos15-v1

    - name: Package MANICSKIN1 unsigned IPA
      run: |
        set -euo pipefail
        APP="$GITHUB_WORKSPACE/upstream/build-ios-device/src/emu/ios/eka2l1.app"
        IPA="$GITHUB_WORKSPACE/upstream/EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI22-NOJAVA-FULL1-MANICSKIN1-unsigned.ipa"
        STAGE="$RUNNER_TEMP/ipa-stage-manicskin1"
        IPA_LIST="$RUNNER_TEMP/manicskin1-ipa-list.txt"

        rm -rf "$STAGE" "$IPA"
        mkdir -p "$STAGE/Payload"
        cp -R "$APP" "$STAGE/Payload/EKA2L1.app"
        rm -rf "$STAGE/Payload/EKA2L1.app/_CodeSignature"
        rm -f "$STAGE/Payload/EKA2L1.app/embedded.mobileprovision"
        (cd "$STAGE" && /usr/bin/zip -qry "$IPA" Payload)
        /usr/bin/unzip -t "$IPA" >/dev/null
        /usr/bin/unzip -l "$IPA" > "$IPA_LIST"
        grep -Fq 'Payload/EKA2L1.app/eka2l1' "$IPA_LIST"
        grep -Fq 'EKAManicControls/dpad.png' "$IPA_LIST"
        ! grep -Ei '\.jar([[:space:]]|$)' "$IPA_LIST"
        test -s "$IPA"

        shasum -a 256 "$IPA" | tee "$GITHUB_WORKSPACE/MENUUI22-NOJAVA-FULL1-MANICSKIN1-IPA-SHA256.txt"
        du -h "$IPA" | tee "$GITHUB_WORKSPACE/MENUUI22-NOJAVA-FULL1-MANICSKIN1-IPA-SIZE.txt"
        echo 'MENUUI22 NOJAVA FULL1 MANICSKIN1 unsigned IPA package: PASS'

    - name: Upload MANICSKIN1 IPA
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI22-NOJAVA-FULL1-MANICSKIN1-IPA
        path: upstream/EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI22-NOJAVA-FULL1-MANICSKIN1-unsigned.ipa
        if-no-files-found: error
        retention-days: 14

    - name: Upload MANICSKIN1 audit
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI22-NOJAVA-FULL1-MANICSKIN1-AUDIT
        path: |
          MENUUI22-NOJAVA-FULL1-MANICSKIN1-BUILD-AUDIT.txt
          MENUUI22-NOJAVA-FULL1-MANICSKIN1-IPA-SHA256.txt
          MENUUI22-NOJAVA-FULL1-MANICSKIN1-IPA-SIZE.txt
        if-no-files-found: error
        retention-days: 14

    - name: Upload MANICSKIN1 diagnostic log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI22-NOJAVA-FULL1-MANICSKIN1-diagnostic-log
        path: eka2l1-manicskin1-build.log
        if-no-files-found: warn
        retention-days: 14
