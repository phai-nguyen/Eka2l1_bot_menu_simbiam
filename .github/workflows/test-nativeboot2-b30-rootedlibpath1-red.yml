name: B30 ROOTEDLIBPATH1 RED

"on":
  push:
    branches:
      - nativeboot2-current
    paths:
      - ".github/workflows/test-nativeboot2-b30-rootedlibpath1-red.yml"

permissions:
  contents: read

jobs:
  red:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4

    - name: Restore stable B28 bootstrap
      id: b28
      uses: actions/cache/restore@v4
      with:
        path: upstream
        key: eka2l1-fastbuild1-bootstrap-b28-nojava-manic3-macos15-v1

    - name: Prove B30 contract is RED before implementation
      run: |
        set -euo pipefail
        test "${{ steps.b28.outputs.cache-hit }}" = "true"
        UPSTREAM="$GITHUB_WORKSPACE/upstream"
        python3 ci/fastbuild1_manifest.py validate "$GITHUB_WORKSPACE"
        python3 ci/fastbuild1_manifest.py apply "$GITHUB_WORKSPACE" "$UPSTREAM"
        python3 test_nativeboot2_b30_rootedlibpath1.py "$UPSTREAM"
