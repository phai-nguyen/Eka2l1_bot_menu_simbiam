name: Build EKA2L1 SYMBIAN SYSTEMAPPS1 MENUUI35 SIMULATEEVENT ASYNC1 NOJAVA MANIC3 IPA

"on":
  workflow_dispatch:
  push:
    paths:
      - ".github/menuui35-simulateevent-async1-trigger3.txt"

permissions:
  contents: read

jobs:
  build-app:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
    - name: Checkout project
      uses: actions/checkout@v4

    - name: Restore MENUUI35 cache
      id: menuui35_cache
      uses: actions/cache/restore@v4
      with:
        path: upstream
        key: eka2l1-menuui35-simulateevent-async1-nojava-manic3-macos15-v1

    - name: Restore MENUUI34 baseline
      id: menuui34_cache
      if: steps.menuui35_cache.outputs.cache-hit != 'true'
      uses: actions/cache/restore@v4
      with:
        path: upstream
        key: eka2l1-menuui34-simulateevent1-nojava-manic3-macos15-v1

    - name: Apply MENUUI35 deferred SimulateEvent and rebuild
      if: steps.menuui35_cache.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail
        LOG="$GITHUB_WORKSPACE/eka2l1-menuui35-simulateevent-async1.log"
        : > "$LOG"
        exec > >(tee -a "$LOG") 2>&1

        test "${{ steps.menuui34_cache.outputs.cache-hit }}" = "true"

        UPSTREAM="$GITHUB_WORKSPACE/upstream"
        PATCHER="$GITHUB_WORKSPACE/apply_menuui35_simulateevent_async1.py"
        CMAKE_BIN="$UPSTREAM/.tools/cmake-3.31.6-macos-universal/CMake.app/Contents/bin/cmake"
        ANIM="$UPSTREAM/src/emu/services/src/window/classes/plugins/animdll.cpp"
        WIN="$UPSTREAM/src/emu/services/src/window/window.cpp"
        KEY="$UPSTREAM/src/emu/services/src/audio/keysound/keysound.cpp"
        MQ="$UPSTREAM/src/emu/kernel/src/msgqueue.cpp"

        python3 -m py_compile "$PATCHER"
        python3 "$PATCHER" "$UPSTREAM"

        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI35 SIMULATE_EVENT: stage=enter' "$ANIM"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI35 SIMULATE_EVENT: stage=return' "$ANIM"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI35 POST_RAW_DEFER: stage=queued' "$WIN"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI35 POST_RAW_DEFER: stage=dispatch' "$WIN"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI35 POST_RAW_DEFER: stage=complete' "$WIN"
        grep -Fq 'libuv::default_looper->one_shot' "$WIN"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI33 KEYSOUND13:' "$KEY"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI32 PENINPUT_QUEUE:' "$MQ"
        test ! -e "$UPSTREAM/src/emu/j2me"

        git -C "$UPSTREAM" diff --check
        "$CMAKE_BIN" --build "$UPSTREAM/build-ios-device" --target eka2l1 --parallel 4

        APP="$UPSTREAM/build-ios-device/src/emu/ios/eka2l1.app"
        BIN="$APP/eka2l1"
        test -x "$BIN"
        STRINGS_OUT="$RUNNER_TEMP/menuui35.strings"
        strings "$BIN" > "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI35 SIMULATE_EVENT:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI35 POST_RAW_DEFER:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI33 KEYSOUND13:' "$STRINGS_OUT"
        ! grep -Eiq 'phoneME|JAVA-STABLE1|MMAPI-DIAG2|GM-SYNTH1 renderer=gm-sf2' "$STRINGS_OUT"

        {
          echo 'MENUUI35 SIMULATEEVENT-ASYNC1 NOJAVA MANIC3 BUILD AUDIT'
          echo 'base_cache=MENUUI34_SIMULATEEVENT1_NOJAVA_MANIC3'
          echo 'opcode510_sync_reentry=REMOVED'
          echo 'PostRawEvent=DEFERRED_ON_LIBUV_LOOPER'
          echo 'simulated_guard=SCOPED_TO_DEFERRED_DISPATCH'
          echo 'MENUUI34_SYNC_POSTRAW=SUPERSEDED_BY_MENUUI35_DEFERRED'
          echo 'MENUUI33=PRESERVED'
          echo 'MENUUI32=PRESERVED'
          echo 'java_j2me=REMOVED'
        } > "$GITHUB_WORKSPACE/MENUUI35-SIMULATEEVENT-ASYNC1-BUILD-AUDIT.txt"
        git -C "$UPSTREAM" diff > "$GITHUB_WORKSPACE/MENUUI35-SIMULATEEVENT-ASYNC1-source.diff"

    - name: Verify restored MENUUI35 cache
      if: steps.menuui35_cache.outputs.cache-hit == 'true'
      run: |
        set -euo pipefail
        UPSTREAM="$GITHUB_WORKSPACE/upstream"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI35 SIMULATE_EVENT:' "$UPSTREAM/src/emu/services/src/window/classes/plugins/animdll.cpp"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI35 POST_RAW_DEFER:' "$UPSTREAM/src/emu/services/src/window/window.cpp"
        test -x "$UPSTREAM/build-ios-device/src/emu/ios/eka2l1.app/eka2l1"
        test ! -e "$UPSTREAM/src/emu/j2me"
        echo 'MENUUI35 SIMULATEEVENT-ASYNC1 cache_hit=true' > "$GITHUB_WORKSPACE/MENUUI35-SIMULATEEVENT-ASYNC1-BUILD-AUDIT.txt"
        : > "$GITHUB_WORKSPACE/MENUUI35-SIMULATEEVENT-ASYNC1-source.diff"

    - name: Save MENUUI35 cache
      if: steps.menuui35_cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: upstream
        key: eka2l1-menuui35-simulateevent-async1-nojava-manic3-macos15-v1

    - name: Package MENUUI35 unsigned IPA
      run: |
        set -euo pipefail
        APP="$GITHUB_WORKSPACE/upstream/build-ios-device/src/emu/ios/eka2l1.app"
        IPA="$GITHUB_WORKSPACE/upstream/EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI35-SIMULATEEVENT-ASYNC1-NOJAVA-MANIC3-unsigned.ipa"
        STAGE="$RUNNER_TEMP/ipa-stage-menuui35"
        rm -rf "$STAGE" "$IPA"
        mkdir -p "$STAGE/Payload"
        cp -R "$APP" "$STAGE/Payload/EKA2L1.app"
        rm -rf "$STAGE/Payload/EKA2L1.app/_CodeSignature"
        rm -f "$STAGE/Payload/EKA2L1.app/embedded.mobileprovision"
        (cd "$STAGE" && /usr/bin/zip -qry "$IPA" Payload)
        /usr/bin/unzip -t "$IPA" >/dev/null
        shasum -a 256 "$IPA" | tee "$GITHUB_WORKSPACE/MENUUI35-SIMULATEEVENT-ASYNC1-IPA-SHA256.txt"

    - name: Upload MENUUI35 IPA
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI35-SIMULATEEVENT-ASYNC1-NOJAVA-MANIC3-IPA
        path: upstream/EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI35-SIMULATEEVENT-ASYNC1-NOJAVA-MANIC3-unsigned.ipa
        retention-days: 14

    - name: Upload MENUUI35 audit
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI35-SIMULATEEVENT-ASYNC1-NOJAVA-MANIC3-AUDIT
        path: |
          MENUUI35-SIMULATEEVENT-ASYNC1-BUILD-AUDIT.txt
          MENUUI35-SIMULATEEVENT-ASYNC1-source.diff
          MENUUI35-SIMULATEEVENT-ASYNC1-IPA-SHA256.txt
        retention-days: 14

    - name: Upload diagnostic log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI35-SIMULATEEVENT-ASYNC1-diagnostic-log
        path: eka2l1-menuui35-simulateevent-async1.log
        if-no-files-found: warn
        retention-days: 14
