name: RED B34 FOCUSMUTEXSPLIT1 Contract

"on":
  push:
    branches:
      - nativeboot2-current
    paths:
      - test_nativeboot2_b34_focusmutexsplit1.py
      - .github/workflows/test-nativeboot2-b34-focusmutexsplit1-red.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  red:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Restore stable B28 bootstrap
        id: b28
        uses: actions/cache/restore@v4
        with:
          path: upstream
          key: eka2l1-fastbuild1-bootstrap-b28-nojava-manic3-macos15-v1

      - name: Reconstruct exact B33 baseline
        run: |
          set -euo pipefail
          UP="$GITHUB_WORKSPACE/upstream"
          test "${{ steps.b28.outputs.cache-hit }}" = "true"
          python3 test_nativeboot2_b28_wservlibtype1.py "$UP"
          python3 apply_nativeboot2_b29_cenreptx1.py "$UP"
          python3 test_nativeboot2_b29_cenreptx1.py "$UP"
          python3 apply_nativeboot2_b29_diag1.py "$UP"
          python3 test_nativeboot2_b29_diag1.py "$UP"
          python3 apply_nativeboot2_b29_loaderdiag1.py "$UP"
          python3 test_nativeboot2_b29_loaderdiag1.py "$UP"
          python3 apply_nativeboot2_b30_rootedlibpath1.py "$UP"
          python3 test_nativeboot2_b30_rootedlibpath1.py "$UP"
          python3 apply_nativeboot2_b31_schedreadymm1.py "$UP"
          python3 test_nativeboot2_b31_schedreadymm1.py "$UP"
          python3 apply_nativeboot2_b32_eiksrvfaultdiag1.py "$UP"
          python3 test_nativeboot2_b32_eiksrvfaultdiag1.py "$UP"
          python3 apply_nativeboot2_b33_eikcancelorigin1.py "$UP"
          python3 test_nativeboot2_b33_eikcancelorigin1.py "$UP"

      - name: Prove B34 contract RED on B33
        run: |
          set -euo pipefail
          python3 test_nativeboot2_b34_focusmutexsplit1.py "$GITHUB_WORKSPACE/upstream"
