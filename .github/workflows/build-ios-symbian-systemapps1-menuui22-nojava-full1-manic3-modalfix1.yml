name: Build EKA2L1 SYMBIAN SYSTEMAPPS1 MENUUI22 NOJAVA FULL1 MANIC3 MODALFIX1 IPA

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-app:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
    - name: Checkout project
      uses: actions/checkout@v4

    - name: Restore MANIC3 MODALFIX1 cache
      id: manic3_cache
      uses: actions/cache/restore@v4
      with:
        path: upstream
        key: eka2l1-menuui22-nojava-full1-manic3-modalfix1-macos15-v1

    - name: Restore proven MANIC2 base
      id: manic2_cache
      if: steps.manic3_cache.outputs.cache-hit != 'true'
      uses: actions/cache/restore@v4
      with:
        path: upstream
        key: eka2l1-menuui22-nojava-full1-manic2-macos15-v1

    - name: Fix control skins overlapping GameMenuView
      if: steps.manic3_cache.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail
        LOG="$GITHUB_WORKSPACE/eka2l1-manic3-modalfix1-build.log"
        : > "$LOG"
        exec > >(tee -a "$LOG") 2>&1

        test "${{ steps.manic2_cache.outputs.cache-hit }}" = "true"
        UPSTREAM="$GITHUB_WORKSPACE/upstream"
        PATCHER="$GITHUB_WORKSPACE/apply_manic_modalfix1.py"
        CMAKE_BIN="$UPSTREAM/.tools/cmake-3.31.6-macos-universal/CMake.app/Contents/bin/cmake"
        ROOT="$UPSTREAM/src/emu/ios/app/RootViewController.mm"

        test -x "$CMAKE_BIN"
        python3 -m py_compile "$PATCHER"
        python3 "$PATCHER" "$UPSTREAM"

        "$CMAKE_BIN" --build "$UPSTREAM/build-ios-device" --target eka2l1 --parallel 4

        APP="$UPSTREAM/build-ios-device/src/emu/ios/eka2l1.app"
        BIN="$APP/eka2l1"
        test -x "$BIN"

        grep -Fq 'MANIC_MODALFIX1: GameMenuView is a full-screen UIView sibling' "$ROOT"
        grep -Fq '[self.view bringSubviewToFront:menu];' "$ROOT"
        grep -Fq '[self.view bringSubviewToFront:self.activeMenu];' "$ROOT"
        grep -Fq 'if (self.activeMenu && self.activeMenu.superview == self.view)' "$ROOT"

        # Preserve MANIC2 and NOJAVA invariants.
        grep -Fq 'if (i == 7) return @"Manic Skin";' "$ROOT"
        grep -Fq 'EKAManicControlsArtworkView' "$ROOT"
        test ! -e "$UPSTREAM/src/emu/j2me"
        ! find "$UPSTREAM/build-ios-device" -type f -name 'libj2me.a' -print -quit | grep -q .
        test -f "$APP/EKAManicControls/dpad.png"

        STRINGS_OUT="$RUNNER_TEMP/manic3-modalfix1.strings"
        strings "$BIN" > "$STRINGS_OUT"
        grep -Fq 'Manic Skin' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI22 WAIT_OWNER:' "$STRINGS_OUT"
        ! grep -Eiq 'J2ME|phoneME|JAVA-STABLE1|MMAPI-DIAG2|GM-SYNTH1 renderer=gm-sf2' "$STRINGS_OUT"

        git -C "$UPSTREAM" diff --check

        {
          echo 'MENUUI22 NOJAVA FULL1 MANIC3 MODALFIX1 AUDIT'
          echo 'base_cache=NOJAVA_FULL1_MANIC2'
          echo 'game_menu_zorder=TOPMOST'
          echo 'all_builtin_layouts_overlap_fix=ENABLED'
          echo 'manic_skin_overlap_fix=ENABLED'
          echo 'native_scancode_engine=PRESERVED'
          echo 'java_j2me=REMOVED'
        } > "$GITHUB_WORKSPACE/MENUUI22-NOJAVA-FULL1-MANIC3-MODALFIX1-AUDIT.txt"

        echo 'MENUUI22 NOJAVA FULL1 MANIC3 MODALFIX1 build: PASS'

    - name: Verify restored MANIC3 MODALFIX1 cache
      if: steps.manic3_cache.outputs.cache-hit == 'true'
      run: |
        set -euo pipefail
        UPSTREAM="$GITHUB_WORKSPACE/upstream"
        ROOT="$UPSTREAM/src/emu/ios/app/RootViewController.mm"
        APP="$UPSTREAM/build-ios-device/src/emu/ios/eka2l1.app"
        test -x "$APP/eka2l1"
        grep -Fq '[self.view bringSubviewToFront:self.activeMenu];' "$ROOT"
        grep -Fq 'MANIC_MODALFIX1' "$ROOT"
        echo 'MANIC3 MODALFIX1 cache restore: PASS'
        {
          echo 'MENUUI22 NOJAVA FULL1 MANIC3 MODALFIX1 AUDIT'
          echo 'cache_hit=true'
          echo 'game_menu_zorder=TOPMOST'
        } > "$GITHUB_WORKSPACE/MENUUI22-NOJAVA-FULL1-MANIC3-MODALFIX1-AUDIT.txt"

    - name: Save MANIC3 MODALFIX1 cache
      if: steps.manic3_cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: upstream
        key: eka2l1-menuui22-nojava-full1-manic3-modalfix1-macos15-v1

    - name: Package MANIC3 MODALFIX1 unsigned IPA
      run: |
        set -euo pipefail
        APP="$GITHUB_WORKSPACE/upstream/build-ios-device/src/emu/ios/eka2l1.app"
        IPA="$GITHUB_WORKSPACE/upstream/EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI22-NOJAVA-FULL1-MANIC3-MODALFIX1-unsigned.ipa"
        STAGE="$RUNNER_TEMP/ipa-stage-manic3-modalfix1"
        IPA_LIST="$RUNNER_TEMP/manic3-modalfix1-ipa-list.txt"

        rm -rf "$STAGE" "$IPA"
        mkdir -p "$STAGE/Payload"
        cp -R "$APP" "$STAGE/Payload/EKA2L1.app"
        rm -rf "$STAGE/Payload/EKA2L1.app/_CodeSignature"
        rm -f "$STAGE/Payload/EKA2L1.app/embedded.mobileprovision"
        (cd "$STAGE" && /usr/bin/zip -qry "$IPA" Payload)

        /usr/bin/unzip -t "$IPA" >/dev/null
        /usr/bin/unzip -l "$IPA" > "$IPA_LIST"
        grep -Fq 'Payload/EKA2L1.app/eka2l1' "$IPA_LIST"
        grep -Fq 'EKAManicControls/dpad.png' "$IPA_LIST"
        ! grep -Ei '\.jar([[:space:]]|$)' "$IPA_LIST"

        shasum -a 256 "$IPA" | tee "$GITHUB_WORKSPACE/MENUUI22-NOJAVA-FULL1-MANIC3-MODALFIX1-IPA-SHA256.txt"
        du -h "$IPA" | tee "$GITHUB_WORKSPACE/MENUUI22-NOJAVA-FULL1-MANIC3-MODALFIX1-IPA-SIZE.txt"
        echo 'MANIC3 MODALFIX1 unsigned IPA package: PASS'

    - name: Upload MANIC3 MODALFIX1 IPA
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI22-NOJAVA-FULL1-MANIC3-MODALFIX1-IPA
        path: upstream/EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI22-NOJAVA-FULL1-MANIC3-MODALFIX1-unsigned.ipa
        if-no-files-found: error
        retention-days: 14

    - name: Upload MANIC3 MODALFIX1 audit
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI22-NOJAVA-FULL1-MANIC3-MODALFIX1-AUDIT
        path: |
          MENUUI22-NOJAVA-FULL1-MANIC3-MODALFIX1-AUDIT.txt
          MENUUI22-NOJAVA-FULL1-MANIC3-MODALFIX1-IPA-SHA256.txt
          MENUUI22-NOJAVA-FULL1-MANIC3-MODALFIX1-IPA-SIZE.txt
        if-no-files-found: error
        retention-days: 14

    - name: Upload diagnostic log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI22-NOJAVA-FULL1-MANIC3-MODALFIX1-diagnostic-log
        path: eka2l1-manic3-modalfix1-build.log
        if-no-files-found: warn
        retention-days: 14
