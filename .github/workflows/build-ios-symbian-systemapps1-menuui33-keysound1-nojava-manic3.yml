name: Build EKA2L1 SYMBIAN SYSTEMAPPS1 MENUUI33 KEYSOUND1 NOJAVA MANIC3 IPA

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-app:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
    - name: Checkout project
      uses: actions/checkout@v4

    - name: Restore MENUUI33 cache
      id: menuui33_cache
      uses: actions/cache/restore@v4
      with:
        path: upstream
        key: eka2l1-menuui33-keysound1-nojava-manic3-macos15-v1

    - name: Restore MENUUI32 baseline
      id: menuui32_cache
      if: steps.menuui33_cache.outputs.cache-hit != 'true'
      uses: actions/cache/restore@v4
      with:
        path: upstream
        key: eka2l1-menuui32-peninputqueue1-nojava-manic3-macos15-v1

    - name: Apply MENUUI33 KeySound opcode 13 and rebuild
      if: steps.menuui33_cache.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail
        LOG="$GITHUB_WORKSPACE/eka2l1-menuui33-keysound1.log"
        : > "$LOG"
        exec > >(tee -a "$LOG") 2>&1

        test "${{ steps.menuui32_cache.outputs.cache-hit }}" = "true"

        UPSTREAM="$GITHUB_WORKSPACE/upstream"
        PATCHER="$GITHUB_WORKSPACE/apply_menuui33_keysound1.py"
        CMAKE_BIN="$UPSTREAM/.tools/cmake-3.31.6-macos-universal/CMake.app/Contents/bin/cmake"
        OPS="$UPSTREAM/src/emu/services/include/services/audio/keysound/ops.h"
        HDR="$UPSTREAM/src/emu/services/include/services/audio/keysound/keysound.h"
        CPP="$UPSTREAM/src/emu/services/src/audio/keysound/keysound.cpp"
        MQ="$UPSTREAM/src/emu/kernel/src/msgqueue.cpp"
        WIN="$UPSTREAM/src/emu/services/src/window/window.cpp"

        python3 -m py_compile "$PATCHER"
        python3 "$PATCHER" "$UPSTREAM"

        grep -Fq 'opcode_disable_next_key_sound = 13' "$OPS"
        grep -Fq 'void disable_next_key_sound(service::ipc_context *ctx);' "$HDR"
        grep -Fq 'case epoc::keysound::opcode_disable_next_key_sound:' "$CPP"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI33 KEYSOUND13:' "$CPP"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI32 PENINPUT_QUEUE:' "$MQ"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI31 PENINPUT_RAW:' "$WIN"
        test ! -e "$UPSTREAM/src/emu/j2me"

        git -C "$UPSTREAM" diff --check
        "$CMAKE_BIN" --build "$UPSTREAM/build-ios-device" --target eka2l1 --parallel 4

        APP="$UPSTREAM/build-ios-device/src/emu/ios/eka2l1.app"
        BIN="$APP/eka2l1"
        test -x "$BIN"
        STRINGS_OUT="$RUNNER_TEMP/menuui33.strings"
        strings "$BIN" > "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI33 KEYSOUND13:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI32 PENINPUT_QUEUE:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI31 PENINPUT_RAW:' "$STRINGS_OUT"
        ! grep -Eiq 'phoneME|JAVA-STABLE1|MMAPI-DIAG2|GM-SYNTH1 renderer=gm-sf2' "$STRINGS_OUT"

        {
          echo 'MENUUI33 KEYSOUND1 NOJAVA MANIC3 BUILD AUDIT'
          echo 'base_cache=MENUUI32_PENINPUTQUEUE1_NOJAVA_MANIC3'
          echo 'device_evidence=raw_down_received_then_keysound_opcode13_never_completed'
          echo 'keysound_opcode13=DisableNextKeySound_IMPLEMENTED'
          echo 'sync_ipc_completion=IMPLEMENTED'
          echo 'MENUUI32_QUEUE_TRACE=PRESERVED'
          echo 'MENUUI31_RAW=PRESERVED'
          echo 'MENUUI30_STOCKFEP=PRESERVED'
          echo 'java_j2me=REMOVED'
        } > "$GITHUB_WORKSPACE/MENUUI33-KEYSOUND1-BUILD-AUDIT.txt"
        git -C "$UPSTREAM" diff > "$GITHUB_WORKSPACE/MENUUI33-KEYSOUND1-source.diff"

    - name: Verify restored MENUUI33 cache
      if: steps.menuui33_cache.outputs.cache-hit == 'true'
      run: |
        set -euo pipefail
        UPSTREAM="$GITHUB_WORKSPACE/upstream"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI33 KEYSOUND13:' "$UPSTREAM/src/emu/services/src/audio/keysound/keysound.cpp"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI32 PENINPUT_QUEUE:' "$UPSTREAM/src/emu/kernel/src/msgqueue.cpp"
        test -x "$UPSTREAM/build-ios-device/src/emu/ios/eka2l1.app/eka2l1"
        test ! -e "$UPSTREAM/src/emu/j2me"
        echo 'MENUUI33 KEYSOUND1 cache_hit=true' > "$GITHUB_WORKSPACE/MENUUI33-KEYSOUND1-BUILD-AUDIT.txt"
        : > "$GITHUB_WORKSPACE/MENUUI33-KEYSOUND1-source.diff"

    - name: Save MENUUI33 cache
      if: steps.menuui33_cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: upstream
        key: eka2l1-menuui33-keysound1-nojava-manic3-macos15-v1

    - name: Package MENUUI33 unsigned IPA
      run: |
        set -euo pipefail
        APP="$GITHUB_WORKSPACE/upstream/build-ios-device/src/emu/ios/eka2l1.app"
        IPA="$GITHUB_WORKSPACE/upstream/EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI33-KEYSOUND1-NOJAVA-MANIC3-unsigned.ipa"
        STAGE="$RUNNER_TEMP/ipa-stage-menuui33"
        rm -rf "$STAGE" "$IPA"
        mkdir -p "$STAGE/Payload"
        cp -R "$APP" "$STAGE/Payload/EKA2L1.app"
        rm -rf "$STAGE/Payload/EKA2L1.app/_CodeSignature"
        rm -f "$STAGE/Payload/EKA2L1.app/embedded.mobileprovision"
        (cd "$STAGE" && /usr/bin/zip -qry "$IPA" Payload)
        /usr/bin/unzip -t "$IPA" >/dev/null
        shasum -a 256 "$IPA" | tee "$GITHUB_WORKSPACE/MENUUI33-KEYSOUND1-IPA-SHA256.txt"

    - name: Upload MENUUI33 IPA
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI33-KEYSOUND1-NOJAVA-MANIC3-IPA
        path: upstream/EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI33-KEYSOUND1-NOJAVA-MANIC3-unsigned.ipa
        retention-days: 14

    - name: Upload MENUUI33 audit
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI33-KEYSOUND1-NOJAVA-MANIC3-AUDIT
        path: |
          MENUUI33-KEYSOUND1-BUILD-AUDIT.txt
          MENUUI33-KEYSOUND1-source.diff
          MENUUI33-KEYSOUND1-IPA-SHA256.txt
        retention-days: 14

    - name: Upload diagnostic log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI33-KEYSOUND1-diagnostic-log
        path: eka2l1-menuui33-keysound1.log
        if-no-files-found: warn
        retention-days: 14
