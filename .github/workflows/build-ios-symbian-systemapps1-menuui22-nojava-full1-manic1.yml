name: Build EKA2L1 SYMBIAN SYSTEMAPPS1 MENUUI22 NOJAVA FULL1 MANIC1 IPA

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-app:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
    - name: Checkout project history
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Restore NOJAVA FULL1 MANIC1 cache
      id: full_cache
      uses: actions/cache/restore@v4
      with:
        path: upstream
        key: eka2l1-menuui22-nojava-full1-manic1-macos15-v1

    - name: Restore proven NOJAVA FAST1 base
      id: fast1_cache
      if: steps.full_cache.outputs.cache-hit != 'true'
      uses: actions/cache/restore@v4
      with:
        path: upstream
        key: eka2l1-menuui22-nojava-fast1-macos15-bbe898f1921ce192-v1

    - name: Remove core Java target and migrate Manic to native controls
      if: steps.full_cache.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail
        LOG="$GITHUB_WORKSPACE/eka2l1-nojava-full1-manic1-build.log"
        : > "$LOG"
        exec > >(tee -a "$LOG") 2>&1

        test "${{ steps.fast1_cache.outputs.cache-hit }}" = "true"
        UPSTREAM="$GITHUB_WORKSPACE/upstream"
        PATCHER="$GITHUB_WORKSPACE/apply_nojava_full1_manic1.py"
        test -x "$UPSTREAM/build-ios-device/src/emu/ios/eka2l1.app/eka2l1"
        test -s "$PATCHER"
        python3 -m py_compile "$PATCHER"
        python3 "$PATCHER" "$UPSTREAM"

        # Remove stale products from the old graph before CMake regenerates Ninja.
        rm -rf "$UPSTREAM/build-ios-device/src/emu/j2me"
        find "$UPSTREAM/build-ios-device" -type f -name 'libj2me.a' -delete || true

        # FAST1's Ninja files were generated by a CMake binary under RUNNER_TEMP,
        # which does not survive across runners. Pin the same CMake version under
        # upstream/.tools so the path itself is cached and reusable by later builds.
        CMAKE_ROOT="$UPSTREAM/.tools/cmake-3.31.6-macos-universal"
        CMAKE_BIN="$CMAKE_ROOT/CMake.app/Contents/bin/cmake"
        if [ ! -x "$CMAKE_BIN" ]; then
          mkdir -p "$UPSTREAM/.tools"
          curl -fsSL -o "$RUNNER_TEMP/cmake-3.31.6.tar.gz" \
            https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-macos-universal.tar.gz
          tar xzf "$RUNNER_TEMP/cmake-3.31.6.tar.gz" -C "$UPSTREAM/.tools"
        fi
        "$CMAKE_BIN" --version

        # Reconfigure in-place once so CMAKE_COMMAND/VerifyGlobs point at the
        # persistent cached tool rather than the previous runner's temp path.
        (
          cd "$UPSTREAM"
          "$CMAKE_BIN" -S . -B build-ios-device -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DFETCH_LIBUV=ON \
            -DFETCHCONTENT_SOURCE_DIR_LIBUV="$UPSTREAM/src/external/libuv"
        )
        "$CMAKE_BIN" --build "$UPSTREAM/build-ios-device" --parallel 4

        APP="$UPSTREAM/build-ios-device/src/emu/ios/eka2l1.app"
        BIN="$APP/eka2l1"
        SVC="$UPSTREAM/src/emu/kernel/src/svc.cpp"
        IOS_CMAKE="$UPSTREAM/src/emu/ios/CMakeLists.txt"
        EMU_CMAKE="$UPSTREAM/src/emu/CMakeLists.txt"
        ROOT="$UPSTREAM/src/emu/ios/app/RootViewController.mm"
        SETTINGS="$UPSTREAM/src/emu/ios/app/GameSettingsViewController.mm"
        MANIC="$UPSTREAM/src/emu/ios/app/controls/manic/EKAManicControlsView.m"
        UNIFIED="$UPSTREAM/src/emu/ios/app/library/EKAUnifiedLibraryViewController.mm"

        test -x "$BIN"
        test ! -e "$UPSTREAM/src/emu/j2me"
        test ! -e "$UPSTREAM/src/emu/ios/app/j2me"
        ! grep -Eq 'add_subdirectory[[:space:]]*\([[:space:]]*j2me' "$EMU_CMAKE"
        ! grep -RniE 'j2me|phoneme' "$UPSTREAM/src/emu" --include='CMakeLists.txt'
        ! find "$UPSTREAM/build-ios-device" -type f -name 'libj2me.a' -print -quit | grep -q .
        ! grep -Ei 'src/emu/j2me|libj2me\.a' "$UPSTREAM/build-ios-device/build.ninja"

        grep -Fq 'app/library/EKAUnifiedLibraryViewController.mm' "$IOS_CMAKE"
        grep -Fq 'app/controls/manic/EKAManicControlsView.m' "$IOS_CMAKE"
        grep -Fq 'NOJAVA_FULL1' "$UNIFIED"
        grep -Fq 'MANIC_NATIVE1' "$MANIC"
        grep -Fq 'EKAManicControlsArtworkView' "$ROOT"
        grep -Fq 'EKAManicDefaultControlLayout' "$ROOT"
        grep -Fq 'if (layout == 7) return @"Manic";' "$SETTINGS"

        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI22 WAIT_OWNER:' "$SVC"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI22 WAIT_FRAME:' "$SVC"

        # Java payloads must be gone, while EKA2L1's native Symbian sound bank is preserved.
        find "$APP" -type f -name '*.jar' -delete
        find "$APP" -type f -name 'GeneralUser GS SoftSynth*.sf2' -delete
        find "$APP" -type f -name 'GeneralUser-GS-*' -delete
        find "$APP" -type f -name 'TinySoundFont-LICENSE.txt' -delete
        ! find "$APP" -type f -name '*.jar' -print -quit | grep -q .
        ! find "$APP" -type f -name 'GeneralUser GS SoftSynth*.sf2' -print -quit | grep -q .
        test -f "$APP/assets/resources/defaultbank.sf2"

        test -f "$APP/EKAManicControls/info.json"
        test -f "$APP/EKAManicControls/dpad.png"
        test -f "$APP/EKAManicControls/thumbstick.png"
        test -f "$APP/EKAManicControls/fire_button.png"

        STRINGS_OUT="$RUNNER_TEMP/menuui22-nojava-full1-manic1.strings"
        strings "$BIN" > "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI22 WAIT_OWNER:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI22 WAIT_FRAME:' "$STRINGS_OUT"
        grep -Fq 'Manic' "$STRINGS_OUT"
        ! grep -Eiq 'J2ME|phoneME|JAVA-STABLE1|MMAPI-DIAG2|GM-SYNTH1 renderer=gm-sf2' "$STRINGS_OUT"

        git -C "$UPSTREAM" diff --check

        APP_BYTES=$(du -sk "$APP" | awk '{print $1 * 1024}')
        {
          echo 'MENUUI22 NOJAVA FULL1 MANIC1 BUILD AUDIT'
          echo 'menuui22_authority=PRESERVED'
          echo 'src_emu_j2me=REMOVED'
          echo 'libj2me_target=REMOVED'
          echo 'ios_java_tree=REMOVED'
          echo 'phoneme=REMOVED'
          echo 'jar_runtime=REMOVED'
          echo 'unified_library=NATIVE_SYMBIAN_NGAGE'
          echo 'layout7=MANIC_NATIVE'
          echo 'manic_assets=NATIVE_BUNDLED'
          echo 'defaultbank_sf2=PRESERVED_NATIVE_AUDIO'
          echo "app_bundle_bytes=$APP_BYTES"
          echo 'base_cache=NOJAVA_FAST1'
          echo 'full_cache_role=NATIVE_ONLY_MENUUI22_BASE'
        } > "$GITHUB_WORKSPACE/MENUUI22-NOJAVA-FULL1-MANIC1-BUILD-AUDIT.txt"

        echo 'MENUUI22 NOJAVA FULL1 + MANIC1 build: PASS'

    - name: Verify restored NOJAVA FULL1 MANIC1 cache
      if: steps.full_cache.outputs.cache-hit == 'true'
      run: |
        set -euo pipefail
        LOG="$GITHUB_WORKSPACE/eka2l1-nojava-full1-manic1-build.log"
        : > "$LOG"
        exec > >(tee -a "$LOG") 2>&1

        UPSTREAM="$GITHUB_WORKSPACE/upstream"
        APP="$UPSTREAM/build-ios-device/src/emu/ios/eka2l1.app"
        BIN="$APP/eka2l1"
        test -x "$BIN"
        test ! -e "$UPSTREAM/src/emu/j2me"
        test ! -e "$UPSTREAM/src/emu/ios/app/j2me"
        ! find "$UPSTREAM/build-ios-device" -type f -name 'libj2me.a' -print -quit | grep -q .
        grep -Fq 'MANIC_NATIVE1' "$UPSTREAM/src/emu/ios/app/controls/manic/EKAManicControlsView.m"
        grep -Fq 'NOJAVA_FULL1' "$UPSTREAM/src/emu/ios/app/library/EKAUnifiedLibraryViewController.mm"
        test -f "$APP/EKAManicControls/dpad.png"
        test -f "$APP/assets/resources/defaultbank.sf2"
        echo 'MENUUI22 NOJAVA FULL1 MANIC1 cache restore: PASS'

        APP_BYTES=$(du -sk "$APP" | awk '{print $1 * 1024}')
        {
          echo 'MENUUI22 NOJAVA FULL1 MANIC1 BUILD AUDIT'
          echo 'menuui22_authority=PRESERVED'
          echo 'src_emu_j2me=REMOVED'
          echo 'libj2me_target=REMOVED'
          echo 'ios_java_tree=REMOVED'
          echo 'layout7=MANIC_NATIVE'
          echo 'cache_hit=true'
          echo "app_bundle_bytes=$APP_BYTES"
        } > "$GITHUB_WORKSPACE/MENUUI22-NOJAVA-FULL1-MANIC1-BUILD-AUDIT.txt"

    - name: Save NOJAVA FULL1 MANIC1 cache
      if: steps.full_cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: upstream
        key: eka2l1-menuui22-nojava-full1-manic1-macos15-v1

    - name: Package NOJAVA FULL1 MANIC1 unsigned IPA
      run: |
        set -euo pipefail
        LOG="$GITHUB_WORKSPACE/eka2l1-nojava-full1-manic1-build.log"
        touch "$LOG"
        exec > >(tee -a "$LOG") 2>&1

        APP="$GITHUB_WORKSPACE/upstream/build-ios-device/src/emu/ios/eka2l1.app"
        BIN="$APP/eka2l1"
        IPA="$GITHUB_WORKSPACE/upstream/EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI22-NOJAVA-FULL1-MANIC1-unsigned.ipa"
        STAGE="$RUNNER_TEMP/ipa-stage-menuui22-nojava-full1-manic1"
        IPA_LIST="$RUNNER_TEMP/menuui22-nojava-full1-manic1.ipa-list.txt"

        test -d "$APP"
        test -x "$BIN"
        rm -rf "$STAGE" "$IPA"
        mkdir -p "$STAGE/Payload"
        cp -R "$APP" "$STAGE/Payload/EKA2L1.app"
        rm -rf "$STAGE/Payload/EKA2L1.app/_CodeSignature"
        rm -f "$STAGE/Payload/EKA2L1.app/embedded.mobileprovision"
        (cd "$STAGE" && /usr/bin/zip -qry "$IPA" Payload)
        /usr/bin/unzip -t "$IPA" >/dev/null
        /usr/bin/unzip -l "$IPA" > "$IPA_LIST"
        grep -Fq 'Payload/EKA2L1.app/eka2l1' "$IPA_LIST"
        grep -Fq 'EKAManicControls/dpad.png' "$IPA_LIST"
        grep -Fq 'assets/resources/defaultbank.sf2' "$IPA_LIST"
        ! grep -Ei '\.jar([[:space:]]|$)' "$IPA_LIST"
        ! grep -Fi 'GeneralUser GS SoftSynth' "$IPA_LIST"
        test -s "$IPA"
        shasum -a 256 "$IPA" | tee "$GITHUB_WORKSPACE/MENUUI22-NOJAVA-FULL1-MANIC1-IPA-SHA256.txt"
        du -h "$IPA" | tee "$GITHUB_WORKSPACE/MENUUI22-NOJAVA-FULL1-MANIC1-IPA-SIZE.txt"
        echo 'MENUUI22 NOJAVA FULL1 MANIC1 unsigned IPA package: PASS'

    - name: Upload NOJAVA FULL1 MANIC1 IPA
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI22-NOJAVA-FULL1-MANIC1-IPA
        path: upstream/EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI22-NOJAVA-FULL1-MANIC1-unsigned.ipa
        if-no-files-found: error
        retention-days: 14

    - name: Upload NOJAVA FULL1 MANIC1 audit
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI22-NOJAVA-FULL1-MANIC1-AUDIT
        path: |
          MENUUI22-NOJAVA-FULL1-MANIC1-BUILD-AUDIT.txt
          MENUUI22-NOJAVA-FULL1-MANIC1-IPA-SHA256.txt
          MENUUI22-NOJAVA-FULL1-MANIC1-IPA-SIZE.txt
        if-no-files-found: error
        retention-days: 14

    - name: Upload diagnostic log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI22-NOJAVA-FULL1-MANIC1-diagnostic-log
        path: eka2l1-nojava-full1-manic1-build.log
        if-no-files-found: warn
        retention-days: 14
