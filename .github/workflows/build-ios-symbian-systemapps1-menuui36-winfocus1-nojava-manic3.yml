name: Build EKA2L1 SYMBIAN SYSTEMAPPS1 MENUUI36 WINFOCUS1 NOJAVA MANIC3 IPA

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-app:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
    - name: Checkout project
      uses: actions/checkout@v4

    - name: Restore MENUUI36 cache
      id: menuui36_cache
      uses: actions/cache/restore@v4
      with:
        path: upstream
        key: eka2l1-menuui36-winfocus1-nojava-manic3-macos15-v1

    - name: Restore MENUUI35 baseline
      id: menuui35_cache
      if: steps.menuui36_cache.outputs.cache-hit != 'true'
      uses: actions/cache/restore@v4
      with:
        path: upstream
        key: eka2l1-menuui35-simulateevent-async1-nojava-manic3-macos15-v1

    - name: Apply MENUUI36 WindowGroup focus fix and rebuild
      if: steps.menuui36_cache.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail
        LOG="$GITHUB_WORKSPACE/eka2l1-menuui36-winfocus1.log"
        : > "$LOG"
        exec > >(tee -a "$LOG") 2>&1

        test "${{ steps.menuui35_cache.outputs.cache-hit }}" = "true"

        UPSTREAM="$GITHUB_WORKSPACE/upstream"
        PATCHER="$GITHUB_WORKSPACE/apply_menuui36_winfocus1.py"
        CMAKE_BIN="$UPSTREAM/.tools/cmake-3.31.6-macos-universal/CMake.app/Contents/bin/cmake"
        WGH="$UPSTREAM/src/emu/services/include/services/window/classes/wingroup.h"
        WGC="$UPSTREAM/src/emu/services/src/window/classes/wingroup.cpp"
        IO="$UPSTREAM/src/emu/services/src/window/io.cpp"
        WIN="$UPSTREAM/src/emu/services/src/window/window.cpp"
        ANIM="$UPSTREAM/src/emu/services/src/window/classes/plugins/animdll.cpp"

        python3 -m py_compile "$PATCHER"
        python3 "$PATCHER" "$UPSTREAM"

        grep -Fq 'bool receives_focus_{ false }' "$WGH"
        grep -Fq 'bool auto_foreground_{ true }' "$WGH"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI36 WG_FOCUS:' "$WGC"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI36 AUTO_FOREGROUND:' "$WGC"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI36 KEY_FOCUS_REPAIR:' "$IO"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI36 KEY_FOCUS_TARGET:' "$IO"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI35 SIMULATE_EVENT:' "$ANIM"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI31 PENINPUT_RAW:' "$WIN"
        grep -R -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI30 STOCK_FEP:' "$UPSTREAM/src/emu/ios"
        test ! -e "$UPSTREAM/src/emu/j2me"

        git -C "$UPSTREAM" diff --check
        "$CMAKE_BIN" --build "$UPSTREAM/build-ios-device" --target eka2l1 --parallel 4

        APP="$UPSTREAM/build-ios-device/src/emu/ios/eka2l1.app"
        BIN="$APP/eka2l1"
        test -x "$BIN"
        STRINGS_OUT="$RUNNER_TEMP/menuui36.strings"
        strings "$BIN" > "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI36 WG_FOCUS:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI36 AUTO_FOREGROUND:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI36 KEY_FOCUS_TARGET:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI35 SIMULATE_EVENT:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI33 KEYSOUND13:' "$STRINGS_OUT"
        ! grep -Eiq 'phoneME|JAVA-STABLE1|MMAPI-DIAG2|GM-SYNTH1 renderer=gm-sf2' "$STRINGS_OUT"

        {
          echo 'MENUUI36 WINFOCUS1 NOJAVA MANIC3 BUILD AUDIT'
          echo 'base_cache=MENUUI35_SIMULATEEVENT_ASYNC1_NOJAVA_MANIC3'
          echo 'windowgroup_receive_focus=DEDICATED_STATE'
          echo 'autoforeground_opcode_0x26=IMPLEMENTED'
          echo 'key_shipper_nonfocusable_target=REPAIRED_OR_DROPPED'
          echo 'hardcoded_process_uid_group_scancode=NONE'
          echo 'MENUUI35_ASYNC_SIMULATE=PRESERVED'
          echo 'MENUUI33_KEYSOUND=PRESERVED'
          echo 'MENUUI31_RAW=PRESERVED'
          echo 'MENUUI30_STOCKFEP=PRESERVED'
          echo 'java_j2me=REMOVED'
        } > "$GITHUB_WORKSPACE/MENUUI36-WINFOCUS1-BUILD-AUDIT.txt"
        git -C "$UPSTREAM" diff > "$GITHUB_WORKSPACE/MENUUI36-WINFOCUS1-source.diff"

    - name: Verify restored MENUUI36 cache
      if: steps.menuui36_cache.outputs.cache-hit == 'true'
      run: |
        set -euo pipefail
        UPSTREAM="$GITHUB_WORKSPACE/upstream"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI36 WG_FOCUS:' "$UPSTREAM/src/emu/services/src/window/classes/wingroup.cpp"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI36 KEY_FOCUS_TARGET:' "$UPSTREAM/src/emu/services/src/window/io.cpp"
        test -x "$UPSTREAM/build-ios-device/src/emu/ios/eka2l1.app/eka2l1"
        test ! -e "$UPSTREAM/src/emu/j2me"
        echo 'MENUUI36 WINFOCUS1 cache_hit=true' > "$GITHUB_WORKSPACE/MENUUI36-WINFOCUS1-BUILD-AUDIT.txt"
        : > "$GITHUB_WORKSPACE/MENUUI36-WINFOCUS1-source.diff"

    - name: Save MENUUI36 cache
      if: steps.menuui36_cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: upstream
        key: eka2l1-menuui36-winfocus1-nojava-manic3-macos15-v1

    - name: Package MENUUI36 unsigned IPA
      run: |
        set -euo pipefail
        APP="$GITHUB_WORKSPACE/upstream/build-ios-device/src/emu/ios/eka2l1.app"
        IPA="$GITHUB_WORKSPACE/upstream/EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI36-WINFOCUS1-NOJAVA-MANIC3-unsigned.ipa"
        STAGE="$RUNNER_TEMP/ipa-stage-menuui36"
        rm -rf "$STAGE" "$IPA"
        mkdir -p "$STAGE/Payload"
        cp -R "$APP" "$STAGE/Payload/EKA2L1.app"
        rm -rf "$STAGE/Payload/EKA2L1.app/_CodeSignature"
        rm -f "$STAGE/Payload/EKA2L1.app/embedded.mobileprovision"
        (cd "$STAGE" && /usr/bin/zip -qry "$IPA" Payload)
        /usr/bin/unzip -t "$IPA" >/dev/null
        /usr/bin/unzip -l "$IPA" > "$RUNNER_TEMP/menuui36-ipa-list.txt"
        grep -Fq 'Payload/EKA2L1.app/eka2l1' "$RUNNER_TEMP/menuui36-ipa-list.txt"
        ! grep -Ei '\.jar([[:space:]]|$)' "$RUNNER_TEMP/menuui36-ipa-list.txt"
        shasum -a 256 "$IPA" | tee "$GITHUB_WORKSPACE/MENUUI36-WINFOCUS1-IPA-SHA256.txt"

    - name: Upload MENUUI36 IPA
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI36-WINFOCUS1-NOJAVA-MANIC3-IPA
        path: upstream/EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI36-WINFOCUS1-NOJAVA-MANIC3-unsigned.ipa
        retention-days: 14

    - name: Upload MENUUI36 audit
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI36-WINFOCUS1-NOJAVA-MANIC3-AUDIT
        path: |
          MENUUI36-WINFOCUS1-BUILD-AUDIT.txt
          MENUUI36-WINFOCUS1-source.diff
          MENUUI36-WINFOCUS1-IPA-SHA256.txt
        retention-days: 14

    - name: Upload diagnostic log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI36-WINFOCUS1-diagnostic-log
        path: eka2l1-menuui36-winfocus1.log
        if-no-files-found: warn
        retention-days: 14
