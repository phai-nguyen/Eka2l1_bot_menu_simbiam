name: Inspect MANIC NATIVE1 for MANICSKIN1

"on":
  push:
    branches:
      - main
    paths:
      - .github/INSPECT_MANIC_NATIVE1_TRIGGER

permissions:
  contents: read

jobs:
  inspect:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - id: cache
      uses: actions/cache/restore@v4
      with:
        path: upstream
        key: eka2l1-menuui22-nojava-full1-manic1-macos15-v1
    - name: Inspect native Manic/UI/settings
      run: |
        set -euo pipefail
        test "${{ steps.cache.outputs.cache-hit }}" = "true"
        echo '===== MANIC H ====='
        cat upstream/src/emu/ios/app/controls/manic/EKAManicControlsView.h
        echo '===== MANIC M ====='
        cat upstream/src/emu/ios/app/controls/manic/EKAManicControlsView.m
        echo '===== SETTINGS STORE H ====='
        cat upstream/src/emu/ios/app/GameSettingsStore.h
        echo '===== SETTINGS STORE MM ====='
        cat upstream/src/emu/ios/app/GameSettingsStore.mm
        echo '===== SETTINGS VC REFS ====='
        grep -nE -C 8 'layout|Layout|controls|Controls|Manic|UISegmented|UIPicker|UITableView|UIDocumentPicker' upstream/src/emu/ios/app/GameSettingsViewController.mm || true
        echo '===== ROOT MANIC REFS ====='
        grep -nE -C 10 'manic|Manic|applyControls|keyLayout' upstream/src/emu/ios/app/RootViewController.mm || true
        echo '===== IOS CMAKE MANIC TAIL ====='
        grep -nE -C 8 'MANIC_NATIVE1|EKAManicControls|target_sources|copy_directory' upstream/src/emu/ios/CMakeLists.txt || true
