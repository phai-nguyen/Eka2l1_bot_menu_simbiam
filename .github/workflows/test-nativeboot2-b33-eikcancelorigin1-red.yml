name: RED B33 EIKCANCELORIGIN1 Contract

"on":
  push:
    branches:
      - nativeboot2-current
    paths:
      - test_nativeboot2_b33_eikcancelorigin1.py
      - .github/workflows/test-nativeboot2-b33-eikcancelorigin1-red.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  red:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Restore stable B28 bootstrap
        id: b28
        uses: actions/cache/restore@v4
        with:
          path: upstream
          key: eka2l1-fastbuild1-bootstrap-b28-nojava-manic3-macos15-v1

      - name: Reconstruct B32 baseline
        run: |
          set -euo pipefail
          test "${{ steps.b28.outputs.cache-hit }}" = "true"
          python3 ci/fastbuild1_manifest.py validate "$GITHUB_WORKSPACE"
          python3 ci/fastbuild1_manifest.py apply "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/upstream"
          python3 test_nativeboot2_b32_eiksrvfaultdiag1.py "$GITHUB_WORKSPACE/upstream"

      - name: Verify B33 contract is RED on B32
        run: |
          set -euo pipefail
          python3 test_nativeboot2_b33_eikcancelorigin1.py "$GITHUB_WORKSPACE/upstream"
