name: FASTBUILD1 Native TDD

"on":
  push:
    branches:
      - nativeboot2-fastbuild1-design
      - nativeboot2-current
    paths:
      - test_fastbuild1_manifest.py
      - test_fastbuild1_workflows.py
      - ci/**
      - .github/workflows/build-ios-nativeboot2-current-fast.yml
      - .github/workflows/seed-ios-nativeboot2-fastbuild1-bootstrap.yml
      - .github/workflows/test-fastbuild1-native.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run FASTBUILD1 final acceptance suite
        run: |
          set -euo pipefail
          python3 -m unittest -v test_fastbuild1_manifest.py test_fastbuild1_workflows.py
          python3 ci/fastbuild1_manifest.py validate .
          git diff --check
          test "$(git hash-object .github/workflows/build-ios-nativeboot2-b28-wservlibtype1-nojava-manic3.yml)" =             "44d1c8aaa7ff5f0ff97271396b8bf771ad125b54"
