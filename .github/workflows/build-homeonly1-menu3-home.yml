name: Build HOMEONLY1 Menu3 Home IPA

"on":
  push:
    branches:
      - codex/m3home-homeonly1-build
    paths:
      - ".github/workflows/build-homeonly1-menu3-home.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
    - name: Checkout cache host
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Restore HOMEONLY1 baseline
      id: homecache
      uses: actions/cache/restore@v4
      with:
        path: upstream
        key: eka2l1-homeonly1-menuui14-fix2-macos15-v1

    - name: Restore clean MENUUI14 FIX2 baseline
      id: cleancache
      if: steps.homecache.outputs.cache-hit != 'true'
      uses: actions/cache/restore@v4
      with:
        path: upstream
        key: eka2l1-menuui14-fix2-clean-macos15-v1

    - name: Replay clean pre-NativeBoot MENUUI14 FIX2 baseline
      if: steps.homecache.outputs.cache-hit != 'true' && steps.cleancache.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail
        SOURCE_COMMIT="df0ff57277f433c394720857b5391559024dc661"
        SOURCE_WORKFLOW=".github/workflows/build-ios-symbian-systemapps1-menuui14-inputdispatch1-fix2.yml"
        SOURCE_YML="$RUNNER_TEMP/homeonly-menuui14-fix2.yml"
        SCRIPT="$RUNNER_TEMP/homeonly-replay-menuui14-fix2.sh"

        git cat-file -e "$SOURCE_COMMIT^{commit}"
        git show "$SOURCE_COMMIT:$SOURCE_WORKFLOW" > "$SOURCE_YML"
        test -s "$SOURCE_YML"

        python3 - "$SOURCE_YML" "$SCRIPT" <<'PY_EXTRACT'
        import sys
        from pathlib import Path

        source = Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()
        output = Path(sys.argv[2])
        wanted = "Replay MENUUI14 workflow with FIX2 patcher"

        run_index = None
        for i, line in enumerate(source):
            if line.startswith("    - name:") and line.split("    - name:", 1)[1].strip() == wanted:
                j = i + 1
                while j < len(source) and not source[j].startswith("    - name:"):
                    if source[j].startswith("      run: |"):
                        run_index = j
                        break
                    j += 1
                break
        if run_index is None:
            raise SystemExit("HOMEONLY1: frozen MENUUI14 FIX2 replay step not found")

        body = []
        k = run_index + 1
        while k < len(source) and not source[k].startswith("    - name:"):
            row = source[k]
            if row.startswith("        "):
                body.append(row[8:])
            elif row.strip() == "":
                body.append("")
            else:
                break
            k += 1

        output.write_text("#!/usr/bin/env bash\n" + "\n".join(body) + "\n", encoding="utf-8")
        print("HOMEONLY1: extracted frozen MENUUI14 FIX2 replay step")
        PY_EXTRACT

        chmod +x "$SCRIPT"
        bash "$SCRIPT"

        UPSTREAM="$GITHUB_WORKSPACE/upstream"
        BIN="$UPSTREAM/build-ios-device/src/emu/ios/eka2l1.app/eka2l1"
        test -x "$BIN"
        strings "$BIN" > "$RUNNER_TEMP/homeonly-menuui14.strings"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI14 INPUT_GET:' "$RUNNER_TEMP/homeonly-menuui14.strings"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI13 FS_DIRUID1:' "$RUNNER_TEMP/homeonly-menuui14.strings"

    - name: Save clean MENUUI14 FIX2 baseline cache
      if: steps.homecache.outputs.cache-hit != 'true' && steps.cleancache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: upstream
        key: eka2l1-menuui14-fix2-clean-macos15-v1

    - name: Fetch HOMEONLY1 source
      if: steps.homecache.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail
        SRC="$GITHUB_WORKSPACE/homeonly-src"
        git clone --depth 1 --branch codex/menu3-homeonly1           https://github.com/phai-nguyen/Eka2l1-nhanh-menuu3.git "$SRC"
        git -C "$SRC" rev-parse HEAD | tee "$GITHUB_WORKSPACE/HOMEONLY1-SOURCE-HEAD.txt"

    - name: Apply HOMEONLY1 slim patchset
      if: steps.homecache.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail
        SRC="$GITHUB_WORKSPACE/homeonly-src"
        UPSTREAM="$GITHUB_WORKSPACE/upstream"

        python3 -m py_compile           "$SRC/apply_m3home1_homebridge.py"           "$SRC/apply_homeonly1_cenreptx1.py"           "$SRC/apply_homeonly1_cenrepdeleterange1.py"           "$SRC/apply_homeonly1_cenrepgetstringdiag1.py"           "$SRC/test_homeonly1_contract.py"

        python3 "$SRC/apply_m3home1_homebridge.py" "$UPSTREAM"
        python3 "$SRC/apply_homeonly1_cenreptx1.py" "$UPSTREAM"
        python3 "$SRC/apply_homeonly1_cenrepdeleterange1.py" "$UPSTREAM"
        python3 "$SRC/apply_homeonly1_cenrepgetstringdiag1.py" "$UPSTREAM"
        python3 "$SRC/test_homeonly1_contract.py" "$UPSTREAM"

        git -C "$UPSTREAM" diff --check
        git -C "$UPSTREAM" diff > "$GITHUB_WORKSPACE/HOMEONLY1-source.diff"

        ROOT="$UPSTREAM/src/emu/ios/app/RootViewController.mm"
        BRIDGE="$UPSTREAM/src/emu/ios/src/emu_bridge.mm"
        CEN="$UPSTREAM/src/emu/services/src/centralrepo/centralrepo.cpp"
        REPO="$UPSTREAM/src/emu/services/src/centralrepo/repo.cpp"

        grep -Fq '[M3HOME1][TRIGGER]' "$ROOT"
        grep -Fq '[M3HOME1][APPARC_REQUEST]' "$BRIDGE"
        grep -Fq 'HOMEONLY1::CenRepTransactionCommit' "$CEN"
        grep -Fq 'HOMEONLY1::CenRepDeleteRange' "$CEN"
        grep -Fq '[HOMEONLY1][CEN_TX_COMMIT]' "$REPO"
        grep -Fq '[HOMEONLY1][CEN_DELETE_RANGE]' "$REPO"
        grep -Fq '[HOMEONLY1][CEN_GET_STRING] phase=pre_write' "$REPO"

        ! grep -Fq 'CompatBoot' "$ROOT"
        ! grep -Fq 'NATIVEBOOT' "$ROOT"
        ! grep -Fq 'DIRECTHOME' "$ROOT"

        {
          echo 'HOMEONLY1 BUILD AUDIT'
          echo 'baseline=MENUUI14_FIX2_PRE_NATIVEBOOT'
          echo 'route=MENU3_TO_REAL_HOME'
          echo 'nativeboot_frontend=REMOVED'
          echo 'compatboot_menu_probe=REMOVED'
          echo 'phoneui_startup_probe=REMOVED'
          echo 'directhome=REMOVED'
          echo 'cenrep_transaction=HOMEONLY_GENERIC'
          echo 'cenrep_delete_range=HOMEONLY_GENERIC'
          echo 'cenrep_getstring_diag=OBSERVE_ONLY'
          echo 'firmware=UNCHANGED'
        } > "$GITHUB_WORKSPACE/HOMEONLY1-BUILD-AUDIT.txt"

    - name: Build HOMEONLY1 iOS app
      if: steps.homecache.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail
        UPSTREAM="$GITHUB_WORKSPACE/upstream"
        CMAKE_BIN="$UPSTREAM/.tools/cmake-3.31.6-macos-universal/CMake.app/Contents/bin/cmake"
        if [ -x "$CMAKE_BIN" ]; then
          "$CMAKE_BIN" --build "$UPSTREAM/build-ios-device" --target eka2l1 --parallel 4
        else
          cmake --build "$UPSTREAM/build-ios-device" --target eka2l1 --parallel 4
        fi

        APP="$UPSTREAM/build-ios-device/src/emu/ios/eka2l1.app"
        BIN="$APP/eka2l1"
        test -x "$BIN"
        strings "$BIN" > "$RUNNER_TEMP/homeonly1.strings"

        grep -Fq '[M3HOME1][APPARC_REQUEST]' "$RUNNER_TEMP/homeonly1.strings"
        grep -Fq '[HOMEONLY1][CEN_TX_COMMIT]' "$RUNNER_TEMP/homeonly1.strings"
        grep -Fq '[HOMEONLY1][CEN_DELETE_RANGE]' "$RUNNER_TEMP/homeonly1.strings"
        grep -Fq '[HOMEONLY1][CEN_GET_STRING] phase=pre_write' "$RUNNER_TEMP/homeonly1.strings"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI14 INPUT_GET:' "$RUNNER_TEMP/homeonly1.strings"

        if grep -Fq '[NBOOT2]' "$RUNNER_TEMP/homeonly1.strings"; then
          echo 'HOMEONLY1 gate failed: NBOOT2 marker remains in binary'
          exit 1
        fi
        if grep -Fq 'CompatBoot' "$RUNNER_TEMP/homeonly1.strings"; then
          echo 'HOMEONLY1 gate failed: CompatBoot remains in binary'
          exit 1
        fi
        if grep -Fq 'PHONEUITARGET' "$RUNNER_TEMP/homeonly1.strings"; then
          echo 'HOMEONLY1 gate failed: PhoneUI probe remains in binary'
          exit 1
        fi

    - name: Save HOMEONLY1 baseline cache
      if: steps.homecache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: upstream
        key: eka2l1-homeonly1-menuui14-fix2-macos15-v1

    - name: Validate restored HOMEONLY1 cache
      if: steps.homecache.outputs.cache-hit == 'true'
      run: |
        set -euo pipefail
        BIN="$GITHUB_WORKSPACE/upstream/build-ios-device/src/emu/ios/eka2l1.app/eka2l1"
        test -x "$BIN"
        strings "$BIN" > "$RUNNER_TEMP/homeonly1-restored.strings"
        grep -Fq '[M3HOME1][APPARC_REQUEST]' "$RUNNER_TEMP/homeonly1-restored.strings"
        grep -Fq '[HOMEONLY1][CEN_DELETE_RANGE]' "$RUNNER_TEMP/homeonly1-restored.strings"
        grep -Fq '[HOMEONLY1][CEN_GET_STRING] phase=pre_write' "$RUNNER_TEMP/homeonly1-restored.strings"
        ! grep -Fq '[NBOOT2]' "$RUNNER_TEMP/homeonly1-restored.strings"
        ! grep -Fq 'CompatBoot' "$RUNNER_TEMP/homeonly1-restored.strings"

    - name: Package HOMEONLY1 unsigned IPA
      run: |
        set -euo pipefail
        APP="$GITHUB_WORKSPACE/upstream/build-ios-device/src/emu/ios/eka2l1.app"
        IPA="$GITHUB_WORKSPACE/upstream/EKA2L1-HOMEONLY1-M3HOME3-unsigned.ipa"
        STAGE="$RUNNER_TEMP/ipa-stage-homeonly1"
        rm -rf "$STAGE" "$IPA"
        mkdir -p "$STAGE/Payload"
        cp -R "$APP" "$STAGE/Payload/EKA2L1.app"
        rm -rf "$STAGE/Payload/EKA2L1.app/_CodeSignature"
        rm -f "$STAGE/Payload/EKA2L1.app/embedded.mobileprovision"
        (cd "$STAGE" && /usr/bin/zip -qry "$IPA" Payload)
        /usr/bin/unzip -t "$IPA" >/dev/null
        shasum -a 256 "$IPA" | tee "$GITHUB_WORKSPACE/HOMEONLY1-IPA-SHA256.txt"

    - name: Upload HOMEONLY1 IPA
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-HOMEONLY1-M3HOME3-IPA
        path: upstream/EKA2L1-HOMEONLY1-M3HOME3-unsigned.ipa
        retention-days: 14

    - name: Upload HOMEONLY1 audit
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-HOMEONLY1-M3HOME3-AUDIT
        path: |
          HOMEONLY1-SOURCE-HEAD.txt
          HOMEONLY1-BUILD-AUDIT.txt
          HOMEONLY1-source.diff
          HOMEONLY1-IPA-SHA256.txt
        if-no-files-found: warn
        retention-days: 14
