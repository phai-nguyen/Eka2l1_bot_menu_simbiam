name: Build EKA2L1 NATIVEBOOT2 B19 SALANGABI1 NOJAVA MANIC3 IPA

"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - apply_nativeboot2_b19_salangabi1.py
      - test_nativeboot2_b19_salangabi1.py
      - .github/workflows/build-ios-nativeboot2-b19-salangabi1-nojava-manic3.yml

permissions:
  contents: read

jobs:
  build-app:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
    - name: Checkout project
      uses: actions/checkout@v4

    - name: Restore B19 cache
      id: b19_cache
      uses: actions/cache/restore@v4
      with:
        path: upstream
        key: eka2l1-nativeboot2-b19-salangabi1-nojava-manic3-macos15-v1

    - name: Restore B18 baseline
      id: b18_cache
      if: steps.b19_cache.outputs.cache-hit != 'true'
      uses: actions/cache/restore@v4
      with:
        path: upstream
        key: eka2l1-nativeboot2-b18-sartc1-nojava-manic3-macos15-v1

    - name: Apply B19 exact-opcode diagnostic probe and rebuild
      if: steps.b19_cache.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail
        LOG="$GITHUB_WORKSPACE/eka2l1-nativeboot2-b19-salangabi1.log"
        : > "$LOG"
        exec > >(tee -a "$LOG") 2>&1

        test "${{ steps.b18_cache.outputs.cache-hit }}" = "true"

        UPSTREAM="$GITHUB_WORKSPACE/upstream"
        PATCHER="$GITHUB_WORKSPACE/apply_nativeboot2_b19_salangabi1.py"
        TESTER="$GITHUB_WORKSPACE/test_nativeboot2_b19_salangabi1.py"
        CMAKE_BIN="$UPSTREAM/.tools/cmake-3.31.6-macos-universal/CMake.app/Contents/bin/cmake"
        SA="$UPSTREAM/src/emu/services/src/sms/sa/sa.cpp"
        SAH="$UPSTREAM/src/emu/services/include/services/sms/sa/sa.h"
        SVC="$UPSTREAM/src/emu/kernel/src/svc.cpp"
        FS="$UPSTREAM/src/emu/services/src/fs/fs.cpp"
        LOADER="$UPSTREAM/src/emu/services/src/loader/loader.cpp"
        HAL="$UPSTREAM/src/emu/system/src/hal.cpp"
        ROOT="$UPSTREAM/src/emu/ios/app/RootViewController.mm"
        STATE="$UPSTREAM/src/emu/ios/src/state.cpp"

        python3 -m py_compile "$PATCHER" "$TESTER"
        python3 "$PATCHER" "$UPSTREAM"

        # GREEN: the same B19 contract that failed against B18 must pass now.
        python3 "$TESTER" "$UPSTREAM"

        grep -Fq '[NBOOT2][SA_LANG_ABI]' "$SA"
        grep -Fq 'raw_func=0x{:X}' "$SA"
        grep -Fq 'logical_func=0x{:X}' "$SA"
        grep -Fq 'transport_bits=0x{:X}' "$SA"
        grep -Fq 'completion=KErrNotSupported' "$SA"
        grep -Fq 'REGISTER_IPC(sa_server, unk_op1, 0x01100068, "NBOOT2::SaLangAbiProbe");' "$SA"

        grep -Fq '[NBOOT2][SA_RTC_VALID]' "$SA"
        grep -Fq '[NBOOT2][SA_RESPONSE_RTC]' "$SA"
        grep -Fq 'REGISTER_IPC(sa_server, unk_op1, 107, "NBOOT2::SaValidateRTCTime");' "$SA"
        grep -Fq '[NBOOT2][SA_HIDDEN_RESET]' "$SA"
        grep -Fq '[NBOOT2][SA_RESPONSE_HIDDEN]' "$SA"
        grep -Fq '[NBOOT2][SA_STARTUP_MODE]' "$SA"
        grep -Fq '[NBOOT2][SA_RESPONSE_MODE]' "$SA"
        grep -Fq '[NBOOT2][SA_OP1_PENDING]' "$SA"
        grep -Fq 'pending_sa_event_.pending();' "$SA"
        grep -Fq 'pending_sa_event_' "$SAH"
        grep -Fq '[NBOOT2][SA_RESPONSE]' "$SA"

        grep -Fq '[NBOOT2][DM_INIT_SET_INT]' "$SVC"
        grep -Fq 'BRIDGE_REGISTER(0xB1, creator_security_info)' "$SVC"
        grep -Fq '[NBOOT2][RM356_FS_FORMAT_OPEN]' "$FS"
        grep -Fq '[NBOOT2][RM356_LOADER_FSY]' "$LOADER"
        grep -Fq '[NBOOT2][RM356_STARTUP_REASON]' "$HAL"
        grep -Fq '[NBOOT2][ESTART_RUN]' "$STATE"
        grep -Fq 'NATIVEBOOT2 EMUHUB1' "$ROOT"
        test ! -e "$UPSTREAM/src/emu/j2me"

        git -C "$UPSTREAM" diff --check
        "$CMAKE_BIN" --build "$UPSTREAM/build-ios-device" --target eka2l1 --parallel 4

        APP="$UPSTREAM/build-ios-device/src/emu/ios/eka2l1.app"
        BIN="$APP/eka2l1"
        test -x "$BIN"

        STRINGS_OUT="$RUNNER_TEMP/nativeboot2-b19-salangabi1.strings"
        strings "$BIN" > "$STRINGS_OUT"
        grep -Fq '[NBOOT2][SA_LANG_ABI]' "$STRINGS_OUT"
        grep -Fq 'NBOOT2::SaLangAbiProbe' "$STRINGS_OUT"
        grep -Fq 'completion=KErrNotSupported' "$STRINGS_OUT"
        grep -Fq '[NBOOT2][SA_RTC_VALID]' "$STRINGS_OUT"
        grep -Fq '[NBOOT2][SA_HIDDEN_RESET]' "$STRINGS_OUT"
        grep -Fq '[NBOOT2][SA_STARTUP_MODE]' "$STRINGS_OUT"
        grep -Fq '[NBOOT2][SA_OP1_PENDING]' "$STRINGS_OUT"
        grep -Fq '[NBOOT2][SA_RESPONSE]' "$STRINGS_OUT"
        grep -Fq '[NBOOT2][DM_INIT_SET_INT]' "$STRINGS_OUT"
        grep -Fq 'NATIVEBOOT2 EMUHUB1' "$STRINGS_OUT"
        ! grep -Eiq 'phoneME|JAVA-STABLE1|MMAPI-DIAG2|GM-SYNTH1 renderer=gm-sf2' "$STRINGS_OUT"

        {
          echo 'NATIVEBOOT2 B19 SALANGABI1 BUILD AUDIT'
          echo 'base_cache=NATIVEBOOT2_B18_SARTC1'
          echo 'raw_saserver_function=0x01100068'
          echo 'logical_low16=0x0068'
          echo 'logical_candidate=EGetSIMLanguages'
          echo 'transport_bits=0x01100000_UNRESOLVED'
          echo 'behavior=DIAGNOSTIC_ONLY'
          echo 'logs=raw_func_logical_func_transport_bits_ipc_flag_raw_args_types_sizes_max_descriptor_previews'
          echo 'descriptor_writes=NONE'
          echo 'descriptor_resize=NONE'
          echo 'synthetic_language_response=NONE'
          echo 'completion=KErrNotSupported'
          echo 'unknown_sa_commands=NOT_BLANKET_ACKED'
          echo 'b18_sartc1=PRESERVED'
          echo 'b17_sahiddenreset1=PRESERVED'
          echo 'b16_samode1=PRESERVED'
          echo 'b15_saasync1=PRESERVED'
          echo 'b14_saresponse1=PRESERVED'
          echo 'b11_dminit1=PRESERVED'
          echo 'boot_owner=firmware_SYSSTART'
          echo 'host_sysstart=DISABLED'
          echo 'host_menu=DISABLED'
          echo 'frontend=EMUHUB1_PRESERVED'
          echo 'NOJAVA=PRESERVED'
          echo 'MANIC3=PRESERVED'
          echo 'TDD_RED_RUN=35521191800'
        } > "$GITHUB_WORKSPACE/NATIVEBOOT2-B19-SALANGABI1-BUILD-AUDIT.txt"

        git -C "$UPSTREAM" diff > "$GITHUB_WORKSPACE/NATIVEBOOT2-B19-SALANGABI1-source.diff"

    - name: Verify restored B19 cache
      if: steps.b19_cache.outputs.cache-hit == 'true'
      run: |
        set -euo pipefail
        UPSTREAM="$GITHUB_WORKSPACE/upstream"
        python3 test_nativeboot2_b19_salangabi1.py "$UPSTREAM"
        grep -Fq '[NBOOT2][SA_RTC_VALID]' "$UPSTREAM/src/emu/services/src/sms/sa/sa.cpp"
        grep -Fq '[NBOOT2][SA_HIDDEN_RESET]' "$UPSTREAM/src/emu/services/src/sms/sa/sa.cpp"
        grep -Fq '[NBOOT2][SA_STARTUP_MODE]' "$UPSTREAM/src/emu/services/src/sms/sa/sa.cpp"
        grep -Fq '[NBOOT2][SA_OP1_PENDING]' "$UPSTREAM/src/emu/services/src/sms/sa/sa.cpp"
        grep -Fq '[NBOOT2][DM_INIT_SET_INT]' "$UPSTREAM/src/emu/kernel/src/svc.cpp"
        test -x "$UPSTREAM/build-ios-device/src/emu/ios/eka2l1.app/eka2l1"
        test ! -e "$UPSTREAM/src/emu/j2me"
        echo 'NATIVEBOOT2 B19 SALANGABI1 cache_hit=true' > "$GITHUB_WORKSPACE/NATIVEBOOT2-B19-SALANGABI1-BUILD-AUDIT.txt"
        : > "$GITHUB_WORKSPACE/NATIVEBOOT2-B19-SALANGABI1-source.diff"

    - name: Save B19 cache
      if: steps.b19_cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: upstream
        key: eka2l1-nativeboot2-b19-salangabi1-nojava-manic3-macos15-v1

    - name: Package unsigned IPA
      run: |
        set -euo pipefail
        APP="$GITHUB_WORKSPACE/upstream/build-ios-device/src/emu/ios/eka2l1.app"
        IPA="$GITHUB_WORKSPACE/upstream/EKA2L1-NATIVEBOOT2-B19-SALANGABI1-NOJAVA-MANIC3-unsigned.ipa"
        STAGE="$RUNNER_TEMP/ipa-stage-nativeboot2-b19"
        rm -rf "$STAGE" "$IPA"
        mkdir -p "$STAGE/Payload"
        cp -R "$APP" "$STAGE/Payload/EKA2L1.app"
        rm -rf "$STAGE/Payload/EKA2L1.app/_CodeSignature"
        rm -f "$STAGE/Payload/EKA2L1.app/embedded.mobileprovision"
        (cd "$STAGE" && /usr/bin/zip -qry "$IPA" Payload)
        /usr/bin/unzip -t "$IPA" >/dev/null
        /usr/bin/unzip -l "$IPA" > "$RUNNER_TEMP/nativeboot2-b19-ipa-list.txt"
        grep -Fq 'Payload/EKA2L1.app/eka2l1' "$RUNNER_TEMP/nativeboot2-b19-ipa-list.txt"
        ! grep -Ei '\\.jar([[:space:]]|$)' "$RUNNER_TEMP/nativeboot2-b19-ipa-list.txt"
        shasum -a 256 "$IPA" | tee "$GITHUB_WORKSPACE/NATIVEBOOT2-B19-SALANGABI1-IPA-SHA256.txt"

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-NATIVEBOOT2-B19-SALANGABI1-NOJAVA-MANIC3-IPA
        path: upstream/EKA2L1-NATIVEBOOT2-B19-SALANGABI1-NOJAVA-MANIC3-unsigned.ipa
        retention-days: 14

    - name: Upload audit
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-NATIVEBOOT2-B19-SALANGABI1-NOJAVA-MANIC3-AUDIT
        path: |
          NATIVEBOOT2-B19-SALANGABI1-BUILD-AUDIT.txt
          NATIVEBOOT2-B19-SALANGABI1-source.diff
          NATIVEBOOT2-B19-SALANGABI1-IPA-SHA256.txt
        retention-days: 14

    - name: Upload diagnostic log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-NATIVEBOOT2-B19-SALANGABI1-diagnostic-log
        path: eka2l1-nativeboot2-b19-salangabi1.log
        if-no-files-found: warn
        retention-days: 14
