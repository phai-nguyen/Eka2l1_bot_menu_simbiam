name: Build EKA2L1 SYMBIAN SYSTEMAPPS1 MENUUI28 PENINPUTANIM1 NOJAVA MANIC3 IPA

"on":
  workflow_dispatch:
  push:
    paths:
      - ".github/menuui28-peninputanim1-trigger2.txt"

permissions:
  contents: read

jobs:
  build-app:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
    - name: Checkout project
      uses: actions/checkout@v4

    - name: Restore MENUUI28 PENINPUTANIM1 cache
      id: menuui28_cache
      uses: actions/cache/restore@v4
      with:
        path: upstream
        key: eka2l1-menuui28-peninputanim1-nojava-manic3-macos15-v1

    - name: Restore MENUUI27 TEXTCURSOR1 baseline
      id: menuui27_cache
      if: steps.menuui28_cache.outputs.cache-hit != 'true'
      uses: actions/cache/restore@v4
      with:
        path: upstream
        key: eka2l1-menuui27-textcursor1-nojava-manic3-macos15-v1

    - name: Apply MENUUI28 PenInput animation bridge and rebuild
      if: steps.menuui28_cache.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail
        LOG="$GITHUB_WORKSPACE/eka2l1-menuui28-peninputanim1.log"
        : > "$LOG"
        exec > >(tee -a "$LOG") 2>&1

        test "${{ steps.menuui27_cache.outputs.cache-hit }}" = "true"

        UPSTREAM="$GITHUB_WORKSPACE/upstream"
        PATCHER="$GITHUB_WORKSPACE/apply_menuui28_peninputanim1.py"
        CMAKE_BIN="$UPSTREAM/.tools/cmake-3.31.6-macos-universal/CMake.app/Contents/bin/cmake"
        ANIM_H="$UPSTREAM/src/emu/services/include/services/window/classes/plugins/animdll.h"
        ANIM_CPP="$UPSTREAM/src/emu/services/src/window/classes/plugins/animdll.cpp"
        WIN_H="$UPSTREAM/src/emu/services/include/services/window/window.h"
        WIN_CPP="$UPSTREAM/src/emu/services/src/window/window.cpp"
        WG_CPP="$UPSTREAM/src/emu/services/src/window/classes/wingroup.cpp"
        FS_CPP="$UPSTREAM/src/emu/services/src/fs/fs.cpp"
        APPLIST="$UPSTREAM/src/emu/services/src/applist/applist.cpp"
        OOM="$UPSTREAM/src/emu/services/src/ui/cap/oom_app.cpp"
        KERNEL="$UPSTREAM/src/emu/kernel/src/kernel.cpp"
        SVC="$UPSTREAM/src/emu/kernel/src/svc.cpp"
        ROOT="$UPSTREAM/src/emu/ios/app/RootViewController.mm"

        test -x "$CMAKE_BIN"
        python3 -m py_compile "$PATCHER"
        python3 "$PATCHER" "$UPSTREAM"

        grep -Fq 'case ws_anim_dll_op_create_instance_sprite:' "$ANIM_CPP"
        grep -Fq 'case ws_anim_dll_op_command:' "$ANIM_CPP"
        grep -Fq 'PENINPUT_OP_FINISH_CONSTRUCTION = 501' "$ANIM_CPP"
        grep -Fq 'PENINPUT_OP_ACTIVATE = 502' "$ANIM_CPP"
        grep -Fq 'PENINPUT_OP_DEACTIVATE = 503' "$ANIM_CPP"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI28 PENINPUT_ANIM:' "$ANIM_CPP"
        grep -Fq 'peninput_anim_present_' "$WIN_H"
        grep -Fq 'peninput_anim_active_' "$WIN_H"
        grep -Fq 'mirror_peninput_raw_event' "$WIN_CPP"
        grep -Fq '"raweventbufqueue"' "$WIN_CPP"
        grep -Fq 'TRawEventBuffer ABI mismatch' "$WIN_CPP"
        grep -Fq 'mirror_peninput_raw_event(guest_event);' "$WIN_CPP"

        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI27 TEXT_CURSOR:' "$WG_CPP"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI26 FS_RESERVE:' "$FS_CPP"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI25 SERVICE_IMPL:' "$APPLIST"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI24 AKN_ZORDER:' "$OOM"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI23 APPTYPE:' "$APPLIST"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI22 SCHEDRUN_SVC:' "$KERNEL"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI22 SYNC_COMPLETE:' "$SVC"
        grep -Fq 'MANIC_MODALFIX1' "$ROOT"

        test ! -e "$UPSTREAM/src/emu/j2me"
        ! find "$UPSTREAM/build-ios-device" -type f -name 'libj2me.a' -print -quit | grep -q .

        git -C "$UPSTREAM" diff --check
        "$CMAKE_BIN" --build "$UPSTREAM/build-ios-device" --target eka2l1 --parallel 4

        APP="$UPSTREAM/build-ios-device/src/emu/ios/eka2l1.app"
        BIN="$APP/eka2l1"
        test -x "$BIN"
        test -f "$APP/EKAManicControls/dpad.png"

        STRINGS_OUT="$RUNNER_TEMP/menuui28-peninputanim1.strings"
        strings "$BIN" > "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI28 PENINPUT_ANIM:' "$STRINGS_OUT"
        grep -Fq 'raweventbufqueue' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI27 TEXT_CURSOR:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI26 FS_RESERVE:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI25 SERVICE_IMPL:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI24 AKN_ZORDER:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI23 APPTYPE:' "$STRINGS_OUT"
        grep -Fq 'Manic Skin' "$STRINGS_OUT"
        ! grep -Eiq 'phoneME|JAVA-STABLE1|MMAPI-DIAG2|GM-SYNTH1 renderer=gm-sf2' "$STRINGS_OUT"

        {
          echo 'MENUUI28 PENINPUTANIM1 NOJAVA MANIC3 BUILD AUDIT'
          echo 'base_cache=MENUUI27_TEXTCURSOR1_NOJAVA_MANIC3'
          echo 'device_evidence=PenInputServer_started_but_peninputanim_CreateInstanceSprite_unimplemented'
          echo 'animdll_0x5=CreateInstanceSprite_IMPLEMENTED_FOR_PENINPUT'
          echo 'animdll_command=ROUTED_TO_EXECUTOR'
          echo 'peninput_501=FinishConstruction_ROUTED'
          echo 'peninput_502=Activate_ROUTED'
          echo 'peninput_503=Deactivate_ROUTED'
          echo 'raw_touch_mirror=raweventbufqueue_NON_SWALLOWING'
          echo 'raw_event_size=32'
          echo 'raw_buffer_size=196'
          echo 'sprite_append_member=UNCHANGED'
          echo 'CNTSRV=UNCHANGED'
          echo 'MsvServer=UNCHANGED'
          echo 'scheduler=UNCHANGED'
          echo 'java_j2me=REMOVED'
        } > "$GITHUB_WORKSPACE/MENUUI28-PENINPUTANIM1-BUILD-AUDIT.txt"

        git -C "$UPSTREAM" diff > "$GITHUB_WORKSPACE/MENUUI28-PENINPUTANIM1-source.diff"

    - name: Verify restored MENUUI28 PENINPUTANIM1 cache
      if: steps.menuui28_cache.outputs.cache-hit == 'true'
      run: |
        set -euo pipefail
        UPSTREAM="$GITHUB_WORKSPACE/upstream"
        ANIM_CPP="$UPSTREAM/src/emu/services/src/window/classes/plugins/animdll.cpp"
        WIN_CPP="$UPSTREAM/src/emu/services/src/window/window.cpp"
        APP="$UPSTREAM/build-ios-device/src/emu/ios/eka2l1.app"
        test -x "$APP/eka2l1"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI28 PENINPUT_ANIM:' "$ANIM_CPP"
        grep -Fq 'mirror_peninput_raw_event' "$WIN_CPP"
        test ! -e "$UPSTREAM/src/emu/j2me"
        {
          echo 'MENUUI28 PENINPUTANIM1 NOJAVA MANIC3 BUILD AUDIT'
          echo 'cache_hit=true'
          echo 'peninput_anim_bridge=IMPLEMENTED'
          echo 'java_j2me=REMOVED'
        } > "$GITHUB_WORKSPACE/MENUUI28-PENINPUTANIM1-BUILD-AUDIT.txt"
        : > "$GITHUB_WORKSPACE/MENUUI28-PENINPUTANIM1-source.diff"

    - name: Save MENUUI28 PENINPUTANIM1 cache
      if: steps.menuui28_cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: upstream
        key: eka2l1-menuui28-peninputanim1-nojava-manic3-macos15-v1

    - name: Package MENUUI28 PENINPUTANIM1 unsigned IPA
      run: |
        set -euo pipefail
        APP="$GITHUB_WORKSPACE/upstream/build-ios-device/src/emu/ios/eka2l1.app"
        IPA="$GITHUB_WORKSPACE/upstream/EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI28-PENINPUTANIM1-NOJAVA-MANIC3-unsigned.ipa"
        STAGE="$RUNNER_TEMP/ipa-stage-menuui28-peninputanim1"
        IPA_LIST="$RUNNER_TEMP/menuui28-peninputanim1-ipa-list.txt"

        rm -rf "$STAGE" "$IPA"
        mkdir -p "$STAGE/Payload"
        cp -R "$APP" "$STAGE/Payload/EKA2L1.app"
        rm -rf "$STAGE/Payload/EKA2L1.app/_CodeSignature"
        rm -f "$STAGE/Payload/EKA2L1.app/embedded.mobileprovision"
        (cd "$STAGE" && /usr/bin/zip -qry "$IPA" Payload)

        /usr/bin/unzip -t "$IPA" >/dev/null
        /usr/bin/unzip -l "$IPA" > "$IPA_LIST"
        grep -Fq 'Payload/EKA2L1.app/eka2l1' "$IPA_LIST"
        grep -Fq 'EKAManicControls/dpad.png' "$IPA_LIST"
        ! grep -Ei '\\.jar([[:space:]]|$)' "$IPA_LIST"

        shasum -a 256 "$IPA" | tee "$GITHUB_WORKSPACE/MENUUI28-PENINPUTANIM1-IPA-SHA256.txt"
        du -h "$IPA" | tee "$GITHUB_WORKSPACE/MENUUI28-PENINPUTANIM1-IPA-SIZE.txt"

    - name: Upload MENUUI28 PENINPUTANIM1 IPA
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI28-PENINPUTANIM1-NOJAVA-MANIC3-IPA
        path: upstream/EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI28-PENINPUTANIM1-NOJAVA-MANIC3-unsigned.ipa
        if-no-files-found: error
        retention-days: 14

    - name: Upload MENUUI28 PENINPUTANIM1 audit
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI28-PENINPUTANIM1-NOJAVA-MANIC3-AUDIT
        path: |
          MENUUI28-PENINPUTANIM1-BUILD-AUDIT.txt
          MENUUI28-PENINPUTANIM1-source.diff
          MENUUI28-PENINPUTANIM1-IPA-SHA256.txt
          MENUUI28-PENINPUTANIM1-IPA-SIZE.txt
        if-no-files-found: error
        retention-days: 14

    - name: Upload diagnostic log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI28-PENINPUTANIM1-diagnostic-log
        path: eka2l1-menuui28-peninputanim1.log
        if-no-files-found: warn
        retention-days: 14
