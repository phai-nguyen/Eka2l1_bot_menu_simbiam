name: Build EKA2L1 NATIVEBOOT2 B6 RM356 BSP1 NOJAVA MANIC3 IPA

"on":
  workflow_dispatch:
  push:
    paths:
      - '.nativeboot2-b6-rm356-bsp1-trigger-2'

permissions:
  contents: read

jobs:
  build-app:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
    - name: Checkout project
      uses: actions/checkout@v4

    - name: Restore B6 cache
      id: b6_cache
      uses: actions/cache/restore@v4
      with:
        path: upstream
        key: eka2l1-nativeboot2-b6-rm356-bsp1-nojava-manic3-macos15-v1

    - name: Restore B5 baseline
      id: b5_cache
      if: steps.b6_cache.outputs.cache-hit != 'true'
      uses: actions/cache/restore@v4
      with:
        path: upstream
        key: eka2l1-nativeboot2-b5-mediahal1-nojava-manic3-macos15-v1

    - name: Apply B6 RM356 BSP1 and rebuild
      if: steps.b6_cache.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail
        LOG="$GITHUB_WORKSPACE/eka2l1-nativeboot2-b6-rm356-bsp1.log"
        : > "$LOG"
        exec > >(tee -a "$LOG") 2>&1

        test "${{ steps.b5_cache.outputs.cache-hit }}" = "true"

        UPSTREAM="$GITHUB_WORKSPACE/upstream"
        PATCHER="$GITHUB_WORKSPACE/apply_nativeboot2_b6_rm356_bsp1.py"
        CMAKE_BIN="$UPSTREAM/.tools/cmake-3.31.6-macos-universal/CMake.app/Contents/bin/cmake"
        HALCPP="$UPSTREAM/src/emu/system/src/hal.cpp"
        FSH="$UPSTREAM/src/emu/services/include/services/fs/fs.h"
        FSCPP="$UPSTREAM/src/emu/services/src/fs/fs.cpp"
        SVC="$UPSTREAM/src/emu/kernel/src/svc.cpp"
        ROOT="$UPSTREAM/src/emu/ios/app/RootViewController.mm"
        STATE="$UPSTREAM/src/emu/ios/src/state.cpp"

        python3 -m py_compile "$PATCHER"
        python3 "$PATCHER" "$UPSTREAM"

        grep -Fq '[NBOOT2][RM356_STARTUP_REASON]' "$HALCPP"
        grep -Fq '[NBOOT2][MEDIA_DRIVE_INFO]' "$HALCPP"
        grep -Fq 'rm356_local_drive_mapping_' "$FSH"
        grep -Fq '[NBOOT2][RM356_FS_BOOT_ACK]' "$FSCPP"
        grep -Fq '[NBOOT2][RM356_FS_MAPPING]' "$FSCPP"
        grep -Fq '[NBOOT2][RM356_FS_STARTUP_COMPLETE]' "$FSCPP"
        grep -Fq '[NBOOT2][RM356_FS_UNKNOWN]' "$FSCPP"
        grep -Fq 'NATIVEBOOT2-B2 NOKIAISC1 EP94_CHANNEL_ABI' "$SVC"
        grep -Fq '[NBOOT2][ESTART_RUN]' "$STATE"
        grep -Fq 'NATIVEBOOT2 EMUHUB1' "$ROOT"
        test ! -e "$UPSTREAM/src/emu/j2me"

        git -C "$UPSTREAM" diff --check
        "$CMAKE_BIN" --build "$UPSTREAM/build-ios-device" --target eka2l1 --parallel 4

        APP="$UPSTREAM/build-ios-device/src/emu/ios/eka2l1.app"
        BIN="$APP/eka2l1"
        test -x "$BIN"
        STRINGS_OUT="$RUNNER_TEMP/nativeboot2-b6-rm356-bsp1.strings"
        strings "$BIN" > "$STRINGS_OUT"

        grep -Fq '[NBOOT2][RM356_STARTUP_REASON]' "$STRINGS_OUT"
        grep -Fq '[NBOOT2][RM356_FS_BOOT_ACK]' "$STRINGS_OUT"
        grep -Fq '[NBOOT2][RM356_FS_MAPPING]' "$STRINGS_OUT"
        grep -Fq '[NBOOT2][RM356_FS_STARTUP_COMPLETE]' "$STRINGS_OUT"
        grep -Fq '[NBOOT2][RM356_FS_UNKNOWN]' "$STRINGS_OUT"
        grep -Fq '[NBOOT2][MEDIA_DRIVE_INFO]' "$STRINGS_OUT"
        grep -Fq 'NATIVEBOOT2 EMUHUB1' "$STRINGS_OUT"
        ! grep -Eiq 'phoneME|JAVA-STABLE1|MMAPI-DIAG2|GM-SYNTH1 renderer=gm-sf2' "$STRINGS_OUT"

        {
          echo 'NATIVEBOOT2 B6 RM356 BSP1 BUILD AUDIT'
          echo 'base_cache=NATIVEBOOT2_B5_MEDIAHAL1'
          echo 'startup_reason=EStartupCold'
          echo 'filesystem_startup_mounts=HOST_VFS_ACK'
          echo 'set_local_drive_mapping=PARSE_STORE_68B'
          echo 'startup_init_complete=ASYNC_COMPLETE_KErrNone'
          echo 'finalise_drive=VIRTUAL_MEDIA_ACK'
          echo 'set_system_drive=PROPERTY_AND_DEFAULT_PATH'
          echo 'unknown_native_fs=TRACE_KErrNotSupported'
          echo 'rm356_drive_mask=0x00000E45'
          echo 'mediahal1=PRESERVED'
          echo 'customldd1=PRESERVED'
          echo 'nokiaisc2=PRESERVED'
          echo 'frontend=EMUHUB1_PRESERVED'
          echo 'MENUUI36=PRESERVED'
          echo 'NOJAVA=PRESERVED'
          echo 'MANIC3=PRESERVED'
        } > "$GITHUB_WORKSPACE/NATIVEBOOT2-B6-RM356-BSP1-BUILD-AUDIT.txt"
        git -C "$UPSTREAM" diff > "$GITHUB_WORKSPACE/NATIVEBOOT2-B6-RM356-BSP1-source.diff"

    - name: Verify restored B6 cache
      if: steps.b6_cache.outputs.cache-hit == 'true'
      run: |
        set -euo pipefail
        UPSTREAM="$GITHUB_WORKSPACE/upstream"
        grep -Fq '[NBOOT2][RM356_STARTUP_REASON]' "$UPSTREAM/src/emu/system/src/hal.cpp"
        grep -Fq '[NBOOT2][RM356_FS_MAPPING]' "$UPSTREAM/src/emu/services/src/fs/fs.cpp"
        test -x "$UPSTREAM/build-ios-device/src/emu/ios/eka2l1.app/eka2l1"
        test ! -e "$UPSTREAM/src/emu/j2me"
        echo 'NATIVEBOOT2 B6 RM356 BSP1 cache_hit=true' > "$GITHUB_WORKSPACE/NATIVEBOOT2-B6-RM356-BSP1-BUILD-AUDIT.txt"
        : > "$GITHUB_WORKSPACE/NATIVEBOOT2-B6-RM356-BSP1-source.diff"

    - name: Save B6 cache
      if: steps.b6_cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: upstream
        key: eka2l1-nativeboot2-b6-rm356-bsp1-nojava-manic3-macos15-v1

    - name: Package unsigned IPA
      run: |
        set -euo pipefail
        APP="$GITHUB_WORKSPACE/upstream/build-ios-device/src/emu/ios/eka2l1.app"
        IPA="$GITHUB_WORKSPACE/upstream/EKA2L1-NATIVEBOOT2-B6-RM356-BSP1-NOJAVA-MANIC3-unsigned.ipa"
        STAGE="$RUNNER_TEMP/ipa-stage-nativeboot2-b6"
        rm -rf "$STAGE" "$IPA"
        mkdir -p "$STAGE/Payload"
        cp -R "$APP" "$STAGE/Payload/EKA2L1.app"
        rm -rf "$STAGE/Payload/EKA2L1.app/_CodeSignature"
        rm -f "$STAGE/Payload/EKA2L1.app/embedded.mobileprovision"
        (cd "$STAGE" && /usr/bin/zip -qry "$IPA" Payload)
        /usr/bin/unzip -t "$IPA" >/dev/null
        /usr/bin/unzip -l "$IPA" > "$RUNNER_TEMP/nativeboot2-b6-ipa-list.txt"
        grep -Fq 'Payload/EKA2L1.app/eka2l1' "$RUNNER_TEMP/nativeboot2-b6-ipa-list.txt"
        ! grep -Ei '\\.jar([[:space:]]|$)' "$RUNNER_TEMP/nativeboot2-b6-ipa-list.txt"
        shasum -a 256 "$IPA" | tee "$GITHUB_WORKSPACE/NATIVEBOOT2-B6-RM356-BSP1-IPA-SHA256.txt"

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-NATIVEBOOT2-B6-RM356-BSP1-NOJAVA-MANIC3-IPA
        path: upstream/EKA2L1-NATIVEBOOT2-B6-RM356-BSP1-NOJAVA-MANIC3-unsigned.ipa
        retention-days: 14

    - name: Upload audit
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-NATIVEBOOT2-B6-RM356-BSP1-NOJAVA-MANIC3-AUDIT
        path: |
          NATIVEBOOT2-B6-RM356-BSP1-BUILD-AUDIT.txt
          NATIVEBOOT2-B6-RM356-BSP1-source.diff
          NATIVEBOOT2-B6-RM356-BSP1-IPA-SHA256.txt
        retention-days: 14

    - name: Upload diagnostic log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-NATIVEBOOT2-B6-RM356-BSP1-diagnostic-log
        path: eka2l1-nativeboot2-b6-rm356-bsp1.log
        if-no-files-found: warn
        retention-days: 14
