name: Inspect B29 loader baseline once

"on":
  push:
    branches:
      - nativeboot2-current
    paths:
      - ".github/workflows/inspect-b29-loader-baseline-once.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Restore stable B28 bootstrap
        uses: actions/cache/restore@v4
        with:
          path: upstream
          key: eka2l1-fastbuild1-bootstrap-b28-nojava-manic3-macos15-v1
      - name: Print loader baseline
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for rel, needles in [
              ("src/emu/kernel/src/libmanager.cpp", [
                  "codeseg_ptr lib_manager::load(",
                  "auto load_depend_on_drive",
                  "A Symbian absolute path can be rooted",
              ]),
              ("src/emu/services/src/loader/loader.cpp", [
                  "void loader_server::load_library",
                  "Try loading",
              ]),
          ]:
              p=Path("upstream")/rel
              s=p.read_text()
              print(f"===== {rel} =====")
              for needle in needles:
                  i=s.find(needle)
                  print(f"--- needle={needle!r} pos={i} ---")
                  if i >= 0:
                      print(s[max(0,i-1200):i+7000])
          PY
