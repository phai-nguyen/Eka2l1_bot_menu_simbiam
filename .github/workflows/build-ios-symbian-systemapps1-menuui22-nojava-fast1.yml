name: Build EKA2L1 SYMBIAN SYSTEMAPPS1 MENUUI22 NOJAVA FAST1 IPA

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-app:
    runs-on: macos-15
    timeout-minutes: 120

    steps:
    - name: Checkout project history
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Restore MENUUI22 NOJAVA FAST1 build cache
      id: nojava_cache
      uses: actions/cache/restore@v4
      with:
        path: upstream
        key: eka2l1-menuui22-nojava-fast1-macos15-bbe898f1921ce192-v1

    - name: Seed proven MENUUI22 and remove Java runtime
      if: steps.nojava_cache.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail
        LOG="$GITHUB_WORKSPACE/eka2l1-nojava-fast1-build.log"
        : > "$LOG"
        exec > >(tee -a "$LOG") 2>&1

        SOURCE_WORKFLOW="$GITHUB_WORKSPACE/.github/workflows/build-ios-symbian-systemapps1-menuui22-waitowner1.yml"
        EXTRACT_DIR="$RUNNER_TEMP/menuui22-nojava-fast1-seed"
        test -s "$SOURCE_WORKFLOW"
        rm -rf "$EXTRACT_DIR"
        mkdir -p "$EXTRACT_DIR"

        # Reuse the two proven MENUUI22 build run-blocks exactly once to create the
        # native source/build baseline. Future runs restore the resulting no-Java
        # tree from cache and do not replay the historical Java chain.
        python3 - "$SOURCE_WORKFLOW" "$EXTRACT_DIR" <<'PY_EXTRACT'
        import sys
        from pathlib import Path

        source = Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()
        out = Path(sys.argv[2])
        wanted = [
            "Replay frozen MENUUI21 authority build chain",
            "Apply MENUUI22 WAITOWNER1 diagnostic traces and rebuild",
        ]
        found = {}
        i = 0
        while i < len(source):
            if not source[i].startswith("    - name:"):
                i += 1
                continue
            name = source[i].split("    - name:", 1)[1].strip()
            j = i + 1
            run_index = None
            while j < len(source) and not source[j].startswith("    - name:"):
                if source[j].startswith("      run: |"):
                    run_index = j
                    break
                j += 1
            if name in wanted:
                if run_index is None:
                    raise SystemExit(f"NOJAVA_FAST1: missing run block: {name}")
                k = run_index + 1
                body = []
                while k < len(source) and not source[k].startswith("    - name:"):
                    row = source[k]
                    if row.startswith("        "):
                        body.append(row[8:])
                    elif row.strip() == "":
                        body.append("")
                    else:
                        break
                    k += 1
                found[name] = "\n".join(body) + "\n"
            i = max(j, i + 1)

        missing = [name for name in wanted if name not in found]
        if missing:
            raise SystemExit("NOJAVA_FAST1: missing MENUUI22 seed steps: " + ", ".join(missing))

        for idx, name in enumerate(wanted, 1):
            script = out / f"step{idx}.sh"
            script.write_text("#!/usr/bin/env bash\n" + found[name], encoding="utf-8")
            print(f"NOJAVA_FAST1: extracted seed step {idx}: {name}")
        PY_EXTRACT

        for n in 1 2; do
          SCRIPT="$EXTRACT_DIR/step${n}.sh"
          chmod +x "$SCRIPT"
          (cd "$GITHUB_WORKSPACE" && bash "$SCRIPT")
        done

        UPSTREAM="$GITHUB_WORKSPACE/upstream"
        PATCHER="$GITHUB_WORKSPACE/apply_nojava_fast1.py"
        test -s "$PATCHER"
        python3 -m py_compile "$PATCHER"
        python3 "$PATCHER" "$UPSTREAM"

        # CMake/Ninja sees the changed source list and relinks EKA2L1 without the
        # phoneME/J2ME objects. Existing native MENUUI22 objects remain incremental.
        cmake --build "$UPSTREAM/build-ios-device" --parallel 4

        APP="$UPSTREAM/build-ios-device/src/emu/ios/eka2l1.app"
        BIN="$APP/eka2l1"
        SVC="$UPSTREAM/src/emu/kernel/src/svc.cpp"
        CMAKE_FILE="$UPSTREAM/src/emu/ios/CMakeLists.txt"
        ROOT="$UPSTREAM/src/emu/ios/app/RootViewController.mm"
        UNIFIED="$UPSTREAM/src/emu/ios/app/j2me/EKAUnifiedLibraryViewController.mm"
        test -x "$BIN"

        # Remove stale resources left in the existing bundle by the prior Java build.
        find "$APP" -type f \( \
          -name '*.jar' -o \
          -name '*.sf2' -o \
          -name 'GeneralUser-GS-SoftSynth-1.44-PROVENANCE.txt' -o \
          -name 'GeneralUser-GS-LICENSE.txt' -o \
          -name 'TinySoundFont-LICENSE.txt' \
        \) -delete

        grep -Fq 'NOJAVA_FAST1' "$CMAKE_FILE"
        grep -Fq 'NOJAVA_FAST1' "$ROOT"
        grep -Fq 'NOJAVA_FAST1' "$UNIFIED"
        ! grep -Fq 'PHONEME_R1_LIB' "$CMAKE_FILE"
        ! grep -Fq 'J2MEBridge.mm' "$CMAKE_FILE"
        ! grep -Fq 'PhoneMEMediaBridge' "$CMAKE_FILE"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI22 WAIT_OWNER:' "$SVC"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI22 WAIT_FRAME:' "$SVC"
        git -C "$UPSTREAM" diff --check

        STRINGS_OUT="$RUNNER_TEMP/menuui22-nojava-fast1.strings"
        strings "$BIN" > "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI22 WAIT_OWNER:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI22 WAIT_FRAME:' "$STRINGS_OUT"
        ! grep -Fq 'JAVA-STABLE1 runtime native-editor=1 fixed-midp=1' "$STRINGS_OUT"
        ! grep -Fq 'MMAPI-DIAG2' "$STRINGS_OUT"
        ! grep -Fq 'GM-SYNTH1 renderer=gm-sf2' "$STRINGS_OUT"

        if find "$APP" -type f \( -name '*.jar' -o -name '*.sf2' \) -print -quit | grep -q .; then
          echo 'ERROR: Java/J2ME runtime resource survived in app bundle:' >&2
          find "$APP" -type f \( -name '*.jar' -o -name '*.sf2' \) -print >&2
          exit 1
        fi

        {
          echo 'MENUUI22 NOJAVA FAST1 BUILD AUDIT'
          echo 'menuui22_authority=PRESERVED'
          echo 'java_j2me_runtime=REMOVED_FROM_ACTIVE_TARGET'
          echo 'phoneme_core=REMOVED_FROM_ACTIVE_TARGET'
          echo 'jar_import_route=DISABLED'
          echo 'j2me_library_section=REMOVED'
          echo 'soundfont_java_resource=REMOVED'
          echo 'symbian_systemapps=PRESERVED'
          echo 'ngage=PRESERVED'
          echo 'shared_unified_controller=RETAINED_FOR_NATIVE_UI'
          echo 'cache_role=FROZEN_NOJAVA_MENUUI22_BASE_FOR_NEXT_MENUUI_BUILD'
        } > "$GITHUB_WORKSPACE/MENUUI22-NOJAVA-FAST1-BUILD-AUDIT.txt"

        echo 'MENUUI22 NOJAVA FAST1 seed + relink: PASS'

    - name: Verify restored MENUUI22 NOJAVA FAST1 cache
      if: steps.nojava_cache.outputs.cache-hit == 'true'
      run: |
        set -euo pipefail
        LOG="$GITHUB_WORKSPACE/eka2l1-nojava-fast1-build.log"
        : > "$LOG"
        exec > >(tee -a "$LOG") 2>&1
        UPSTREAM="$GITHUB_WORKSPACE/upstream"
        APP="$UPSTREAM/build-ios-device/src/emu/ios/eka2l1.app"
        BIN="$APP/eka2l1"
        CMAKE_FILE="$UPSTREAM/src/emu/ios/CMakeLists.txt"
        SVC="$UPSTREAM/src/emu/kernel/src/svc.cpp"
        test -x "$BIN"
        grep -Fq 'NOJAVA_FAST1' "$CMAKE_FILE"
        ! grep -Fq 'PHONEME_R1_LIB' "$CMAKE_FILE"
        ! grep -Fq 'J2MEBridge.mm' "$CMAKE_FILE"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI22 WAIT_OWNER:' "$SVC"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI22 WAIT_FRAME:' "$SVC"
        echo 'MENUUI22 NOJAVA FAST1 cache restore: PASS'

        {
          echo 'MENUUI22 NOJAVA FAST1 BUILD AUDIT'
          echo 'menuui22_authority=PRESERVED'
          echo 'java_j2me_runtime=REMOVED_FROM_ACTIVE_TARGET'
          echo 'symbian_systemapps=PRESERVED'
          echo 'ngage=PRESERVED'
          echo 'cache_hit=true'
        } > "$GITHUB_WORKSPACE/MENUUI22-NOJAVA-FAST1-BUILD-AUDIT.txt"

    - name: Save MENUUI22 NOJAVA FAST1 build cache
      if: steps.nojava_cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: upstream
        key: eka2l1-menuui22-nojava-fast1-macos15-bbe898f1921ce192-v1

    - name: Package MENUUI22 NOJAVA FAST1 unsigned IPA
      run: |
        set -euo pipefail
        LOG="$GITHUB_WORKSPACE/eka2l1-nojava-fast1-build.log"
        touch "$LOG"
        exec > >(tee -a "$LOG") 2>&1

        APP="$GITHUB_WORKSPACE/upstream/build-ios-device/src/emu/ios/eka2l1.app"
        BIN="$APP/eka2l1"
        IPA="$GITHUB_WORKSPACE/upstream/EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI22-NOJAVA-FAST1-unsigned.ipa"
        STAGE="$RUNNER_TEMP/ipa-stage-menuui22-nojava-fast1"
        IPA_LIST="$RUNNER_TEMP/menuui22-nojava-fast1.ipa-list.txt"

        test -d "$APP"
        test -x "$BIN"
        rm -rf "$STAGE" "$IPA"
        mkdir -p "$STAGE/Payload"
        cp -R "$APP" "$STAGE/Payload/EKA2L1.app"
        rm -rf "$STAGE/Payload/EKA2L1.app/_CodeSignature"
        rm -f "$STAGE/Payload/EKA2L1.app/embedded.mobileprovision"
        (cd "$STAGE" && /usr/bin/zip -qry "$IPA" Payload)
        /usr/bin/unzip -t "$IPA" >/dev/null
        /usr/bin/unzip -l "$IPA" > "$IPA_LIST"
        grep -Fq 'Payload/EKA2L1.app/eka2l1' "$IPA_LIST"
        ! grep -Ei '\.(jar|sf2)([[:space:]]|$)' "$IPA_LIST"
        test -s "$IPA"
        shasum -a 256 "$IPA" | tee "$GITHUB_WORKSPACE/MENUUI22-NOJAVA-FAST1-IPA-SHA256.txt"
        echo 'MENUUI22 NOJAVA FAST1 unsigned IPA package: PASS'

    - name: Upload MENUUI22 NOJAVA FAST1 IPA
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI22-NOJAVA-FAST1-IPA
        path: upstream/EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI22-NOJAVA-FAST1-unsigned.ipa
        if-no-files-found: error
        retention-days: 14

    - name: Upload MENUUI22 NOJAVA FAST1 audit
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI22-NOJAVA-FAST1-AUDIT
        path: |
          MENUUI22-NOJAVA-FAST1-BUILD-AUDIT.txt
          MENUUI22-NOJAVA-FAST1-IPA-SHA256.txt
        if-no-files-found: error
        retention-days: 14

    - name: Upload diagnostic log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI22-NOJAVA-FAST1-diagnostic-log
        path: eka2l1-nojava-fast1-build.log
        if-no-files-found: warn
        retention-days: 14
