name: Build EKA2L1 SYMBIAN SYSTEMAPPS1 MENUUI23 APPTYPE1 NOJAVA MANIC3 IPA

"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/MENUUI23_APPTYPE1_TRIGGER

permissions:
  contents: read

jobs:
  build-app:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
    - name: Checkout project
      uses: actions/checkout@v4

    - name: Restore MENUUI23 APPTYPE1 cache
      id: apptype_cache
      uses: actions/cache/restore@v4
      with:
        path: upstream
        key: eka2l1-menuui23-apptype1-nojava-manic3-macos15-v1

    - name: Restore proven MENUUI22 SCHEDRUN1 baseline
      id: schedrun_cache
      if: steps.apptype_cache.outputs.cache-hit != 'true'
      uses: actions/cache/restore@v4
      with:
        path: upstream
        key: eka2l1-menuui22-schedrun1-nojava-manic3-macos15-v1

    - name: Apply MENUUI23 AppList GetAppType fix and rebuild
      if: steps.apptype_cache.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail
        LOG="$GITHUB_WORKSPACE/eka2l1-menuui23-apptype1.log"
        : > "$LOG"
        exec > >(tee -a "$LOG") 2>&1

        test "${{ steps.schedrun_cache.outputs.cache-hit }}" = "true"

        UPSTREAM="$GITHUB_WORKSPACE/upstream"
        PATCHER="$GITHUB_WORKSPACE/apply_menuui23_apptype1.py"
        CMAKE_BIN="$UPSTREAM/.tools/cmake-3.31.6-macos-universal/CMake.app/Contents/bin/cmake"
        APPLIST="$UPSTREAM/src/emu/services/src/applist/applist.cpp"
        OP="$UPSTREAM/src/emu/services/include/services/applist/op.h"
        KERNEL="$UPSTREAM/src/emu/kernel/src/kernel.cpp"
        SVC="$UPSTREAM/src/emu/kernel/src/svc.cpp"
        ROOT="$UPSTREAM/src/emu/ios/app/RootViewController.mm"

        test -x "$CMAKE_BIN"
        test -s "$PATCHER"
        python3 -m py_compile "$PATCHER"
        python3 "$PATCHER" "$UPSTREAM"

        # Exact root-cause gates.
        grep -Fq 'case applist_request_get_app_type:' "$APPLIST"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI23 APPTYPE:' "$APPLIST"
        grep -Fq 'const epoc::uid native_type_uid = 0; // KNullUid' "$APPLIST"
        grep -Fq 'ctx->complete(epoc::error_not_found);' "$APPLIST"
        grep -Fq 'ctx->complete(epoc::error_bad_descriptor);' "$APPLIST"
        grep -Fq 'write_data_to_descriptor_argument<epoc::uid>' "$APPLIST"
        grep -Fq 'applist_request_get_app_type,' "$OP"

        # Preserve current diagnostic and iOS UI authority.
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI22 SCHEDRUN_SVC:' "$KERNEL"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI22 SYNC_SEND:' "$SVC"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI22 SYNC_COMPLETE:' "$SVC"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI22 WAIT_OWNER:' "$SVC"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI21 SCHED_SCAN:' "$SVC"
        grep -Fq 'MANIC_MODALFIX1' "$ROOT"
        grep -Fq 'if (i == 7) return @"Manic Skin";' "$ROOT"

        # NOJAVA remains absolute for the iOS host runtime.
        test ! -e "$UPSTREAM/src/emu/j2me"
        ! find "$UPSTREAM/build-ios-device" -type f -name 'libj2me.a' -print -quit | grep -q .
        ! grep -Fq '0xB031C52A' "$APPLIST"
        ! grep -Fq '0x10210E26' "$APPLIST"

        git -C "$UPSTREAM" diff --check

        "$CMAKE_BIN" --build "$UPSTREAM/build-ios-device" --target eka2l1 --parallel 4

        APP="$UPSTREAM/build-ios-device/src/emu/ios/eka2l1.app"
        BIN="$APP/eka2l1"
        test -x "$BIN"
        test -f "$APP/EKAManicControls/dpad.png"

        STRINGS_OUT="$RUNNER_TEMP/menuui23-apptype1.strings"
        strings "$BIN" > "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI23 APPTYPE:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI22 SCHEDRUN_SVC:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI22 SYNC_COMPLETE:' "$STRINGS_OUT"
        grep -Fq 'Manic Skin' "$STRINGS_OUT"
        ! grep -Eiq 'phoneME|JAVA-STABLE1|MMAPI-DIAG2|GM-SYNTH1 renderer=gm-sf2' "$STRINGS_OUT"

        {
          echo 'MENUUI23 APPTYPE1 NOJAVA MANIC3 BUILD AUDIT'
          echo 'base_cache=MENUUI22_SCHEDRUN1_NOJAVA_MANIC3'
          echo 'root_cause=AppListServer_opcode_73_GetAppType_unimplemented'
          echo 'opcode_73=IMPLEMENTED'
          echo 'known_native_app_type=KNullUid'
          echo 'unknown_app=KErrNotFound'
          echo 'bad_output_descriptor=KErrBadDescriptor'
          echo 'java_app_type_mapping=NOT_ADDED'
          echo 'menuui22_schedrun=PRESERVED'
          echo 'menuui22_sync_diagnostics=PRESERVED'
          echo 'manic3_modalfix=PRESERVED'
          echo 'java_j2me=REMOVED'
        } > "$GITHUB_WORKSPACE/MENUUI23-APPTYPE1-BUILD-AUDIT.txt"

        git -C "$UPSTREAM" diff > "$GITHUB_WORKSPACE/MENUUI23-APPTYPE1-source.diff"
        echo 'MENUUI23 APPTYPE1 NOJAVA MANIC3 build: PASS'

    - name: Verify restored MENUUI23 APPTYPE1 cache
      if: steps.apptype_cache.outputs.cache-hit == 'true'
      run: |
        set -euo pipefail
        UPSTREAM="$GITHUB_WORKSPACE/upstream"
        APPLIST="$UPSTREAM/src/emu/services/src/applist/applist.cpp"
        KERNEL="$UPSTREAM/src/emu/kernel/src/kernel.cpp"
        SVC="$UPSTREAM/src/emu/kernel/src/svc.cpp"
        ROOT="$UPSTREAM/src/emu/ios/app/RootViewController.mm"
        APP="$UPSTREAM/build-ios-device/src/emu/ios/eka2l1.app"

        test -x "$APP/eka2l1"
        grep -Fq 'case applist_request_get_app_type:' "$APPLIST"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI23 APPTYPE:' "$APPLIST"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI22 SCHEDRUN_SVC:' "$KERNEL"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI22 SYNC_COMPLETE:' "$SVC"
        grep -Fq 'MANIC_MODALFIX1' "$ROOT"
        test ! -e "$UPSTREAM/src/emu/j2me"

        {
          echo 'MENUUI23 APPTYPE1 NOJAVA MANIC3 BUILD AUDIT'
          echo 'cache_hit=true'
          echo 'opcode_73=IMPLEMENTED'
          echo 'known_native_app_type=KNullUid'
          echo 'java_app_type_mapping=NOT_ADDED'
          echo 'java_j2me=REMOVED'
        } > "$GITHUB_WORKSPACE/MENUUI23-APPTYPE1-BUILD-AUDIT.txt"
        : > "$GITHUB_WORKSPACE/MENUUI23-APPTYPE1-source.diff"
        echo 'MENUUI23 APPTYPE1 cache restore: PASS'

    - name: Save MENUUI23 APPTYPE1 cache
      if: steps.apptype_cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: upstream
        key: eka2l1-menuui23-apptype1-nojava-manic3-macos15-v1

    - name: Package MENUUI23 APPTYPE1 unsigned IPA
      run: |
        set -euo pipefail
        APP="$GITHUB_WORKSPACE/upstream/build-ios-device/src/emu/ios/eka2l1.app"
        IPA="$GITHUB_WORKSPACE/upstream/EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI23-APPTYPE1-NOJAVA-MANIC3-unsigned.ipa"
        STAGE="$RUNNER_TEMP/ipa-stage-menuui23-apptype1"
        IPA_LIST="$RUNNER_TEMP/menuui23-apptype1-ipa-list.txt"

        rm -rf "$STAGE" "$IPA"
        mkdir -p "$STAGE/Payload"
        cp -R "$APP" "$STAGE/Payload/EKA2L1.app"
        rm -rf "$STAGE/Payload/EKA2L1.app/_CodeSignature"
        rm -f "$STAGE/Payload/EKA2L1.app/embedded.mobileprovision"
        (cd "$STAGE" && /usr/bin/zip -qry "$IPA" Payload)

        /usr/bin/unzip -t "$IPA" >/dev/null
        /usr/bin/unzip -l "$IPA" > "$IPA_LIST"
        grep -Fq 'Payload/EKA2L1.app/eka2l1' "$IPA_LIST"
        grep -Fq 'EKAManicControls/dpad.png' "$IPA_LIST"
        ! grep -Ei '\.jar([[:space:]]|$)' "$IPA_LIST"

        shasum -a 256 "$IPA" | tee "$GITHUB_WORKSPACE/MENUUI23-APPTYPE1-IPA-SHA256.txt"
        du -h "$IPA" | tee "$GITHUB_WORKSPACE/MENUUI23-APPTYPE1-IPA-SIZE.txt"
        echo 'MENUUI23 APPTYPE1 unsigned IPA package: PASS'

    - name: Upload MENUUI23 APPTYPE1 IPA
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI23-APPTYPE1-NOJAVA-MANIC3-IPA
        path: upstream/EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI23-APPTYPE1-NOJAVA-MANIC3-unsigned.ipa
        if-no-files-found: error
        retention-days: 14

    - name: Upload MENUUI23 APPTYPE1 audit
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI23-APPTYPE1-NOJAVA-MANIC3-AUDIT
        path: |
          MENUUI23-APPTYPE1-BUILD-AUDIT.txt
          MENUUI23-APPTYPE1-source.diff
          MENUUI23-APPTYPE1-IPA-SHA256.txt
          MENUUI23-APPTYPE1-IPA-SIZE.txt
        if-no-files-found: error
        retention-days: 14

    - name: Upload diagnostic log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI23-APPTYPE1-diagnostic-log
        path: eka2l1-menuui23-apptype1.log
        if-no-files-found: warn
        retention-days: 14
