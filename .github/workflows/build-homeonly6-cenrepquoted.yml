name: Build HOMEONLY6 CenRep Quoted Token Fix

"on":
  push:
    branches:
      - codex/m3home-homeonly2-build
    paths:
      - ".github/workflows/build-homeonly6-cenrepquoted.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
    - name: Checkout build host
      uses: actions/checkout@v4

    - name: Restore HOMEONLY5 cache
      id: home5
      uses: actions/cache/restore@v4
      with:
        path: upstream
        key: eka2l1-homeonly5-user11stack-macos15-v1

    - name: Require HOMEONLY5 baseline
      run: |
        set -euo pipefail
        test "${{ steps.home5.outputs.cache-hit }}" = "true"
        UPSTREAM="$GITHUB_WORKSPACE/upstream"
        BIN="$UPSTREAM/build-ios-device/src/emu/ios/eka2l1.app/eka2l1"
        test -x "$BIN"
        test ! -e "$UPSTREAM/src/emu/j2me"
        strings "$BIN" > "$RUNNER_TEMP/home5.strings"
        grep -Fq '[HOMEONLY5][USER11_CONTEXT]' "$RUNNER_TEMP/home5.strings"
        grep -Fq '[HOMEONLY5][USER11_FRAME]' "$RUNNER_TEMP/home5.strings"
        grep -Fq '[HOMEONLY5][USER11_STACK]' "$RUNNER_TEMP/home5.strings"
        grep -Fq '[HOMEONLY4][EVENT_WAKE]' "$RUNNER_TEMP/home5.strings"
        grep -Fq '[HOMEONLY3][HOME_EXIT_KEEP_MENU3]' "$RUNNER_TEMP/home5.strings"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI36 WG_FOCUS:' "$RUNNER_TEMP/home5.strings"
        grep -Fq '[M3HOME1][APPARC_REQUEST]' "$RUNNER_TEMP/home5.strings"
        ! grep -Fq '[NBOOT2]' "$RUNNER_TEMP/home5.strings"
        ! grep -Fq '[COMPATBOOT]' "$RUNNER_TEMP/home5.strings"

        # HOMEONLY6 must start from the exact old tokenizer behavior that caused
        # quoted CenRep strings to be split at '='.
        grep -Fq 'std::deque<std::string> waits;' "$UPSTREAM/src/emu/common/src/ini.cpp"
        grep -Fq "std::size_t equal_pos = trim1.find('=');" "$UPSTREAM/src/emu/common/src/ini.cpp"
        ! grep -Fq 'HOMEONLY6 CENREPQUOTED1: quoted tokens are literal' "$UPSTREAM/src/emu/common/src/ini.cpp"

    - name: Fetch HOMEONLY6 source
      run: |
        set -euo pipefail
        git clone --depth 1 --branch codex/menu3-homeonly5 \
          https://github.com/phai-nguyen/Eka2l1-nhanh-menuu3.git "$GITHUB_WORKSPACE/home6-src"
        git -C "$GITHUB_WORKSPACE/home6-src" rev-parse HEAD | tee HOMEONLY6-SOURCE-HEAD.txt

    - name: Apply HOMEONLY6 generic quote-aware tokenizer
      run: |
        set -euo pipefail
        SRC="$GITHUB_WORKSPACE/home6-src"
        UPSTREAM="$GITHUB_WORKSPACE/upstream"

        python3 -m py_compile \
          "$SRC/apply_homeonly6_cenrepquoted1.py" \
          "$SRC/test_homeonly6_cenrepquoted1.py"

        python3 "$SRC/apply_homeonly6_cenrepquoted1.py" "$UPSTREAM"
        python3 "$SRC/test_homeonly6_cenrepquoted1.py" "$UPSTREAM"

        INI="$UPSTREAM/src/emu/common/src/ini.cpp"
        grep -Fq 'HOMEONLY6 CENREPQUOTED1: quoted tokens are literal' "$INI"
        grep -Fq 'bool quoted = false;' "$INI"
        grep -Fq 'quoted || (line[counter] !=' "$INI"

        # Scope gates: this is a generic tokenizer fix, never a target-specific bypass.
        ! grep -Fq '0x10275104' "$INI"
        ! grep -Fq '0xA0001000' "$INI"
        ! grep -Fq '0x102750F0' "$INI"
        ! grep -Fq 'localapp:0x101F4CD2' "$INI"

        git -C "$UPSTREAM" diff --check
        git -C "$UPSTREAM" diff > HOMEONLY6-source.diff

    - name: Incremental build HOMEONLY6
      run: |
        set -euo pipefail
        UPSTREAM="$GITHUB_WORKSPACE/upstream"
        CMAKE_BIN="$UPSTREAM/.tools/cmake-3.31.6-macos-universal/CMake.app/Contents/bin/cmake"
        "$CMAKE_BIN" --build "$UPSTREAM/build-ios-device" --target eka2l1 --parallel 4

        BIN="$UPSTREAM/build-ios-device/src/emu/ios/eka2l1.app/eka2l1"
        test -x "$BIN"
        strings "$BIN" > "$RUNNER_TEMP/home6.strings"

        # Preserve the established Home-only route and diagnostics.
        grep -Fq '[HOMEONLY5][USER11_CONTEXT]' "$RUNNER_TEMP/home6.strings"
        grep -Fq '[HOMEONLY5][USER11_FRAME]' "$RUNNER_TEMP/home6.strings"
        grep -Fq '[HOMEONLY5][USER11_STACK]' "$RUNNER_TEMP/home6.strings"
        grep -Fq '[HOMEONLY4][EVENT_WAKE]' "$RUNNER_TEMP/home6.strings"
        grep -Fq '[HOMEONLY3][HOME_EXIT_KEEP_MENU3]' "$RUNNER_TEMP/home6.strings"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI36 WG_FOCUS:' "$RUNNER_TEMP/home6.strings"
        grep -Fq '[M3HOME1][APPARC_REQUEST]' "$RUNNER_TEMP/home6.strings"

        ! grep -Fq '[NBOOT2]' "$RUNNER_TEMP/home6.strings"
        ! grep -Fq '[COMPATBOOT]' "$RUNNER_TEMP/home6.strings"
        test ! -e "$UPSTREAM/src/emu/j2me"

        {
          echo 'HOMEONLY6 BUILD AUDIT'
          echo 'baseline=HOMEONLY5'
          echo 'fix=GENERIC_QUOTE_AWARE_INI_TOKENIZER'
          echo 'root_cause=AISCUT_ICONID_BARE_TOKEN_FROM_QUOTED_EQUALS_SPLIT'
          echo 'aiscut_copy=euser_ordinal_953_TDes16_Copy'
          echo 'cenrep_length_semantics=UNCHANGED'
          echo 'cenrep_52_to_26_change=NO'
          echo 'target_hardcode=NONE'
          echo 'panic_suppression=NO'
          echo 'nativeboot=ABSENT'
          echo 'compatboot=ABSENT'
          echo 'java_j2me=REMOVED'
        } > HOMEONLY6-BUILD-AUDIT.txt

    - name: Save HOMEONLY6 cache
      uses: actions/cache/save@v4
      with:
        path: upstream
        key: eka2l1-homeonly6-cenrepquoted-macos15-v1

    - name: Package HOMEONLY6 IPA
      run: |
        set -euo pipefail
        APP="$GITHUB_WORKSPACE/upstream/build-ios-device/src/emu/ios/eka2l1.app"
        IPA="$GITHUB_WORKSPACE/upstream/EKA2L1-HOMEONLY6-CENREPQUOTED-unsigned.ipa"
        STAGE="$RUNNER_TEMP/ipa-stage-home6"
        rm -rf "$STAGE" "$IPA"
        mkdir -p "$STAGE/Payload"
        cp -R "$APP" "$STAGE/Payload/EKA2L1.app"
        rm -rf "$STAGE/Payload/EKA2L1.app/_CodeSignature"
        rm -f "$STAGE/Payload/EKA2L1.app/embedded.mobileprovision"
        (cd "$STAGE" && /usr/bin/zip -qry "$IPA" Payload)
        /usr/bin/unzip -t "$IPA" >/dev/null
        ! /usr/bin/unzip -l "$IPA" | grep -Eiq '\.jar([[:space:]]|$)'
        shasum -a 256 "$IPA" | tee HOMEONLY6-IPA-SHA256.txt

    - name: Upload HOMEONLY6 IPA
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-HOMEONLY6-CENREPQUOTED-IPA
        path: upstream/EKA2L1-HOMEONLY6-CENREPQUOTED-unsigned.ipa
        retention-days: 14

    - name: Upload HOMEONLY6 audit
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-HOMEONLY6-CENREPQUOTED-AUDIT
        path: |
          HOMEONLY6-SOURCE-HEAD.txt
          HOMEONLY6-source.diff
          HOMEONLY6-BUILD-AUDIT.txt
          HOMEONLY6-IPA-SHA256.txt
        if-no-files-found: warn
        retention-days: 14
