name: Build M3HOME2 CenRep DeleteRange IPA

"on":
  push:
    branches:
      - codex/m3home-build2
    paths:
      - ".github/workflows/build-m3home2-cenrepdeleterange.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
    - name: Checkout cache host
      uses: actions/checkout@v4

    - name: Restore B28 bootstrap
      id: b28
      uses: actions/cache/restore@v4
      with:
        path: upstream
        key: eka2l1-fastbuild1-bootstrap-b28-nojava-manic3-macos15-v1

    - name: Restore B19 fallback
      id: b19
      if: steps.b28.outputs.cache-hit != 'true'
      uses: actions/cache/restore@v4
      with:
        path: upstream
        key: eka2l1-nativeboot2-b19-salangabi1-nojava-manic3-macos15-v1

    - name: Reconstruct B28 baseline if needed
      run: |
        set -euo pipefail
        UPSTREAM="$GITHUB_WORKSPACE/upstream"
        if [ "${{ steps.b28.outputs.cache-hit }}" != "true" ]; then
          test "${{ steps.b19.outputs.cache-hit }}" = "true"
          python3 apply_nativeboot2_b20_cenresetall1.py "$UPSTREAM"
          python3 apply_nativeboot2_b21_fbsfontalias1.py "$UPSTREAM"
          python3 apply_nativeboot2_b22_fbsdefaulttypeface1.py "$UPSTREAM"
          python3 apply_nativeboot2_b23_fbsfontspecv2abi1.py "$UPSTREAM"
          python3 apply_nativeboot2_b24_fbsvtableabi1.py "$UPSTREAM"
          python3 apply_nativeboot2_b25_fbssharedheap1.py "$UPSTREAM"
          python3 apply_nativeboot2_b26_ioslibraryexit1.py "$UPSTREAM"
          python3 apply_nativeboot2_b27_wservpanic13trace1.py "$UPSTREAM"
          python3 apply_nativeboot2_b28_wservlibtype1.py "$UPSTREAM"
        fi

    - name: Fetch Hướng 1 M3HOME2 source
      run: |
        set -euo pipefail
        SRC="$GITHUB_WORKSPACE/m3home-src"
        git clone --depth 1 --branch codex/menu3-homebridge2 \
          https://github.com/phai-nguyen/Eka2l1-nhanh-menuu3.git "$SRC"
        git -C "$SRC" rev-parse HEAD | tee "$GITHUB_WORKSPACE/M3HOME2-SOURCE-HEAD.txt"

    - name: Apply B29-B98 M3HOME1 M3HOME2
      run: |
        set -euo pipefail
        SRC="$GITHUB_WORKSPACE/m3home-src"
        UPSTREAM="$GITHUB_WORKSPACE/upstream"

        python3 "$SRC/ci/fastbuild1_manifest.py" validate "$SRC"
        python3 "$SRC/ci/fastbuild1_manifest.py" apply "$SRC" "$UPSTREAM"

        CEN="$UPSTREAM/src/emu/services/src/centralrepo/centralrepo.cpp"
        REPO="$UPSTREAM/src/emu/services/src/centralrepo/repo.cpp"
        HDR="$UPSTREAM/src/emu/services/include/services/centralrepo/repo.h"
        ROOT="$UPSTREAM/src/emu/ios/app/RootViewController.mm"

        grep -Fq 'M3HOME2::CenRepDeleteRange' "$CEN"
        grep -Fq 'case cen_rep_delete_range:' "$CEN"
        grep -Fq '[M3HOME2][CEN_DELETE_RANGE]' "$REPO"
        grep -Fq '[M3HOME2][CEN_DELETE_COMMIT]' "$REPO"
        grep -Fq 'std::unordered_set<std::uint32_t> deleted_keys;' "$HDR"
        grep -Fq '[M3HOME1][TRIGGER]' "$ROOT"
        grep -Fq '[self launchAppUid:0x102750F0u]' "$ROOT"

        git -C "$UPSTREAM" diff --check
        git -C "$UPSTREAM" diff > "$GITHUB_WORKSPACE/M3HOME2-source.diff"

        {
          echo 'M3HOME2 CENREPDELRANGE1 BUILD AUDIT'
          echo 'source_repo=phai-nguyen/Eka2l1-nhanh-menuu3'
          echo 'source_branch=codex/menu3-homebridge2'
          echo 'opcode=0x21_EDeleteRange'
          echo 'abi=arg0_partial,arg1_mask,arg2_errorKey,arg3_subsession'
          echo 'transaction_delete=STAGED_UNTIL_COMMIT'
          echo 'M3HOME1=PRESERVED'
          echo 'focus_input=UNCHANGED'
          echo 'tfxserver=UNCHANGED'
          echo 'firmware=UNCHANGED'
        } > "$GITHUB_WORKSPACE/M3HOME2-BUILD-AUDIT.txt"

    - name: Build iOS app
      run: |
        set -euo pipefail
        UPSTREAM="$GITHUB_WORKSPACE/upstream"
        CMAKE_BIN="$UPSTREAM/.tools/cmake-3.31.6-macos-universal/CMake.app/Contents/bin/cmake"
        "$CMAKE_BIN" --build "$UPSTREAM/build-ios-device" --target eka2l1 --parallel 4

        APP="$UPSTREAM/build-ios-device/src/emu/ios/eka2l1.app"
        BIN="$APP/eka2l1"
        test -x "$BIN"
        strings "$BIN" > "$RUNNER_TEMP/m3home2.strings"
        grep -Fq '[M3HOME2][CEN_DELETE_RANGE]' "$RUNNER_TEMP/m3home2.strings"
        grep -Fq '[M3HOME2][CEN_DELETE_COMMIT]' "$RUNNER_TEMP/m3home2.strings"
        grep -Fq '[M3HOME1][APPARC_REQUEST]' "$RUNNER_TEMP/m3home2.strings"

    - name: Package unsigned IPA
      run: |
        set -euo pipefail
        APP="$GITHUB_WORKSPACE/upstream/build-ios-device/src/emu/ios/eka2l1.app"
        IPA="$GITHUB_WORKSPACE/upstream/EKA2L1-M3HOME2-CENREPDELRANGE1-unsigned.ipa"
        STAGE="$RUNNER_TEMP/ipa-stage-m3home2"
        rm -rf "$STAGE" "$IPA"
        mkdir -p "$STAGE/Payload"
        cp -R "$APP" "$STAGE/Payload/EKA2L1.app"
        rm -rf "$STAGE/Payload/EKA2L1.app/_CodeSignature"
        rm -f "$STAGE/Payload/EKA2L1.app/embedded.mobileprovision"
        (cd "$STAGE" && /usr/bin/zip -qry "$IPA" Payload)
        /usr/bin/unzip -t "$IPA" >/dev/null
        shasum -a 256 "$IPA" | tee "$GITHUB_WORKSPACE/M3HOME2-IPA-SHA256.txt"

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-M3HOME2-CENREPDELRANGE1-IPA
        path: upstream/EKA2L1-M3HOME2-CENREPDELRANGE1-unsigned.ipa
        retention-days: 14

    - name: Upload audit
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-M3HOME2-CENREPDELRANGE1-AUDIT
        path: |
          M3HOME2-SOURCE-HEAD.txt
          M3HOME2-BUILD-AUDIT.txt
          M3HOME2-source.diff
          M3HOME2-IPA-SHA256.txt
        retention-days: 14

    - name: Upload failure context
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-M3HOME2-CENREPDELRANGE1-FAILURE-CONTEXT
        path: |
          M3HOME2-SOURCE-HEAD.txt
          M3HOME2-BUILD-AUDIT.txt
          M3HOME2-source.diff
        if-no-files-found: warn
        retention-days: 14
