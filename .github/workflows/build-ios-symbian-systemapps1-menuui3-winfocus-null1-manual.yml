name: Build EKA2L1 SYMBIAN SYSTEMAPPS1 MENUUI3 WINFOCUS NULL1 Manual IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-app:
    runs-on: macos-15
    timeout-minutes: 120

    steps:
    - name: Checkout current package and Git history
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Replay validated MENUUI2 chain with MENUUI3 WINFOCUS NULL1
      run: |
        set -euo pipefail
        SOURCE_COMMIT="be2e4d7191ccb61f2232b9bc50d3c29f8bc5e52c"
        SOURCE_WORKFLOW=".github/workflows/build-ios-symbian-systemapps1-menuui2-xntheme-crash-trace1-manual.yml"
        SOURCE_YML="$RUNNER_TEMP/menuui3-winfocus-source.yml"
        REPLAY_SCRIPT="$RUNNER_TEMP/menuui3-winfocus-replay.sh"

        git cat-file -e "$SOURCE_COMMIT^{commit}"
        git show "$SOURCE_COMMIT:$SOURCE_WORKFLOW" > "$SOURCE_YML"
        test -s "$SOURCE_YML"

        python3 - "$SOURCE_YML" "$REPLAY_SCRIPT" <<'PY_EXTRACT'
        import hashlib
        import sys
        from pathlib import Path

        source = Path(sys.argv[1]).read_text(encoding='utf-8').splitlines()
        output = Path(sys.argv[2])
        target = 'Replay frozen baseline with MENUUI2 XNTHEME CRASH TRACE1'
        matches = []

        i = 0
        while i < len(source):
            if source[i].startswith('    - name:'):
                name = source[i].split('    - name:', 1)[1].strip()
                j = i + 1
                run_index = None
                while j < len(source) and not source[j].startswith('    - name:'):
                    if source[j].startswith('      run: |'):
                        run_index = j
                        break
                    j += 1
                if name == target:
                    if run_index is None:
                        raise SystemExit('MENUUI3: MENUUI2 replay step has no run block')
                    k = run_index + 1
                    body = []
                    while k < len(source) and not source[k].startswith('    - name:'):
                        row = source[k]
                        if row.startswith('        '):
                            body.append(row[8:])
                        elif row.strip() == '':
                            body.append('')
                        else:
                            break
                        k += 1
                    matches.append('\n'.join(body) + '\n')
                i = j
            else:
                i += 1

        if len(matches) != 1:
            raise SystemExit(f'MENUUI3: expected exactly one MENUUI2 replay step, found {len(matches)}')

        script = matches[0]
        required = [
            'MENUUI2 XNTHEME CRASH TRACE1 REPLAYFIX2 baseline replay: PASS',
            'EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI2-XNTHEME-CRASH-TRACE1-source-patch.zip',
            'JAVA-STABLE1 + N-GAGE-STABILITY1-CUBEB1 + COMPAT1-T9AKN1 frozen behavior files: byte-identical PASS',
        ]
        missing = [marker for marker in required if marker not in script]
        if missing:
            raise SystemExit('MENUUI3: source replay guard failed: ' + ', '.join(missing))

        anchor = '\nMENU_STEP_SCRIPT\n'
        if script.count(anchor) != 1:
            raise SystemExit(f'MENUUI3: expected one MENU_STEP_SCRIPT terminator, found {script.count(anchor)}')

        winfocus = r"""
WINDOW_CPP="$UPSTREAM/src/emu/services/src/window/window.cpp"
python3 - "$WINDOW_CPP" <<'PY_WINFOCUS'
from pathlib import Path
import sys

path = Path(sys.argv[1])
text = path.read_text(encoding='utf-8')
sig = '    void window_server_client::get_focus_window_group(service::ipc_context &ctx, ws_cmd &cmd) {'
next_sig = '\n    void window_server_client::get_window_group_name_from_id(service::ipc_context &ctx, ws_cmd &cmd) {'
start = text.find(sig)
if start < 0:
    raise SystemExit('MENUUI3: get_focus_window_group signature not found')
end = text.find(next_sig, start)
if end < 0:
    raise SystemExit('MENUUI3: get_focus_window_group end anchor not found')
old = text[start:end]

if 'SYMBIAN-SYSTEMAPPS1 MENUUI3 WINFOCUS NULL:' in old:
    print('MENUUI3 WINFOCUS NULL1 already present')
else:
    required_old = [
        'ctx.complete(get_ws().get_current_focus_screen()->focus->id);',
        'epoc::screen *scr = get_ws().get_screen(screen_num);',
        'ctx.complete(scr->focus->id);',
    ]
    missing_old = [x for x in required_old if x not in old]
    if missing_old:
        raise SystemExit('MENUUI3: unexpected pre-patch WINFOCUS body: ' + ', '.join(missing_old))

    new = '''    void window_server_client::get_focus_window_group(service::ipc_context &ctx, ws_cmd &cmd) {
        // TODO: Epoc < 9
        if (cmd.header.cmd_len == 0) {
            epoc::screen *scr = get_ws().get_current_focus_screen();
            if (!scr || !scr->focus) {
                LOG_WARN(SERVICE_WINDOW, "SYMBIAN-SYSTEMAPPS1 MENUUI3 WINFOCUS NULL: mode=implicit cmd_len={} screen={} return=0",
                    cmd.header.cmd_len, scr ? scr->number : -1);
                ctx.complete(0);
                return;
            }

            LOG_INFO(SERVICE_WINDOW, "SYMBIAN-SYSTEMAPPS1 MENUUI3 WINFOCUS: mode=implicit cmd_len={} screen={} focus_id={}",
                cmd.header.cmd_len, scr->number, scr->focus->id);
            ctx.complete(scr->focus->id);
            return;
        }

        int screen_num = *reinterpret_cast<int *>(cmd.data_ptr);
        epoc::screen *scr = get_ws().get_screen(screen_num);

        if (!scr) {
            LOG_ERROR(SERVICE_WINDOW, "Invalid screen number {}", screen_num);
            ctx.complete(epoc::error_argument);
            return;
        }

        if (!scr->focus) {
            LOG_WARN(SERVICE_WINDOW, "SYMBIAN-SYSTEMAPPS1 MENUUI3 WINFOCUS NULL: mode=explicit cmd_len={} screen={} return=0",
                cmd.header.cmd_len, screen_num);
            ctx.complete(0);
            return;
        }

        LOG_INFO(SERVICE_WINDOW, "SYMBIAN-SYSTEMAPPS1 MENUUI3 WINFOCUS: mode=explicit cmd_len={} screen={} focus_id={}",
            cmd.header.cmd_len, screen_num, scr->focus->id);
        ctx.complete(scr->focus->id);
    }
'''
    text = text[:start] + new + text[end:]
    path.write_text(text, encoding='utf-8')
    print('MENUUI3 WINFOCUS NULL1 patch applied')
PY_WINFOCUS

grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI3 WINFOCUS NULL:' "$WINDOW_CPP"
grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI3 WINFOCUS:' "$WINDOW_CPP"
grep -Fq 'ctx.complete(0);' "$WINDOW_CPP"
! grep -Fq 'ctx.complete(get_ws().get_current_focus_screen()->focus->id);' "$WINDOW_CPP"
git -C "$UPSTREAM" diff --check
echo 'MENUUI3-WINFOCUS-NULL1 source gate: PASS'
"""

        script = script.replace(anchor, '\n' + winfocus + '\nMENU_STEP_SCRIPT\n', 1)
        output.write_text(script, encoding='utf-8')
        digest = hashlib.sha256(script.encode('utf-8')).hexdigest()
        print(f'MENUUI3: extracted+patched replay script sha256={digest}')
        PY_EXTRACT

        chmod +x "$REPLAY_SCRIPT"
        bash -n "$REPLAY_SCRIPT"
        bash "$REPLAY_SCRIPT"

    - name: Package MENUUI3 WINFOCUS NULL1 unsigned IPA
      working-directory: upstream
      run: |
        set -euo pipefail
        LOG="$GITHUB_WORKSPACE/eka2l1-java-build.log"
        touch "$LOG"
        exec > >(tee -a "$LOG") 2>&1
        echo "=== STEP: Package MENUUI3 WINFOCUS NULL1 unsigned IPA ==="

        APP="build-ios-device/src/emu/ios/eka2l1.app"
        BIN="$APP/eka2l1"
        IPA="EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI3-WINFOCUS-NULL1-unsigned.ipa"
        STAGE="ipa-stage-menuui3-winfocus-null1"
        STRINGS_OUT="$RUNNER_TEMP/menuui3-winfocus-null1.binary.strings"
        IPA_LIST="$RUNNER_TEMP/menuui3-winfocus-null1.ipa-list.txt"

        test -d "$APP"
        test -x "$BIN"

        strings "$BIN" > "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI3 WINFOCUS NULL:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI3 WINFOCUS:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI2 FS27 PRE:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI2 LEAVE RETURN:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI2 SVCMISS:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI1 VIEW19: raw={} final=19 complete=KErrNone' "$STRINGS_OUT"
        echo 'MENUUI3 WINFOCUS + MENUUI2 + VIEW19 binary markers: PASS'

        rm -rf "$STAGE" "$IPA"
        mkdir -p "$STAGE/Payload"
        cp -R "$APP" "$STAGE/Payload/EKA2L1.app"
        rm -rf "$STAGE/Payload/EKA2L1.app/_CodeSignature"
        rm -f "$STAGE/Payload/EKA2L1.app/embedded.mobileprovision"

        (cd "$STAGE" && /usr/bin/zip -qry "../$IPA" Payload)
        /usr/bin/unzip -t "$IPA" >/dev/null
        /usr/bin/unzip -l "$IPA" > "$IPA_LIST"
        grep -Fq 'Payload/EKA2L1.app/eka2l1' "$IPA_LIST"
        test -s "$IPA"
        shasum -a 256 "$IPA"
        echo 'MENUUI3 WINFOCUS NULL1 unsigned IPA package: PASS'

    - name: Upload MENUUI3 WINFOCUS NULL1 IPA
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI3-WINFOCUS-NULL1-IPA
        path: upstream/EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI3-WINFOCUS-NULL1-unsigned.ipa
        if-no-files-found: error
        retention-days: 14

    - name: Upload diagnostic log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI3-WINFOCUS-NULL1-diagnostic-log
        path: eka2l1-java-build.log
        if-no-files-found: warn
        retention-days: 14
