name: Build EKA2L1 NATIVEBOOT2 B20 CENRESETALL1 NOJAVA MANIC3 IPA

"on":
  workflow_dispatch:
  push:
    branches:
      - nativeboot2-b20-cenresetall1
    paths:
      - apply_nativeboot2_b20_cenresetall1.py
      - test_nativeboot2_b20_cenresetall1.py
      - .github/workflows/build-ios-nativeboot2-b20-cenresetall1-nojava-manic3.yml

permissions:
  contents: read

jobs:
  build-app:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
    - name: Checkout project
      uses: actions/checkout@v4

    - name: Restore B20 cache
      id: b20_cache
      uses: actions/cache/restore@v4
      with:
        path: upstream
        key: eka2l1-nativeboot2-b20-cenresetall1-nojava-manic3-macos15-v1

    - name: Restore B19 baseline
      id: b19_cache
      if: steps.b20_cache.outputs.cache-hit != 'true'
      uses: actions/cache/restore@v4
      with:
        path: upstream
        key: eka2l1-nativeboot2-b19-salangabi1-nojava-manic3-macos15-v1

    - name: Apply B20 CenRep ResetAll and rebuild
      if: steps.b20_cache.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail
        LOG="$GITHUB_WORKSPACE/eka2l1-nativeboot2-b20-cenresetall1.log"
        : > "$LOG"
        exec > >(tee -a "$LOG") 2>&1

        test "${{ steps.b19_cache.outputs.cache-hit }}" = "true"

        UPSTREAM="$GITHUB_WORKSPACE/upstream"
        PATCHER="$GITHUB_WORKSPACE/apply_nativeboot2_b20_cenresetall1.py"
        TESTER="$GITHUB_WORKSPACE/test_nativeboot2_b20_cenresetall1.py"
        CMAKE_BIN="$UPSTREAM/.tools/cmake-3.31.6-macos-universal/CMake.app/Contents/bin/cmake"

        REPOCPP="$UPSTREAM/src/emu/services/src/centralrepo/repo.cpp"
        CENCPP="$UPSTREAM/src/emu/services/src/centralrepo/centralrepo.cpp"
        REPOH="$UPSTREAM/src/emu/services/include/services/centralrepo/repo.h"
        COMMONH="$UPSTREAM/src/emu/services/include/services/centralrepo/common.h"
        SA="$UPSTREAM/src/emu/services/src/sms/sa/sa.cpp"
        SVC="$UPSTREAM/src/emu/kernel/src/svc.cpp"
        FS="$UPSTREAM/src/emu/services/src/fs/fs.cpp"
        LOADER="$UPSTREAM/src/emu/services/src/loader/loader.cpp"
        HAL="$UPSTREAM/src/emu/system/src/hal.cpp"
        ROOT="$UPSTREAM/src/emu/ios/app/RootViewController.mm"
        STATE="$UPSTREAM/src/emu/ios/src/state.cpp"

        python3 -m py_compile "$PATCHER" "$TESTER"
        python3 "$PATCHER" "$UPSTREAM"

        # GREEN: same contract that failed against B19 must pass after B20.
        python3 "$TESTER" "$UPSTREAM"

        grep -Fq 'cen_rep_reset_all' "$COMMONH"
        grep -Fq 'NBOOT2::CenRepResetAll' "$CENCPP"
        grep -Fq 'case cen_rep_reset_all:' "$CENCPP"
        grep -Fq 'void reset_all(service::ipc_context *ctx);' "$REPOH"
        grep -Fq '[NBOOT2][CEN_RESET_ALL]' "$REPOCPP"
        grep -Fq '[NBOOT2][CEN_RESET_ALL_DONE]' "$REPOCPP"
        grep -Fq '[NBOOT2][CEN_RESET_ALL_FAIL]' "$REPOCPP"
        grep -Fq 'attach_repo->entries = init_repo->entries;' "$REPOCPP"
        grep -Fq 'attach_repo->deleted_settings = init_repo->deleted_settings;' "$REPOCPP"
        grep -Fq 'write_changes(io, mngr);' "$REPOCPP"

        grep -Fq '[NBOOT2][SA_LANG_ABI]' "$SA"
        grep -Fq 'NBOOT2::SaLangAbiProbe' "$SA"
        grep -Fq '[NBOOT2][SA_RTC_VALID]' "$SA"
        grep -Fq '[NBOOT2][SA_HIDDEN_RESET]' "$SA"
        grep -Fq '[NBOOT2][SA_STARTUP_MODE]' "$SA"
        grep -Fq '[NBOOT2][SA_OP1_PENDING]' "$SA"
        grep -Fq '[NBOOT2][SA_RESPONSE]' "$SA"

        grep -Fq '[NBOOT2][DM_INIT_SET_INT]' "$SVC"
        grep -Fq '[NBOOT2][RM356_CREATOR_SECURITY]' "$SVC"
        grep -Fq 'BRIDGE_REGISTER(0xB1, creator_security_info)' "$SVC"
        grep -Fq '[NBOOT2][RM356_FS_FORMAT_OPEN]' "$FS"
        grep -Fq '[NBOOT2][RM356_LOADER_FSY]' "$LOADER"
        grep -Fq '[NBOOT2][RM356_STARTUP_REASON]' "$HAL"
        grep -Fq '[NBOOT2][ESTART_RUN]' "$STATE"
        grep -Fq 'NATIVEBOOT2 EMUHUB1' "$ROOT"
        test ! -e "$UPSTREAM/src/emu/j2me"

        git -C "$UPSTREAM" diff --check
        "$CMAKE_BIN" --build "$UPSTREAM/build-ios-device" --target eka2l1 --parallel 4

        APP="$UPSTREAM/build-ios-device/src/emu/ios/eka2l1.app"
        BIN="$APP/eka2l1"
        test -x "$BIN"

        STRINGS_OUT="$RUNNER_TEMP/nativeboot2-b20-cenresetall1.strings"
        strings "$BIN" > "$STRINGS_OUT"
        grep -Fq '[NBOOT2][CEN_RESET_ALL]' "$STRINGS_OUT"
        grep -Fq '[NBOOT2][CEN_RESET_ALL_DONE]' "$STRINGS_OUT"
        grep -Fq '[NBOOT2][CEN_RESET_ALL_FAIL]' "$STRINGS_OUT"
        grep -Fq 'NBOOT2::CenRepResetAll' "$STRINGS_OUT"
        grep -Fq '[NBOOT2][SA_LANG_ABI]' "$STRINGS_OUT"
        grep -Fq '[NBOOT2][SA_RTC_VALID]' "$STRINGS_OUT"
        grep -Fq '[NBOOT2][SA_HIDDEN_RESET]' "$STRINGS_OUT"
        grep -Fq '[NBOOT2][SA_STARTUP_MODE]' "$STRINGS_OUT"
        grep -Fq '[NBOOT2][SA_OP1_PENDING]' "$STRINGS_OUT"
        grep -Fq '[NBOOT2][DM_INIT_SET_INT]' "$STRINGS_OUT"
        grep -Fq 'NATIVEBOOT2 EMUHUB1' "$STRINGS_OUT"
        ! grep -Eiq 'phoneME|JAVA-STABLE1|MMAPI-DIAG2|GM-SYNTH1 renderer=gm-sf2' "$STRINGS_OUT"

        {
          echo 'NATIVEBOOT2 B20 CENRESETALL1 BUILD AUDIT'
          echo 'base_cache=NATIVEBOOT2_B19_SALANGABI1'
          echo 'blocker=!CentralRepository_0x1A'
          echo 'opcode=cen_rep_reset_all_26_EResetAll'
          echo 'behavior=RESTORE_INIT_SNAPSHOT'
          echo 'entries=RESTORED_FROM_INITIAL'
          echo 'deleted_settings=RESTORED_FROM_INITIAL'
          echo 'whole_object_assignment=DISABLED'
          echo 'live_attachments=PRESERVED'
          echo 'transaction_active=KErrNotSupported'
          echo 'persistence=write_changes'
          echo 'notifications=UNCHANGED_DEFERRED'
          echo 'platsec=UNCHANGED_DEFERRED'
          echo 'synthetic_ack=NO'
          echo 'b19_salangabi1=PRESERVED'
          echo 'b18_sartc1=PRESERVED'
          echo 'b17_sahiddenreset1=PRESERVED'
          echo 'b16_samode1=PRESERVED'
          echo 'b15_saasync1=PRESERVED'
          echo 'b14_saresponse1=PRESERVED'
          echo 'b11_dminit1=PRESERVED'
          echo 'boot_owner=firmware_SYSSTART'
          echo 'host_sysstart=DISABLED'
          echo 'host_menu=DISABLED'
          echo 'frontend=EMUHUB1_PRESERVED'
          echo 'NOJAVA=PRESERVED'
          echo 'MANIC3=PRESERVED'
          echo 'TDD_RED_RUN=35540872597'
        } > "$GITHUB_WORKSPACE/NATIVEBOOT2-B20-CENRESETALL1-BUILD-AUDIT.txt"

        git -C "$UPSTREAM" diff > "$GITHUB_WORKSPACE/NATIVEBOOT2-B20-CENRESETALL1-source.diff"

    - name: Verify restored B20 cache
      if: steps.b20_cache.outputs.cache-hit == 'true'
      run: |
        set -euo pipefail
        UPSTREAM="$GITHUB_WORKSPACE/upstream"
        python3 test_nativeboot2_b20_cenresetall1.py "$UPSTREAM"
        grep -Fq '[NBOOT2][CEN_RESET_ALL_DONE]' "$UPSTREAM/src/emu/services/src/centralrepo/repo.cpp"
        grep -Fq '[NBOOT2][SA_LANG_ABI]' "$UPSTREAM/src/emu/services/src/sms/sa/sa.cpp"
        grep -Fq '[NBOOT2][DM_INIT_SET_INT]' "$UPSTREAM/src/emu/kernel/src/svc.cpp"
        test -x "$UPSTREAM/build-ios-device/src/emu/ios/eka2l1.app/eka2l1"
        test ! -e "$UPSTREAM/src/emu/j2me"
        echo 'NATIVEBOOT2 B20 CENRESETALL1 cache_hit=true' > "$GITHUB_WORKSPACE/NATIVEBOOT2-B20-CENRESETALL1-BUILD-AUDIT.txt"
        : > "$GITHUB_WORKSPACE/NATIVEBOOT2-B20-CENRESETALL1-source.diff"

    - name: Save B20 cache
      if: steps.b20_cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: upstream
        key: eka2l1-nativeboot2-b20-cenresetall1-nojava-manic3-macos15-v1

    - name: Package unsigned IPA
      run: |
        set -euo pipefail
        APP="$GITHUB_WORKSPACE/upstream/build-ios-device/src/emu/ios/eka2l1.app"
        IPA="$GITHUB_WORKSPACE/upstream/EKA2L1-NATIVEBOOT2-B20-CENRESETALL1-NOJAVA-MANIC3-unsigned.ipa"
        STAGE="$RUNNER_TEMP/ipa-stage-nativeboot2-b20"
        rm -rf "$STAGE" "$IPA"
        mkdir -p "$STAGE/Payload"
        cp -R "$APP" "$STAGE/Payload/EKA2L1.app"
        rm -rf "$STAGE/Payload/EKA2L1.app/_CodeSignature"
        rm -f "$STAGE/Payload/EKA2L1.app/embedded.mobileprovision"
        (cd "$STAGE" && /usr/bin/zip -qry "$IPA" Payload)
        /usr/bin/unzip -t "$IPA" >/dev/null
        /usr/bin/unzip -l "$IPA" > "$RUNNER_TEMP/nativeboot2-b20-ipa-list.txt"
        grep -Fq 'Payload/EKA2L1.app/eka2l1' "$RUNNER_TEMP/nativeboot2-b20-ipa-list.txt"
        ! grep -Ei '\\.jar([[:space:]]|$)' "$RUNNER_TEMP/nativeboot2-b20-ipa-list.txt"
        shasum -a 256 "$IPA" | tee "$GITHUB_WORKSPACE/NATIVEBOOT2-B20-CENRESETALL1-IPA-SHA256.txt"

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-NATIVEBOOT2-B20-CENRESETALL1-NOJAVA-MANIC3-IPA
        path: upstream/EKA2L1-NATIVEBOOT2-B20-CENRESETALL1-NOJAVA-MANIC3-unsigned.ipa
        retention-days: 14

    - name: Upload audit
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-NATIVEBOOT2-B20-CENRESETALL1-NOJAVA-MANIC3-AUDIT
        path: |
          NATIVEBOOT2-B20-CENRESETALL1-BUILD-AUDIT.txt
          NATIVEBOOT2-B20-CENRESETALL1-source.diff
          NATIVEBOOT2-B20-CENRESETALL1-IPA-SHA256.txt
        retention-days: 14

    - name: Upload diagnostic log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-NATIVEBOOT2-B20-CENRESETALL1-diagnostic-log
        path: eka2l1-nativeboot2-b20-cenresetall1.log
        if-no-files-found: warn
        retention-days: 14
