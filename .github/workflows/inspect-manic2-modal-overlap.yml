name: Inspect MANIC2 modal overlap source

"on":
  push:
    branches:
      - main
    paths:
      - .github/INSPECT_MANIC2_MODAL_TRIGGER

permissions:
  contents: read

jobs:
  inspect:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - id: cache
      uses: actions/cache/restore@v4
      with:
        path: upstream
        key: eka2l1-menuui22-nojava-full1-manic2-macos15-v1
    - name: Inspect RootViewController modal/control paths
      run: |
        set -euo pipefail
        test "${{ steps.cache.outputs.cache-hit }}" = "true"
        ROOT=upstream/src/emu/ios/app/RootViewController.mm
        echo '===== CONTROL PROPERTIES / SETUP ====='
        grep -nE -C 8 'controlsView|manicArtworkView|applyControls|gameRunning' "$ROOT" | head -n 360 || true
        echo '===== GAME MENU / LAYOUT PICKER ====='
        grep -nE -C 16 'Menu trò chơi|Đổi bố cục phím|Bố cục phím|show.*Layout|layoutOrder|layoutDisplayName|UIAlertController' "$ROOT" || true
        echo '===== PRESENT CALLS ====='
        grep -nE -C 8 'presentViewController:|dismissViewControllerAnimated:' "$ROOT" || true
        echo '===== VIEW LAYOUT / Z-ORDER ====='
        grep -nE -C 12 'viewDidLayoutSubviews|bringSubviewToFront|insertSubview|addSubview' "$ROOT" || true
