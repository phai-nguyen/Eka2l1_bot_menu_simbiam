        grep -Fq 'reg.caps.is_hidden || reg.land_drive != drive_z' "$LAUNCHER_CPP"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 ENUM1: enumerated {} visible ROM system app(s)' "$LAUNCHER_CPP"
        grep -Fq 'std::vector<app_entry> get_system_apps();' "$BRIDGE_H"
        grep -Fq 'g_state->launcher_->get_system_apps()' "$BRIDGE_MM"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 BRIDGE1: bridge visible ROM system apps count={}' "$BRIDGE_MM"
        grep -Fq 'eka2l1::ios::bridge::get_system_apps()' "$ROOT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 UI1: unified system apps=' "$ROOT"
        grep -Fq '[self loadIconsForApps:systemList]' "$ROOT"
        grep -Fq '@{ @"title":@"Hệ thống", @"kind":@"system"' "$UNIFIED"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 LAUNCH1: system uid=0x%08X name=%@' "$UNIFIED"
        grep -Fq 'eka2l1::ios::bridge::launch_app(uid);' "$ROOT"
