        grep -Fq 'firmware_code.c_str(), "RH-29"' "$LAUNCHER"
        grep -Fq 'J2ME-RUNTIMELOG1: event={}' "$BRIDGE"
        grep -Fq 'MMAPI interruption-began' "$MEDIA"

        python3 - "$BIN" <<'PYCODE'
        import sys
        from pathlib import Path
        data = Path(sys.argv[1]).read_bytes()
        needles = [
            'Lưu', '96×65', '854×480',
            'N-Gage 2.0 chưa sẵn sàng',
            'NGAGEROUTE2: Classic firmware=',
            'J2ME-RUNTIMELOG1: event=',
            'MMAPI suspend', 'MMAPI resume',
            'JAVA-STABLE1 runtime native-editor=1 fixed-midp=1',
            'EKA2L1-JAVA-STABLE1: persistent-log-limit=8MiB',
        ]
        encodings = ('utf-8', 'utf-16le', 'utf-16be')
        missing = [n for n in needles if not any(n.encode(e) in data for e in encodings)]
        if missing:
            raise SystemExit('ERROR: BUILDFIX10 binary marker(s) missing: ' + ', '.join(missing))
        print('BUILDFIX10 JAVADISPLAYFIX1 + RESOLUTIONPRESETS2 + NGAGEROUTE2 + J2ME-RUNTIMELOG1 binary markers: PASS')
        PYCODE

        # Preserve all earlier branch guarantees.
        grep -Fq 'UNIFIEDLIBRARY1: four primary toolbar entries; Java lives inside Apps.' "$ROOT"
        grep -Fq 'AUTOIMPORT1: JAR is independent from the Symbian firmware/device lifecycle.' "$ROOT"
        grep -Fq 'NGAGE CLASSIC R2FX2 R2 CRASHFIX1:' "$ROOT"
        grep -Fq 'com.eka2l1.ngage.lifecycle' "$ROOT"
        grep -Fq 'NGAGE CLASSIC R2FX2 COMPATIBILITY R2 EXPORTMAP BATCH1:' src/emu/kernel/src/codeseg.cpp
        ! grep -Fq 'ord == 61' src/emu/kernel/src/codeseg.cpp
        ! grep -Fq 'ord == 63' src/emu/kernel/src/codeseg.cpp
        grep -Fq 'eka2l1::ios::j2me::Rect r=rendered_frame_rect(' src/emu/ios/app/j2me/J2MEPlayerViewController.mm
        grep -Fq 'basic_file_sink_mt>(log_file_name_persistent, false)' src/emu/common/src/log.cpp
        grep -Fq 'EKA2L1-JAVA-STABLE1: persistent-log-limit=8MiB' src/emu/common/src/log.cpp
        grep -Fq 'should_stop.load() || to_draw == 0' src/emu/drivers/src/graphics/backend/ogl/graphics_ogl.cpp
        grep -Fq 'JAVA-STABLE1 runtime native-editor=1 fixed-midp=1' src/emu/ios/app/j2me/J2MEPlayerViewController.mm
        git diff --check
        echo 'BUILDFIX10 final regressions: PASS'

    - name: Package unsigned IPA
      working-directory: upstream
      run: |
        LOG="$GITHUB_WORKSPACE/eka2l1-java-build.log"
        touch "$LOG"
        exec > >(tee -a "$LOG") 2>&1
        echo "=== STEP: Package unsigned IPA ==="
        set -euo pipefail
        APP="build-ios-device/src/emu/ios/eka2l1.app"
        IPA="EKA2L1-SYMBIAN-SYSTEMAPPS1-unsigned.ipa"
        STAGE="ipa-stage"

        test -d "$APP"
        test -x "$APP/eka2l1"
        rm -rf "$STAGE" "$IPA"
        mkdir -p "$STAGE/Payload"
        cp -R "$APP" "$STAGE/Payload/EKA2L1.app"

        # Keep this artifact unsigned so the user can sign/install it with
        # their preferred iOS signing method. Remove any stale signature or
        # provisioning data inherited from the build tree.
        rm -rf "$STAGE/Payload/EKA2L1.app/_CodeSignature"
        rm -f "$STAGE/Payload/EKA2L1.app/embedded.mobileprovision"

        (cd "$STAGE" && /usr/bin/zip -qry "../$IPA" Payload)
        /usr/bin/unzip -t "$IPA" >/dev/null
        /usr/bin/unzip -l "$IPA" | grep -Fq 'Payload/EKA2L1.app/eka2l1'
        test -s "$IPA"
        echo 'Unsigned IPA package: PASS'
        ls -lh "$IPA"
        shasum -a 256 "$IPA"

    - name: Upload unsigned IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-SYMBIAN-SYSTEMAPPS1-IPA
        path: upstream/EKA2L1-SYMBIAN-SYSTEMAPPS1-unsigned.ipa
        if-no-files-found: error
        retention-days: 14

    - name: Upload complete diagnostic log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-SYMBIAN-SYSTEMAPPS1-diagnostic-log
        path: eka2l1-java-build.log
        if-no-files-found: error
        retention-days: 14
