name: Build EKA2L1 SYMBIAN SYSTEMAPPS1 MENUUI6 ERRORORIGINTRACE1 Manual IPA

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-app:
    runs-on: macos-15
    timeout-minutes: 120

    steps:
    - name: Checkout current package and Git history
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Replay validated MENUUI2 chain with MENUUI3-6 diagnostics
      run: |
        set -euo pipefail
        SOURCE_COMMIT="be2e4d7191ccb61f2232b9bc50d3c29f8bc5e52c"
        SOURCE_WORKFLOW=".github/workflows/build-ios-symbian-systemapps1-menuui2-xntheme-crash-trace1-manual.yml"
        SOURCE_YML="$RUNNER_TEMP/menuui6-errororigintrace-source.yml"
        REPLAY_SCRIPT="$RUNNER_TEMP/menuui6-errororigintrace-replay.sh"

        git cat-file -e "$SOURCE_COMMIT^{commit}"
        git show "$SOURCE_COMMIT:$SOURCE_WORKFLOW" > "$SOURCE_YML"
        test -s "$SOURCE_YML"
        test -f "$GITHUB_WORKSPACE/apply_menuui3_winfocus_null1.py"
        test -f "$GITHUB_WORKSPACE/apply_menuui4_killtrace1.py"
        test -f "$GITHUB_WORKSPACE/apply_menuui5_selfkilltrace1.py"
        test -f "$GITHUB_WORKSPACE/apply_menuui6_errororigintrace1_fix1.py"
        python3 -m py_compile "$GITHUB_WORKSPACE/apply_menuui6_errororigintrace1_fix1.py"

        python3 - "$SOURCE_YML" "$REPLAY_SCRIPT" <<'PY_EXTRACT'
        import hashlib
        import sys
        from pathlib import Path

        source = Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()
        output = Path(sys.argv[2])
        target = "Replay frozen baseline with MENUUI2 XNTHEME CRASH TRACE1"
        matches = []

        i = 0
        while i < len(source):
            if source[i].startswith("    - name:"):
                name = source[i].split("    - name:", 1)[1].strip()
                j = i + 1
                run_index = None
                while j < len(source) and not source[j].startswith("    - name:"):
                    if source[j].startswith("      run: |"):
                        run_index = j
                        break
                    j += 1
                if name == target:
                    if run_index is None:
                        raise SystemExit("MENUUI6 FIX1: MENUUI2 replay step has no run block")
                    k = run_index + 1
                    body = []
                    while k < len(source) and not source[k].startswith("    - name:"):
                        row = source[k]
                        if row.startswith("        "):
                            body.append(row[8:])
                        elif row.strip() == "":
                            body.append("")
                        else:
                            break
                        k += 1
                    matches.append("\n".join(body) + "\n")
                i = j
            else:
                i += 1

        if len(matches) != 1:
            raise SystemExit(f"MENUUI6 FIX1: expected exactly one MENUUI2 replay step, found {len(matches)}")

        script = matches[0]
        required = [
            "MENUUI2 XNTHEME CRASH TRACE1 REPLAYFIX2 baseline replay: PASS",
            "EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI2-XNTHEME-CRASH-TRACE1-source-patch.zip",
            "JAVA-STABLE1 + N-GAGE-STABILITY1-CUBEB1 + COMPAT1-T9AKN1 frozen behavior files: byte-identical PASS",
        ]
        missing = [marker for marker in required if marker not in script]
        if missing:
            raise SystemExit("MENUUI6 FIX1: source replay guard failed: " + ", ".join(missing))

        anchor = "\nMENU_STEP_SCRIPT\n"
        if script.count(anchor) != 1:
            raise SystemExit(f"MENUUI6 FIX1: expected one MENU_STEP_SCRIPT terminator, found {script.count(anchor)}")

        inject = "\n".join([
            'python3 "$GITHUB_WORKSPACE/apply_menuui3_winfocus_null1.py" "$UPSTREAM"',
            'python3 "$GITHUB_WORKSPACE/apply_menuui4_killtrace1.py" "$UPSTREAM"',
            'python3 "$GITHUB_WORKSPACE/apply_menuui5_selfkilltrace1.py" "$UPSTREAM"',
            'python3 "$GITHUB_WORKSPACE/apply_menuui6_errororigintrace1_fix1.py" "$UPSTREAM"',
            'WINDOW_CPP="$UPSTREAM/src/emu/services/src/window/window.cpp"',
            'SVC_CPP="$UPSTREAM/src/emu/kernel/src/svc.cpp"',
            'EIK_CPP="$UPSTREAM/src/emu/services/src/ui/eikappui.cpp"',
            'CTX_CPP="$UPSTREAM/src/emu/services/src/context.cpp"',
            'grep -Fq \'SYMBIAN-SYSTEMAPPS1 MENUUI3 WINFOCUS NULL:\' "$WINDOW_CPP"',
            'grep -Fq \'SYMBIAN-SYSTEMAPPS1 MENUUI3 WINFOCUS:\' "$WINDOW_CPP"',
            'grep -Fq \'SYMBIAN-SYSTEMAPPS1 MENUUI4 THREADKILL:\' "$SVC_CPP"',
            'grep -Fq \'SYMBIAN-SYSTEMAPPS1 MENUUI5 SELFKILL:\' "$SVC_CPP"',
            'grep -Fq \'SYMBIAN-SYSTEMAPPS1 MENUUI5 FRAME:\' "$SVC_CPP"',
            'grep -Fq \'SYMBIAN-SYSTEMAPPS1 MENUUI5 STACK:\' "$SVC_CPP"',
            'grep -Fq \'SYMBIAN-SYSTEMAPPS1 MENUUI6 LEAVE_NEG1:\' "$SVC_CPP"',
            'grep -Fq \'SYMBIAN-SYSTEMAPPS1 MENUUI6 LEAVE_FRAME:\' "$SVC_CPP"',
            'grep -Fq \'SYMBIAN-SYSTEMAPPS1 MENUUI6 LEAVE_STACK:\' "$SVC_CPP"',
            'grep -Fq \'SYMBIAN-SYSTEMAPPS1 MENUUI6 NEGIPC: path=LLE\' "$SVC_CPP"',
            'grep -Fq \'SYMBIAN-SYSTEMAPPS1 MENUUI6 EIK_RESOLVE_ERROR:\' "$EIK_CPP"',
            'grep -Fq \'Unimplemented app ui session opcode 0x{:X}\' "$EIK_CPP"',
            'grep -Fq \'ctx->complete(epoc::error_none);\' "$EIK_CPP"',
            'grep -Fq \'SYMBIAN-SYSTEMAPPS1 MENUUI6 NEGIPC: path=HLE\' "$CTX_CPP"',
            '! grep -Fq \'ctx.complete(get_ws().get_current_focus_screen()->focus->id);\' "$WINDOW_CPP"',
            'grep -Fq \'thr->kill(etype, common::utf8_to_ucs2(exit_category), reason);\' "$SVC_CPP"',
            'grep -Fq \'kern->call_ipc_complete_callbacks(msg, val);\' "$SVC_CPP"',
            'git -C "$UPSTREAM" diff --check',
            "echo 'MENUUI6-ERRORORIGINTRACE1-FIX1 diagnostic-only source gates: PASS'",
        ]) + "\n"

        script = script.replace(anchor, "\n" + inject + "MENU_STEP_SCRIPT\n", 1)
        output.write_text(script, encoding="utf-8")
        digest = hashlib.sha256(script.encode("utf-8")).hexdigest()
        print(f"MENUUI6 FIX1: extracted+patched replay script sha256={digest}")
        PY_EXTRACT

        chmod +x "$REPLAY_SCRIPT"
        bash -n "$REPLAY_SCRIPT"
        bash "$REPLAY_SCRIPT"

    - name: Package MENUUI6 ERRORORIGINTRACE1 unsigned IPA
      working-directory: upstream
      run: |
        set -euo pipefail
        LOG="$GITHUB_WORKSPACE/eka2l1-java-build.log"
        touch "$LOG"
        exec > >(tee -a "$LOG") 2>&1
        echo "=== STEP: Package MENUUI6 ERRORORIGINTRACE1 unsigned IPA ==="

        APP="build-ios-device/src/emu/ios/eka2l1.app"
        BIN="$APP/eka2l1"
        IPA="EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI6-ERRORORIGINTRACE1-unsigned.ipa"
        STAGE="ipa-stage-menuui6-errororigintrace1"
        STRINGS_OUT="$RUNNER_TEMP/menuui6-errororigintrace1.binary.strings"
        IPA_LIST="$RUNNER_TEMP/menuui6-errororigintrace1.ipa-list.txt"

        test -d "$APP"
        test -x "$BIN"

        strings "$BIN" > "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI6 LEAVE_NEG1:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI6 LEAVE_FRAME:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI6 LEAVE_STACK:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI6 EIK_RESOLVE_ERROR:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI6 NEGIPC:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI5 SELFKILL:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI5 FRAME:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI5 STACK:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI4 THREADKILL:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI3 WINFOCUS NULL:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI3 WINFOCUS:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI2 FS27 PRE:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI2 LEAVE RETURN:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI2 SVCMISS:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI1 VIEW19: raw={} final=19 complete=KErrNone' "$STRINGS_OUT"
        echo 'MENUUI6 FIX1 + MENUUI5 + MENUUI4 + MENUUI3 + MENUUI2 + VIEW19 binary markers: PASS'

        rm -rf "$STAGE" "$IPA"
        mkdir -p "$STAGE/Payload"
        cp -R "$APP" "$STAGE/Payload/EKA2L1.app"
        rm -rf "$STAGE/Payload/EKA2L1.app/_CodeSignature"
        rm -f "$STAGE/Payload/EKA2L1.app/embedded.mobileprovision"

        (cd "$STAGE" && /usr/bin/zip -qry "../$IPA" Payload)
        /usr/bin/unzip -t "$IPA" >/dev/null
        /usr/bin/unzip -l "$IPA" > "$IPA_LIST"
        grep -Fq 'Payload/EKA2L1.app/eka2l1' "$IPA_LIST"
        test -s "$IPA"
        shasum -a 256 "$IPA"
        echo 'MENUUI6 ERRORORIGINTRACE1 FIX1 unsigned IPA package: PASS'

    - name: Upload MENUUI6 ERRORORIGINTRACE1 IPA
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI6-ERRORORIGINTRACE1-IPA
        path: upstream/EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI6-ERRORORIGINTRACE1-unsigned.ipa
        if-no-files-found: error
        retention-days: 14

    - name: Upload diagnostic log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI6-ERRORORIGINTRACE1-diagnostic-log
        path: eka2l1-java-build.log
        if-no-files-found: warn
        retention-days: 14
