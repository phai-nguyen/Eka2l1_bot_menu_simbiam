name: Build EKA2L1 SYMBIAN SYSTEMAPPS1 MENUUI25 APPSERVICE1 NOJAVA MANIC3 IPA

"on":
  workflow_dispatch:
  push:
    paths:
      - ".github/menuui25-appservice1-trigger.txt"

permissions:
  contents: read

jobs:
  build-app:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
    - name: Checkout project
      uses: actions/checkout@v4

    - name: Restore MENUUI25 APPSERVICE1 cache
      id: menuui25_cache
      uses: actions/cache/restore@v4
      with:
        path: upstream
        key: eka2l1-menuui25-appservice1-nojava-manic3-macos15-v1

    - name: Restore MENUUI24 AKN-ZORDER1 baseline
      id: menuui24_cache
      if: steps.menuui25_cache.outputs.cache-hit != 'true'
      uses: actions/cache/restore@v4
      with:
        path: upstream
        key: eka2l1-menuui24-akn-zorder1-nojava-manic3-macos15-v1

    - name: Apply MENUUI25 AppArc service discovery fix and rebuild
      if: steps.menuui25_cache.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail
        LOG="$GITHUB_WORKSPACE/eka2l1-menuui25-appservice1.log"
        : > "$LOG"
        exec > >(tee -a "$LOG") 2>&1

        test "${{ steps.menuui24_cache.outputs.cache-hit }}" = "true"

        UPSTREAM="$GITHUB_WORKSPACE/upstream"
        PATCHER="$GITHUB_WORKSPACE/apply_menuui25_appservice1.py"
        CMAKE_BIN="$UPSTREAM/.tools/cmake-3.31.6-macos-universal/CMake.app/Contents/bin/cmake"
        COMMON="$UPSTREAM/src/emu/services/include/services/applist/common.h"
        APPLIST_H="$UPSTREAM/src/emu/services/include/services/applist/applist.h"
        APPLIST="$UPSTREAM/src/emu/services/src/applist/applist.cpp"
        REG="$UPSTREAM/src/emu/services/src/applist/registeration.cpp"
        OP="$UPSTREAM/src/emu/services/include/services/applist/op.h"
        OOM="$UPSTREAM/src/emu/services/src/ui/cap/oom_app.cpp"
        KERNEL="$UPSTREAM/src/emu/kernel/src/kernel.cpp"
        SVC="$UPSTREAM/src/emu/kernel/src/svc.cpp"
        ROOT="$UPSTREAM/src/emu/ios/app/RootViewController.mm"

        test -x "$CMAKE_BIN"
        test -s "$PATCHER"
        python3 -m py_compile "$PATCHER"
        python3 "$PATCHER" "$UPSTREAM"

        # MENUUI25 root-cause gates.
        grep -Fq 'struct apa_app_service_info' "$COMMON"
        grep -Fq 'std::vector<apa_app_service_info> services;' "$APPLIST_H"
        grep -Fq 'APP_FILTER_BY_SERVICE' "$APPLIST_H"
        grep -Fq 'read_data_type_array' "$REG"
        grep -Fq 'opaque_resource_id_' "$REG"
        grep -Fq 'case applist_request_init_server_applist:' "$APPLIST"
        grep -Fq 'case applist_request_get_service_implementations:' "$APPLIST"
        grep -Fq 'serialize_service_impl_array' "$APPLIST"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI25 SERVER_APPLIST:' "$APPLIST"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI25 SERVICE_IMPL:' "$APPLIST"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI25 SERVICE_REG:' "$APPLIST"
        grep -Fq 'applist_request_init_server_applist' "$OP"
        grep -Fq 'applist_request_get_service_implementations' "$OP"
        grep -Fq 'static_assert(applist_request_init_server_applist == 46' "$APPLIST"
        grep -Fq 'static_assert(applist_request_get_service_implementations == 48' "$APPLIST"

        # Preserve proven lineage.
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI24 AKN_ZORDER:' "$OOM"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI24 HIDE_FSW:' "$OOM"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI23 APPTYPE:' "$APPLIST"
        grep -Fq 'case applist_request_get_app_type:' "$APPLIST"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI22 SCHEDRUN_SVC:' "$KERNEL"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI22 SYNC_SEND:' "$SVC"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI22 SYNC_COMPLETE:' "$SVC"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI22 WAIT_OWNER:' "$SVC"
        grep -Fq 'MANIC_MODALFIX1' "$ROOT"

        # NOJAVA stays absolute.
        test ! -e "$UPSTREAM/src/emu/j2me"
        ! find "$UPSTREAM/build-ios-device" -type f -name 'libj2me.a' -print -quit | grep -q .
        ! grep -Fq '0xB031C52A' "$APPLIST"
        ! grep -Fq '0x10210E26' "$APPLIST"

        git -C "$UPSTREAM" diff --check

        "$CMAKE_BIN" --build "$UPSTREAM/build-ios-device" --target eka2l1 --parallel 4

        APP="$UPSTREAM/build-ios-device/src/emu/ios/eka2l1.app"
        BIN="$APP/eka2l1"
        test -x "$BIN"
        test -f "$APP/EKAManicControls/dpad.png"

        STRINGS_OUT="$RUNNER_TEMP/menuui25-appservice1.strings"
        strings "$BIN" > "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI25 SERVER_APPLIST:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI25 SERVICE_IMPL:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI25 SERVICE_REG:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI24 AKN_ZORDER:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI23 APPTYPE:' "$STRINGS_OUT"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI22 SCHEDRUN_SVC:' "$STRINGS_OUT"
        grep -Fq 'Manic Skin' "$STRINGS_OUT"
        ! grep -Eiq 'phoneME|JAVA-STABLE1|MMAPI-DIAG2|GM-SYNTH1 renderer=gm-sf2' "$STRINGS_OUT"

        {
          echo 'MENUUI25 APPSERVICE1 NOJAVA MANIC3 BUILD AUDIT'
          echo 'base_cache=MENUUI24_AKN_ZORDER1_NOJAVA_MANIC3'
          echo 'device_evidence=New_message_blocks_after_UniMtms_on_AppList_opcode_46'
          echo 'opcode_46=InitServerAppList_IMPLEMENTED'
          echo 'opcode_48=GetServiceImplementations_IMPLEMENTED'
          echo 'service_registry=PARSED'
          echo 'service_opaque_data=RESOLVED'
          echo 'symbian_stream_serialization=IMPLEMENTED'
          echo 'buffer_resize_handshake=IMPLEMENTED'
          echo 'forced_process_kill=NOT_ADDED'
          echo 'scheduler_change=NONE'
          echo 'canvas_change=NONE'
          echo 'menuui24_akn_zorder=PRESERVED'
          echo 'menuui23_apptype1=PRESERVED'
          echo 'menuui22_schedrun=PRESERVED'
          echo 'manic3_modalfix=PRESERVED'
          echo 'java_j2me=REMOVED'
        } > "$GITHUB_WORKSPACE/MENUUI25-APPSERVICE1-BUILD-AUDIT.txt"

        git -C "$UPSTREAM" diff > "$GITHUB_WORKSPACE/MENUUI25-APPSERVICE1-source.diff"
        echo 'MENUUI25 APPSERVICE1 NOJAVA MANIC3 build: PASS'

    - name: Verify restored MENUUI25 APPSERVICE1 cache
      if: steps.menuui25_cache.outputs.cache-hit == 'true'
      run: |
        set -euo pipefail
        UPSTREAM="$GITHUB_WORKSPACE/upstream"
        APPLIST="$UPSTREAM/src/emu/services/src/applist/applist.cpp"
        OOM="$UPSTREAM/src/emu/services/src/ui/cap/oom_app.cpp"
        APP="$UPSTREAM/build-ios-device/src/emu/ios/eka2l1.app"

        test -x "$APP/eka2l1"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI25 SERVER_APPLIST:' "$APPLIST"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI25 SERVICE_IMPL:' "$APPLIST"
        grep -Fq 'SYMBIAN-SYSTEMAPPS1 MENUUI24 AKN_ZORDER:' "$OOM"
        test ! -e "$UPSTREAM/src/emu/j2me"

        {
          echo 'MENUUI25 APPSERVICE1 NOJAVA MANIC3 BUILD AUDIT'
          echo 'cache_hit=true'
          echo 'opcode_46=IMPLEMENTED'
          echo 'opcode_48=IMPLEMENTED'
          echo 'java_j2me=REMOVED'
        } > "$GITHUB_WORKSPACE/MENUUI25-APPSERVICE1-BUILD-AUDIT.txt"
        : > "$GITHUB_WORKSPACE/MENUUI25-APPSERVICE1-source.diff"

    - name: Save MENUUI25 APPSERVICE1 cache
      if: steps.menuui25_cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: upstream
        key: eka2l1-menuui25-appservice1-nojava-manic3-macos15-v1

    - name: Package MENUUI25 APPSERVICE1 unsigned IPA
      run: |
        set -euo pipefail
        APP="$GITHUB_WORKSPACE/upstream/build-ios-device/src/emu/ios/eka2l1.app"
        IPA="$GITHUB_WORKSPACE/upstream/EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI25-APPSERVICE1-NOJAVA-MANIC3-unsigned.ipa"
        STAGE="$RUNNER_TEMP/ipa-stage-menuui25-appservice1"
        IPA_LIST="$RUNNER_TEMP/menuui25-appservice1-ipa-list.txt"

        rm -rf "$STAGE" "$IPA"
        mkdir -p "$STAGE/Payload"
        cp -R "$APP" "$STAGE/Payload/EKA2L1.app"
        rm -rf "$STAGE/Payload/EKA2L1.app/_CodeSignature"
        rm -f "$STAGE/Payload/EKA2L1.app/embedded.mobileprovision"
        (cd "$STAGE" && /usr/bin/zip -qry "$IPA" Payload)

        /usr/bin/unzip -t "$IPA" >/dev/null
        /usr/bin/unzip -l "$IPA" > "$IPA_LIST"
        grep -Fq 'Payload/EKA2L1.app/eka2l1' "$IPA_LIST"
        grep -Fq 'EKAManicControls/dpad.png' "$IPA_LIST"
        ! grep -Ei '\\.jar([[:space:]]|$)' "$IPA_LIST"

        shasum -a 256 "$IPA" | tee "$GITHUB_WORKSPACE/MENUUI25-APPSERVICE1-IPA-SHA256.txt"
        du -h "$IPA" | tee "$GITHUB_WORKSPACE/MENUUI25-APPSERVICE1-IPA-SIZE.txt"
        echo 'MENUUI25 APPSERVICE1 unsigned IPA package: PASS'

    - name: Upload MENUUI25 APPSERVICE1 IPA
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI25-APPSERVICE1-NOJAVA-MANIC3-IPA
        path: upstream/EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI25-APPSERVICE1-NOJAVA-MANIC3-unsigned.ipa
        if-no-files-found: error
        retention-days: 14

    - name: Upload MENUUI25 APPSERVICE1 audit
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI25-APPSERVICE1-NOJAVA-MANIC3-AUDIT
        path: |
          MENUUI25-APPSERVICE1-BUILD-AUDIT.txt
          MENUUI25-APPSERVICE1-source.diff
          MENUUI25-APPSERVICE1-IPA-SHA256.txt
          MENUUI25-APPSERVICE1-IPA-SIZE.txt
        if-no-files-found: error
        retention-days: 14

    - name: Upload diagnostic log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: EKA2L1-SYMBIAN-SYSTEMAPPS1-MENUUI25-APPSERVICE1-diagnostic-log
        path: eka2l1-menuui25-appservice1.log
        if-no-files-found: warn
        retention-days: 14
